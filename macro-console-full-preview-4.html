<script>
  window.__failedLibs = [];
  window.__loadFail = function (name) { window.__failedLibs.push(name); };
  window.addEventListener("load", function () {
    setTimeout(function () {
      var ok = window.React && window.ReactDOM && window.Recharts && window.Babel;
      if (!ok || window.__failedLibs.length) {
        var missing = [];
        if (!window.React) missing.push("React");
        if (!window.ReactDOM) missing.push("ReactDOM");
        if (!window.Recharts) missing.push("Recharts");
        if (!window.Babel) missing.push("Babel");
        window.__failedLibs.forEach(function (n) { if (missing.indexOf(n) === -1) missing.push(n); });
        document.getElementById("loading").style.display = "none";
        document.getElementById("load-error").style.display = "block";
        document.getElementById("load-error-detail").textContent =
          "불러오지 못한 항목: " + (missing.length ? missing.join(", ") : "알 수 없음");
      }
    }, 4000);
  });
</script>

  what: "식품과 에너지처럼 변동성이 큰 품목을 제외한 소비자물가지수입니다. 연준이 통화정책을 결정할 때 헤드라인보다 이 지표를 더 중시합니다. 유가·식품가 급등락에 흔들리지 않는 '진짜 물가 추세'를 보여주기 때문입니다.",

arc:"고용 증가 속도는 2021년 정점 이후 5년 연속 둔화했습니다. 60.6만 → 37.7만 → 25.1만 → 18.6만 → 9만 → 11만. 중요한 건 이 하강이 해고 급증 없이 진행됐다는 점입니다. 신규 실업수당 청구가 역대 최저인데 신규 고용은 부진한 지금의 조합은, 노동시장이 '무너지는' 게 아니라 '얼어붙는' 방식으로 식고 있음을 보여줍니다."},

unrate:{u:"%",lab:"연말",v:[4.7,4.1,3.9,3.6,6.7,3.9,3.5,3.7,4.1,4.4,4.2],n:["4.7%. 금융위기 이전 수준을 회복했습니다.","4.1%. 17년 만의 최저였습니다.","3.9%. 완전고용을 넘어섰는데도 임금과 물가는 조용했습니다.",
 
"3.6%로 50년 만의 최저권. 임금이 오르는데도 물가는 안 올라 필립스 곡선이 죽었다는 논쟁이 있었습니다.",
"4월 14.7% 정점 후 연말 6.7%. 회복 속도는 예상보다 훨씬 빨랐습니다.",
"3.9%로 급속 회복. 다만 참가율은 팬데믹 이전을 못 되찾았습니다.",
"3.5%. 425bp 긴축에도 실업률이 안 올라 '무통 긴축' 논쟁이 벌어졌습니다.",
"3.7%. 침체 없이 물가만 내린 해의 상징적 숫자입니다.",
"4.1%. 샴의 법칙이 발동해 침체 신호로 해석됐지만, 실제로는 이민 유입에 따른 노동공급 증가가 원인이었습니다.",
"4.4%까지 상승. 고용 둔화가 마침내 실업률에 반영되기 시작했습니다.",
"4.2%로 하락. 그러나 같은 달 참가율이 61.8%→61.5%로 급락해 '분모가 줄어 좋아진' 나쁜 하락입니다."],
arc:"실업률이 3.5%에서 4.2%로 올라온 8년이지만, 그 상승 원인은 시기마다 완전히 달랐습니다. 2024년은 노동공급 증가(이민), 2025~26년은 노동수요 감소입니다. 같은 숫자라도 참가율과 함께 봐야 하는 이유가 여기 있습니다. 실업률만 보면 2024년과 2026년이 비슷해 보이지만 내용은 정반대입니다."},

ahe:{u:"%",lab:"연말 전년비",v:[2.9,2.7,3.3,2.9,5.5,4.7,4.8,4.3,3.9,3.7,3.5],n:["2.9%. 실업률이 4.7%인데 임금이 3% 아래였습니다.","2.7%. 오히려 둔화. 이것이 필립스 곡선 논쟁의 핵심 근거였습니다.","3.3%. 마침내 3%를 넘어섰습니다.",
 
"2.9%. 실업률이 50년 최저인데도 임금이 안 올라 경제학자들을 당황시켰습니다.",
"5.5%로 급등했지만 착시입니다. 저임금 서비스직이 대량 해고되며 평균이 올라갔을 뿐입니다.",
"4.7%. 이번엔 진짜 임금 상승이었고, 구인난이 원인이었습니다.",
"4.8%로 정점. 물가 6.5%에는 못 미쳐 실질 임금은 마이너스였습니다.",
"4.3%. 물가(3.4%)를 처음으로 앞질러 실질 임금이 플러스로 돌아섰습니다.",
"3.9%. 노동시장이 식으며 임금 압력도 정상화됐습니다.",
"3.7%. 물가와 비슷해 실질 임금 증가가 거의 없었습니다.",
"3.5%. 물가와 정확히 같아 실질 임금 증가율 0%입니다. 소비자심리가 역대 최저를 찍은 물리적 이유입니다."],
arc:"이 지표가 이 대시보드에서 가장 안심되는 숫자입니다. 2022년 4.8%에서 4년 연속 내려와 3.5%가 됐습니다. 생산성(1.5%)+목표물가(2%)=3.5%가 연준이 용인하는 상한이므로 지금이 정확히 경계선입니다. 물가가 4%대까지 튄 2026년 상반기에도 임금이 안 따라갔다는 사실은, 임금-물가 나선이 작동하지 않고 있다는 뜻이고 이것이 현재 인플레가 일시적일 수 있다는 최강의 근거입니다."},

jolts:{u:"백만건",lab:"연말 구인건수",v:[5.5,5.9,7.2,6.4,6.8,11.4,11.0,8.9,7.6,7.5,7.2],n:["550만 건. 구인/실업자 배율 약 0.7배로 아직 구직자가 더 많았습니다.","590만 건. 배율이 1.0배를 처음 넘어섰습니다.","720만 건. 사상 처음 구인이 실업자를 크게 앞질렀습니다.",
 
"640만 건. 구인/실업자 배율 약 1.2배로 팬데믹 이전 정상 수준입니다.",
"680만 건. 대량 해고와 대량 구인이 동시에 일어난 기이한 해입니다.",
"1,140만 건 사상 최대. 구직자 1명당 일자리 2개. '대퇴사(Great Resignation)'의 해입니다.",
"1,100만 건. 파월 의장이 '이 지표를 낮추는 것이 목표'라고 명시적으로 언급했습니다.",
"890만 건. 해고 없이 구인만 줄이는 연준의 시나리오가 실제로 작동했습니다.",
"760만 건. 팬데믹 이전 수준에 근접했습니다.",
"750만 건. 정상화가 사실상 완료됐습니다.",
"720만 건 추정. 구인/실업자 배율 1.05배로 이제 팬데믹 이전 평균(1.2배)보다 낮습니다."],
arc:"연준이 원한 시나리오가 정확히 실현된 지표입니다. 1,140만 건에서 720만 건까지 420만 건이 사라졌는데, 그 대부분이 해고가 아니라 '채용 공고 철회'로 이뤄졌습니다. 덕분에 실업률은 0.7%p만 올랐습니다. 다만 이제 배율이 1.0배 아래로 내려가면 그때부터는 조정 여력이 사라져 실업률 상승으로 직결됩니다."},

claims:{u:"천건",lab:"연평균 주간",v:[262,244,221,218,1352,484,215,220,222,225,210],n:["26.2만 건. 안정적이었습니다.","24.4만 건. 계속 감소.","22.1만 건. 49년 만의 최저 수준이었습니다.",
 
"21.8만 건. 완전고용의 전형적 수준입니다.",
"주간 평균 135만 건. 2020년 3월 마지막 주에는 단 한 주에 약 660만 건이 접수됐습니다. 역사상 유례가 없는 숫자입니다.",
"48.4만 건. 빠르게 정상화됐지만 여전히 높았습니다.",
"21.5만 건. 긴축이 시작됐는데도 해고가 없어 '무통 긴축' 논쟁의 근거가 됐습니다.",
"22.0만 건. 은행 위기에도 해고가 늘지 않았습니다.",
"22.2만 건. 노동시장 냉각이 채용 축소로만 나타났음을 보여줍니다.",
"22.5만 건. 관세 충격에도 해고는 억제됐습니다.",
"약 21만 건, 최근 주는 18.7만 건으로 1969년 이후 최저입니다."],
arc:"2020년을 빼면 이 지표는 8년 내내 21~23만 건 좁은 밴드에 갇혀 있습니다. 놀라운 안정성입니다. 425bp 긴축도, 관세도, 전쟁도 해고를 늘리지 못했습니다. 기업들이 팬데믹 때 사람을 못 구했던 기억 때문에 인력을 붙잡아 두는 것(labor hoarding)이 구조적으로 자리 잡았습니다. 그래서 이 지표가 25만 건을 넘는 순간이 진짜 신호입니다."},

gdp:{u:"%",lab:"연간 실질성장률",v:[1.8,2.5,3,2.6,-2.2,6.1,2.5,2.9,2.8,2.0,1.9],n:["1.8%. 에너지 투자 급감과 달러 강세로 부진했습니다.","2.5%. 글로벌 동조 성장의 해였습니다.","3.0%. 대규모 감세의 효과가 나타났습니다.",
 
"2.6%. 무역전쟁에도 견조했습니다.",
"-2.2%. 2분기 연율 -28%라는 전후 최악의 분기를 포함합니다.",
"6.1%. 1984년 이후 최고 성장률이지만 기저효과가 대부분입니다.",
"2.5%. 상반기 두 분기 연속 마이너스로 '기술적 침체' 논쟁이 있었으나 고용이 강해 침체로 인정되지 않았습니다.",
"2.9%. 침체를 예측한 거의 모든 기관이 틀린 해입니다.",
"2.8%. 연착륙이 데이터로 확인됐습니다.",
"약 2.0%. 관세로 무역 항목이 크게 흔들리며 분기별 변동이 극심했습니다.",
"1.9% 추정. 1분기 2.0%는 4분기 수입 급증의 역기저 효과가 큽니다. 잠재성장률 근처의 저공비행입니다."],
arc:"2020년을 제외하면 미국 경제는 8년 내내 2~3% 사이에서 놀랍도록 일관되게 성장했습니다. 425bp 긴축도 이 궤도를 못 꺾었습니다. 다만 2025년부터 2% 아래로 내려오기 시작했고, 이는 긴축의 누적 효과와 관세 비용이 마침내 실물에 닿고 있다는 신호입니다. 침체는 아니지만 완충 여력이 사라진 상태입니다."},

indpro:{u:"%",lab:"연말 설비가동률",v:[75.5,77,78.7,77.0,74.4,76.6,79.4,78.5,77.0,77.5,77.6],n:["75.5%. 셰일 붕괴로 광업 가동률이 무너졌습니다.","77.0%. 회복 시작.","78.7%. 8년 중 두 번째로 높았습니다. 감세와 설비투자가 이끌었습니다.",
 
"77.0%. 장기 평균(79.6%)을 밑돌아 인플레 압력이 없던 이유를 설명합니다.",
"74.4%. 공장이 멈췄습니다.",
"76.6%. 회복했지만 병목으로 생산이 제약됐습니다.",
"79.4%로 정점. 장기 평균에 근접했고 이것이 2022년 인플레가 수요발이기도 했음을 보여줍니다.",
"78.5%. 하락 전환.",
"77.0%. 제조업 부진이 이어졌습니다.",
"77.5%. 관세로 리쇼어링 기대가 있었지만 가동률은 안 올랐습니다.",
"77.6%. 장기 평균을 2%p 밑돕니다. 공급 여력이 남아 있다는 뜻이라 현재 물가 상승이 수요발이 아니라는 결정적 반증입니다."],
arc:"가동률은 인플레 논쟁의 심판 역할을 합니다. 2022년 79.4%(여유 없음)와 2026년 77.6%(여유 있음)를 비교하면, 같은 4%대 물가여도 성격이 완전히 다릅니다. 2022년은 수요 초과였고 지금은 공급 충격입니다. 그래서 2022년에는 425bp 긴축이 필요했지만 지금은 동결로 대응하는 것이 논리적으로 일관됩니다."},

fomc:{u:"%",lab:"연말 기준금리 상단",v:[0.75,1.5,2.5,1.75,0.25,0.25,4.50,5.50,4.50,3.75,3.75],n:["0.75%. 12월에 1년 만에 두 번째 인상을 했습니다.","1.50%. 연 3회 인상하며 정상화가 본격화됐습니다.","2.50%. 연 4회 인상. 12월 인상 직후 증시가 급락하며 파월이 방향을 틀었습니다.",
 
"1.75%. 7·9·10월 세 차례 보험성 인하로 2.50%에서 내려왔습니다.",
"0.25%. 3월에 두 차례 긴급 인하로 제로까지 내리고 무제한 자산매입에 들어갔습니다.",
"0.25% 유지. 물가가 7%인데도 금리를 안 올린 이 판단이 최대 실책으로 평가됩니다.",
"4.50%. 한 해에 425bp. 1980년대 볼커 이후 가장 빠른 긴축입니다.",
"5.50%로 정점. 이후 14개월간 동결했습니다.",
"4.50%. 9·11·12월 세 차례 100bp 인하로 완화 사이클을 시작했습니다.",
"3.75%. 9·10·12월 다시 세 차례 인하했습니다.",
"3.75% 동결. 1·3·4·6월 네 차례 연속 동결했고, 6월에 '완화 편향' 문구가 삭제되며 점도표가 인상 우세(9표)로 뒤집혔습니다."],
arc:"제로 → 5.50% → 3.75%의 완전한 한 사이클입니다. 지금 위치가 미묘합니다. 3.75%는 중립금리 추정치(2.5~3.0%) 위이므로 여전히 긴축적이지만, PCE 전망이 3.4%까지 오르면 실질금리가 0에 근접합니다. 즉 명목금리는 그대로인데 물가가 오르면서 통화정책이 저절로 완화되는 상황이고, 이것이 6월 FOMC가 인상 쪽으로 돌아선 이유입니다."},

retail:{u:"%",lab:"연간 증가율",v:[3,4.5,4.9,3.4,0.8,19.3,9.2,3.6,2.9,4.0,3.0],n:["3.0%. 저유가로 소비 여력이 늘었습니다.","4.5%. 견조한 고용이 소비로 이어졌습니다.","4.9%. 감세 환급이 소비를 밀어올렸습니다.",
 
"3.4%. 소비가 경제를 떠받쳤습니다.",
"0.8%. 서비스 소비가 붕괴한 대신 재화 소비가 폭증해 상쇄됐습니다.",
"19.3%. 부양책 수표가 직접 소비로 갔습니다. 이 수요 폭발이 물가 폭발의 원인입니다.",
"9.2%. 대부분 물가 상승분입니다. 실질로는 훨씬 낮았습니다.",
"3.6%. 초과저축이 소진되며 정상화됐습니다.",
"2.9%. 물가를 감안하면 실질 소비는 거의 제자리였습니다.",
"4.0%. 관세 전 선구매 수요가 일시적으로 밀어올렸습니다.",
"약 3%. 6월은 자동차 제외 기준으로 마이너스 전환했습니다. 필수 지출에 밀려 재량 소비가 줄기 시작했습니다."],
arc:"이 지표를 볼 때 반드시 기억할 것은 명목 통계라는 점입니다. 2022년 9.2%가 화려해 보이지만 CPI가 6.5%였으므로 실질은 2.7%였습니다. 2026년도 마찬가지입니다. 헤드라인 증가의 상당 부분이 휘발유 가격입니다. 실질로 환산하면 미국 소비는 2023년 이후 사실상 정체 상태입니다."},

housing:{u:"천호",lab:"연간 착공",v:[1177,1209,1250,1290,1380,1601,1553,1421,1364,1300,1427],n:["117.7만 호. 완만한 회복이 이어졌습니다.","120.9만 호. 증가 지속.","125.0만 호. 다만 하반기 금리 상승으로 꺾이기 시작했습니다.",

 sched:["매월","말일 전후 (산업활동동향)","08:00 KST","7월 말 (6월분)"],

 arc:"선행지수 순환변동치는 8년간 98.5~101.5의 좁은 밴드에서 움직였습니다. 한국 경기 사이클의 진폭이 예전보다 크게 줄었다는 뜻입니다. 이유는 두 가지입니다. 잠재성장률이 낮아져 위아래 여지가 줄었고, 경제의 반도체 의존도가 높아져 다른 부문의 변동이 상쇄되기 때문입니다. 그래서 이제는 지수의 절대 수준보다 '몇 개월 연속 상승/하락인가'를 봐야 합니다."}},

 "수출 급증이 인상을 가능하게 했습니다. 2분기 GDP 전년비 +3.7%, 6월 수출 +70.9%로 경기 하방 우려가 사라져 물가와 환율에만 집중할 여유가 생겼습니다."],

 "3.50%로 정점. 1월 인상 후 연말까지 동결했습니다.",

 sched:["매월","대략 20~23일","06:00 KST","8월 21일경 (7월분)"],

 "특히 환율 효과가 큽니다. 유가가 달러 기준으로 그대로여도 원화가 10% 약해지면 원화 기준 도입 단가는 10% 오릅니다. 환율이 물가를 만드는 구조입니다.",

 "약 4.5% 추정. 유가와 환율이 동시에 오르며 재급등 중입니다."],
 arc:"한국 PPI의 8년은 CPI에 정확히 1년 선행합니다. 2021년 PPI 6.4%가 2022년 CPI 5.1%를, 2023년 PPI 1.6% 급락이 2024~25년 CPI 안정을 만들었습니다. 지금 PPI가 4.5%로 오르고 있다는 사실은 2027년 CPI의 상방 위험을 뜻합니다. 그리고 이번에는 유가만이 아니라 환율까지 겹쳤다는 점이 2022년보다 나쁜 조건입니다."}},

 why:["2026년 2분기 실질 GDP가 전기 대비 +0.6%, 전년 동기 대비 +3.7% 성장했습니다. 잠재성장률(약 2.0%)을 크게 웃도는 수치입니다.",

 "반면 내수는 여전히 약합니다. 건설투자는 착공 감소의 후유증으로 마이너스이고, 민간소비도 물가 3.2%와 고환율에 눌려 실질로는 정체 상태입니다.",
 "즉 '수출은 뜨겁고 내수는 차가운' 이중 구조입니다. 3.7%라는 화려한 숫자와 소매판매 1%의 괴리가 그 실체입니다."],
 watch:"수출 기여도와 내수 기여도를 분리해서 보세요. 수출만으로 성장하는 구조는 반도체 사이클이 꺾이는 순간 급격히 무너집니다. 그리고 GDP보다 GDI를 함께 봐야 진짜 국민소득이 보입니다.",
 url:"https://www.bok.or.kr/portal/bbs/P0000559/list.do?menuNo=200788",
 yr:{u:"%",lab:"연간 실질성장률",v:[2.9,3.2,2.9,2.2,-0.7,4.3,2.6,1.4,2.0,1.0,3.0],n:["2.9%. 건설투자가 성장을 떠받쳤습니다.","3.2%. 반도체 슈퍼사이클로 3년 만에 3%를 넘었습니다.","2.9%. 반도체 호조가 이어졌지만 내수는 부진했습니다.",
 
 "2.2%. 수출 부진에도 정부 재정이 방어했습니다.",
 "-0.7%. 역성장이지만 OECD 최상위권 방어였습니다.",
 "4.3%. 11년 만의 최고. 수출 25.7% 급증이 견인했습니다.",
 "2.6%. 상반기 강세 후 하반기 급랭.",
 "1.4%. 반도체 불황으로 잠재성장률을 크게 밑돌았습니다.",
 "2.0%. 수출 회복이 내수 부진을 상쇄했습니다.",
 "약 1.0%. 관세 충격으로 잠재의 절반에 그쳤습니다.",
 "약 3.0% 추정. 2분기 전년비 +3.7%로 급반등했습니다."],
 arc:"한국의 잠재성장률은 지난 8년간 3% 근처에서 2% 아래로 내려왔습니다. 인구 감소와 생산성 정체 때문입니다. 그래서 지금의 3.7%는 과거 기준으로는 평범하지만 현재 기준으로는 잠재를 크게 넘는 수치이고, 이것이 금리 인상의 근거가 됩니다. 저성장 구조에서 금리를 올려야 하는 이 역설이 앞으로 한국의 기본 조건입니다."}},

 imp:"한국에서 GDP보다 중요할 수 있는 지표입니다. 에너지·원자재를 전량 수입하고 반도체를 수출하는 구조라, 교역조건 변화가 국민소득에 직결됩니다. 2022년처럼 유가가 오르고 반도체가 싸지면 GDP가 성장해도 국민은 가난해집니다. 지금은 정반대 상황입니다.",
 sched:["분기","GDP 속보와 동시","08:00 KST","3Q 속보 10월 하순"],
 why:["2026년 2분기 실질 GDI가 전기 대비 +3.6%, 전년 동기 대비 +15.6%를 기록했습니다. 같은 분기 GDP(+3.7%)의 네 배가 넘습니다.",
 "이 11.9%p의 격차 전체가 교역조건 개선에서 왔습니다. 반도체 단가가 급등하는 동안 수입 원자재 가격은 상대적으로 덜 올랐다는 뜻입니다.",
 "쉽게 말해 같은 양의 반도체를 팔아 훨씬 더 많은 원유를 살 수 있게 됐습니다. 한국 입장에서는 하늘에서 소득이 떨어진 것과 같습니다.",
 "이것이 2026년 한국 경제를 이해하는 열쇠입니다. 고환율이라는 악재에도 불구하고 국민소득이 늘고 있으며, 이 소득이 설비투자와 세수로 흘러가고 있습니다."],
 watch:"GDI가 GDP를 크게 웃도는 국면은 오래가지 않습니다. 반도체 단가가 꺾이거나 유가가 더 오르면 순식간에 역전됩니다. 2022년에는 GDI가 GDP보다 낮았습니다.",
 url:"https://www.bok.or.kr/portal/bbs/P0000559/list.do?menuNo=200788",

 "-0.2%. GDP가 -0.7%였는데 유가 급락으로 GDI는 덜 나빴습니다.",

 "2.2%. GDP 1.4%를 웃돌았습니다. 유가가 내려 교역조건이 회복됐습니다.",
 "3.7%. GDP 2.0%의 거의 두 배. 반도체 회복 효과입니다.",

"kospi|kgdi":[0.65,"교역조건 개선은 기업 이익의 직접적 증가입니다. GDI +15.6%는 상장사 영업이익 급증과 같은 이야기입니다."],
"kcpi|kbase":[.82,"한국은행의 물가안정목표가 CPI 2%입니다. 미국이 PCE를 쓰는 것과 달리 한국은 CPI를 그대로 목표로 삼기 때문에 이 연결이 훨씬 직접적입니다. 6월 CPI 3.2%가 7월 인상의 1차 근거였습니다."],
"kppi|kcpi":[.85,"PPI는 CPI에 3~6개월 선행합니다. 한국은 원자재를 전량 수입하므로 이 전가가 특히 빠르고 확실합니다. 2021년 PPI 6.4%가 2022년 CPI 5.1%를 만들었습니다."],
"kfx|kppi":[.80,"환율이 오르면 수입 원가가 그대로 오릅니다. 유가가 달러 기준으로 그대로여도 원화가 10% 약해지면 원화 기준 도입 단가는 10% 오릅니다. 2026년 PPI 상승의 절반이 환율 요인입니다."],
"kfx|kcpi":[.65,"환율 → 수입물가 → 소비자물가로 3~6개월 시차를 두고 전달됩니다. 통계 당국도 수입 수산물·과일에는 이미 영향이 있고 가공식품·외식으로의 파급을 지켜봐야 한다고 밝혔습니다."],
"kfx|kbase":[.70,"한국은행이 공식적으로 인정하지 않지만 실질적으로 가장 중요한 관계입니다. 환율 방어를 위해 금리를 올려야 하는 소규모 개방경제의 숙명입니다. 7월 인상의 숨은 1순위 이유가 1,550원입니다."],
"kexp|kgdp":[.88,"수출이 GDP의 약 40%입니다. 사실상 한국 경기 예측은 수출 예측입니다. 6월 수출 +70.9%가 2분기 GDP +3.7%로 직결됐습니다."],
"kexp|kgdi":[.75,"수출 물량만이 아니라 수출 '가격'이 오르면 GDI가 폭증합니다. 반도체 단가 급등이 2분기 GDI +15.6%를 만들었습니다. 같은 양을 더 비싸게 팔면 국민소득이 늘어납니다."],
"kgdi|kgdp":[.60,"보통 함께 움직이지만 교역조건이 급변하면 크게 갈립니다. 2022년 GDP +2.6% / GDI -1.1%(유가 폭등), 2026년 GDP +3.7% / GDI +15.6%(반도체 급등). 이 격차가 국민 체감의 실체입니다."],
"kexp|kca":[.85,"수출이 늘면 상품수지 흑자가 커지고 경상수지도 함께 늘어납니다. 6월 무역수지 361.5억 달러 흑자가 그대로 경상수지로 이어집니다."],
"kca|kfx":[-.30,"교과서적으로는 경상흑자가 원화 강세를 만들어야 합니다. 그런데 2026년에는 사상급 흑자에도 환율이 1,550원입니다. 국민연금·개인의 해외투자로 나가는 달러가 더 많기 때문이고, 이것이 한국 외환시장의 가장 중요한 구조 변화입니다."],
"kexp|kemp":[.35,"의외로 약합니다. 반도체·조선은 자본집약적이라 수출이 70% 늘어도 고용은 6.3만 명 증가에 그칩니다. 한국 경제의 구조적 문제이자 총량 지표와 체감 경기가 괴리되는 핵심 이유입니다."],
"kbase|khouse":[-.78,"가장 강한 역상관입니다. 가계부채가 GDP의 90%를 넘어 금리 변화가 주택 수요에 즉각 전달됩니다. 2021년 집값 +9.9%가 인상을, 2022년 인상이 -4.7%를 만든 인과가 명확합니다."],
"km2|khouse":[.75,"한국에서 유동성은 물가보다 자산으로 먼저 갑니다. 2021년 M2 12.1% → 집값 +9.9%, 2023년 M2 2.2% → 집값 -4.6%. 거의 같은 그래프입니다."],
"kcredit|kretail":[-.70,"가계부채 원리금 상환이 소비 여력을 직접 잠식합니다. 2020~21년 262조 원 급증한 부채의 상환 부담이 2022~24년 소매판매 3년 연속 마이너스를 만들었습니다. 한국이 금리 인상의 대가를 미국보다 크게 치르는 이유입니다."],
"kcredit|khouse":[.80,"집값이 오르면 대출을 받아 사고, 대출이 늘면 집값이 더 오릅니다. 한국은행이 물가만이 아니라 금융안정을 목표에 포함하는 근거이자, DSR 규제가 존재하는 이유입니다."],
"kbase|kretail":[-.62,"금리 인상은 가계부채 원리금을 통해 소비를 직접 누릅니다. 미국보다 전달이 훨씬 강합니다. 2022~23년 인상기에 소매판매가 마이너스로 돌아선 것이 그 결과입니다."],
"kcpi|kccsi":[-.72,"물가가 오르면 심리가 나빠집니다. 다만 한국은 유류세 인하 같은 재정 완충이 있어 미국보다 반응이 완만합니다. 미시간지수가 44.8로 붕괴할 때 CCSI는 100 위를 지켰습니다."],
"kgdp|kemp":[.40,"성장이 고용으로 잘 이어지지 않습니다. 성장의 원천이 자본집약적 수출이기 때문입니다. 미국보다 훨씬 약한 이 고리가 한국의 '고용 없는 성장' 문제입니다."],
"kretail|kccsi":[.55,"심리가 좋아지면 소비가 늘지만 상관이 완벽하지는 않습니다. 심리가 100을 넘어도 부채 상환 부담이 있으면 실제 지출은 안 늘어납니다. 2024년이 그 전형입니다."],
"kgdp|kbase":[.65,"성장세가 잠재성장률(약 2.0%)을 넘으면 수요 압력으로 물가가 오릅니다. 7월 금통위 결정문의 '성장세 강화'가 인상 근거로 명시된 것이 이 논리입니다."],
"kppi|kexp":[.45,"수출 호황은 원자재 수요를 늘려 생산자물가에 상방 압력을 줍니다. 다만 한국 PPI는 국제유가와 환율에 훨씬 크게 좌우돼 이 경로는 부차적입니다."]}

era:{
2016:["마이너스 금리 · 디플레 회귀","1월 일본은행이 사상 첫 마이너스 금리를 도입하고 9월에는 수익률곡선제어(YCC)를 시작했습니다. 그런데 그해 물가는 -0.1%, 기업물가는 -3.5%로 오히려 마이너스였습니다. 정책의 무력함이 드러난 해입니다."],
2017:["동조 성장 · 인바운드 붐","GDP 1.7%, 단칸 대기업 제조업 DI 26으로 11년 만의 최고였습니다. 유효구인배율 1.50배로 44년 만의 최고를 경신했는데도 임금은 0.4% 상승에 그쳤습니다. 일본 디플레의 핵심 미스터리입니다."],
2018:["인력난 심화 · 임금 정체","유효구인배율이 1.61배로 버블기를 넘어섰고 실업률은 2.4%로 26년 만의 최저였습니다. 그럼에도 실질 소비지출은 -0.4%였습니다. 완전고용이 소비로 이어지지 않는 구조가 굳어졌습니다."],
2019:["소비세 인상 · 저물가 지속","10월 소비세를 8%에서 10%로 올렸고 그 충격으로 4분기 성장이 크게 꺾였습니다. 물가 0.5%, 정책금리 -0.10%. 유효구인배율은 1.60배로 버블 이후 최고였습니다."],
2020:["팬데믹 · 디플레 회귀","GDP -4.2%, 물가 0.0%. 이미 마이너스 금리라 추가 인하 여지가 없어 ETF 매입과 자금공급으로 대응했고, M2가 7.6% 급증했습니다."],
2021:["마이너스 물가 · 홀로 완화","물가 -0.2%로 세계에서 유일하게 디플레였습니다. 통신요금 인하 정책 영향이 컸습니다. 경상수지는 21.5조 엔 흑자."],
2022:["엔화 급락 · 수입물가 충격","엔이 달러당 152엔까지 폭락하고 기업물가가 9.7% 폭등했습니다. 무역수지는 사상 최대인 15.7조 엔 적자. 실질임금은 -1.0%로 가계가 직격탄을 맞았습니다."],
2023:["물가 3.3% · 실질임금 -2.5%","물가가 41년 만의 최고를 찍었지만 임금이 못 따라가 실질임금이 -2.5%로 최악이었습니다. 일본은행은 YCC를 유연화하면서도 마이너스 금리는 지켰습니다."],
2024:["마이너스 금리 종료","3월 17년 만의 인상으로 마이너스 금리와 YCC를 동시에 끝냈습니다. 7월 추가 인상이 8월 글로벌 엔캐리 청산 사태를 촉발했습니다. 춘투 임금 인상률이 33년 만의 최고였습니다."],
2025:["실질임금 플러스 전환","0.50%까지 올렸습니다. 임금 3.2%에 물가가 둔화하며 실질임금이 3년 만에 플러스로 돌아섰습니다. 경상수지는 32.2조 엔으로 사상 최대."],
2026:["31년 만의 최고금리 · 숨은 인플레","6월 정책금리 1.00%. 표면 CPI는 1.7%로 목표 미달이지만 국내기업물가는 7.1%, 수입물가는 엔 기준 29.7% 폭등해 있습니다. 정부 보조금과 기업 마진이 그 격차를 떠받치는 중이고, 이것이 지금 일본 경제의 가장 큰 잠재 위험입니다."]},

 why:["일치 CI가 연초 116에서 완만하게 내려오고 있습니다. 급락은 아니지만 방향은 아래입니다.",
 "원인은 중동 정세에 따른 자원 가격 상승과 원재료·부품 조달 제약입니다. 생산 관련 계열지표가 먼저 반응하고 있습니다.",
 "반면 고용 관련 계열은 버티고 있습니다. 인력 부족이 워낙 심해 기업들이 생산이 줄어도 사람을 놓지 않기 때문입니다.",
 "선행지수를 함께 봐야 합니다. 선행이 일치보다 먼저 꺾이면 하반기 둔화가 확정적이고, 선행이 반등하면 지금의 조정은 일시적입니다."],
 watch:"숫자보다 내각부의 기조판단 문구를 보세요. '개선'에서 '족제'로, 다시 '악화'로 바뀌는 순간이 실질적인 경기 전환 선언입니다.",
 url:"https://www.esri.cao.go.jp/jp/stat/di/di.html",
 yr:{u:"pt",lab:"연말 일치 CI",v:[96,100,98,94,88,93,99,114,116,115,114],n:["96. 상반기 부진 후 회복했습니다.","100. 경기 확장이 이어졌습니다.","98. 무역전쟁과 자연재해로 하락 전환했습니다.",
 
 "94. 소비세 인상과 미중 무역분쟁으로 하강 국면이었습니다.",

 "99. 재개방과 함께 개선됐습니다.",
 "114. 기준 개정 영향이 있지만 실체적으로도 개선 국면이었습니다.",

 "약 115. 관세 우려로 상승세가 멈췄습니다.",
 "약 114. 중동발 공급 제약으로 완만한 하강 중입니다."],
 arc:"경기동향지수는 2020년 5월을 골로 찍고 5년 넘게 확장 국면을 이어왔습니다. 전후 최장 확장기록에 근접하는 길이입니다. 다만 확장의 강도는 매우 약합니다. 일본의 경기 확장은 항상 '길지만 얕은' 형태였고, 그래서 국민이 확장을 체감하지 못하는 현상이 반복됩니다. 지금의 완만한 하강이 조정인지 전환인지가 2026년 하반기 최대 관심사입니다."}},

{id:"jrate",fam:"금리·정책",org:"일본은행 BOJ",src:"日本銀行 金融政策決定会合",name:"기준금리",
 sub:"1.00% · 2026년 6월 16일 인상",val:1.00,prev:0.75,unit:"%",good:"flat",chart:"step",
 series:[["25Q2",0.50,1],["25Q3",0.50,1],["25Q4",0.75,1],["26Q1",0.75,1],["26Q2",1.00,1]],
 extra:[["6/16 결정","0.75% → 1.00% (1995년 이래 최고)"],["4월 회의","6대3 동결 (3명이 1% 주장)"],["FY26 성장 전망","1.0% → 0.5% 하향"],["FY26 근원물가 전망","1.9% → 2.8% 상향"]],
 what:"일본은행이 정하는 무담보 콜금리(익일물) 유도 목표입니다. 2016~2024년 8년간 마이너스였고 수익률곡선제어(YCC)로 장기금리까지 직접 통제했던, 세계에서 유례없는 실험을 했습니다.",
 imp:"일본은 세계 최대 순대외채권국이자 엔캐리 트레이드의 자금 공급원입니다. 일본 금리가 오르면 해외에 나가 있던 엔화 자금이 회수되며 글로벌 자산 가격이 흔들립니다. 2024년 8월 세계 증시 급락이 그 사례입니다. 한국 투자자에게 남의 나라 금리가 아닌 이유입니다.",
 sched:["연 8회","2026 잔여: 7/30-31, 9월, 10월, 12월","정오 전후 발표 · 15:30 총재회견","7월 31일"],
 why:["6월 16일 정책금리를 0.75%에서 1.00%로 올렸습니다. 1995년 이래 31년 만의 최고 수준입니다.",
 "직전 4월 회의는 6대3 동결이었고, 반대한 3명이 1% 인상을 주장했습니다. 중동 긴장이 물가 위험을 위쪽으로 기울였다는 논리였고, 결국 6월에 관철됐습니다.",
 "4월 전망 수정이 이 국면의 성격을 드러냅니다. 2026년도 성장 전망은 1.0%에서 0.5%로 낮추면서 근원물가 전망은 1.9%에서 2.8%로 크게 올렸습니다. 성장은 낮추고 물가는 올리는 스태그플레이션 진단입니다.",
 "인상의 진짜 근거는 물가가 아니라 임금입니다. 현금급여총액이 3%대를 유지하고 실질임금이 플러스로 돌아섰기 때문입니다. 표면 CPI 1.7%만 보면 인상이 이해가 안 되지만, 임금을 보면 논리가 맞습니다."],
 watch:"미일 금리차가 엔화를 결정합니다. 일본이 올리고 미국이 동결하면 금리차가 줄어 엔이 강해지고, 그러면 엔캐리 청산 압력이 생겨 글로벌 위험자산에 부담이 됩니다.",
 url:"https://www.boj.or.jp/mopo/mpmdeci/index.htm",
 yr:{u:"%",lab:"연말 정책금리",v:[-0.1,-0.1,-0.1,-0.10,-0.10,-0.10,-0.10,-0.10,0.25,0.50,1.00],n:["-0.10%. 1월에 사상 첫 마이너스 금리를 도입했고 9월 YCC를 시작했습니다.","-0.10%. 유지.","-0.10%. 유지. 세계가 긴축할 때 일본만 완화였습니다.",
 
 "-0.10%. 마이너스 금리 4년차.",
 "-0.10%. 더 내릴 여지가 없어 ETF 매입 확대로 대응했습니다.",
 "-0.10%. 세계가 긴축을 준비할 때 홀로 완화를 유지했습니다.",
 "-0.10%. 엔이 152엔까지 폭락했는데도 고수했습니다. 이 고집이 수입물가 충격을 키웠습니다.",
 "-0.10%. YCC를 단계적으로 유연화했지만 금리는 그대로였습니다.",
 "0.25%. 3월 17년 만의 인상으로 마이너스 금리와 YCC를 동시에 종료했습니다.",
 "0.50%. 춘투에서 33년 만의 최대 임금 인상률이 나오며 정상화에 확신이 생겼습니다.",
 "1.00%. 6월 16일 인상으로 31년 만의 최고. 임금 3%대 정착이 진짜 근거입니다."],
 arc:"마이너스 0.10%에서 1.00%까지, 8년간 단 110bp 올렸습니다. 미국이 같은 기간 제로에서 5.50%까지 갔다 온 것과 비교하면 극도로 느립니다. 이 속도 차이가 2022년 엔화 폭락의 원인이었고, 지금 미국이 멈추고 일본이 계속 올리며 그 격차가 좁혀지는 국면입니다. 엔화 방향과 글로벌 유동성을 읽는 핵심 축입니다."}},

{id:"jcgpi",fam:"물가",org:"일본은행 BOJ",src:"日本銀行 企業物価指数 (CGPI)",name:"기업물가지수 (국내·수출입)",
 sub:"국내기업물가 전년비 · 2026년 6월 속보",val:7.1,prev:6.5,unit:"%",good:"down",chart:"line",est:1,ref:0,
 series:[["1월",3.2],["2월",3.8],["3월",5.0],["4월",5.9],["5월",6.5],["6월",7.1,1]],
 extra:[["국내기업물가 MoM","+0.4%"],["수입물가 (엔 기준)","+29.7% YoY"],["수출물가 (엔 기준)","+20.7% YoY"],["CPI와의 격차","+5.4%p"]],
 what:"기업 간 거래 가격을 재는 지수로 미국 PPI에 해당합니다. 국내기업물가·수출물가·수입물가 세 가지가 함께 나오며, 수출입 물가는 계약통화 기준과 엔 기준 두 가지로 발표됩니다. 이 두 기준의 차이가 곧 환율 효과입니다.",
 imp:"이 대시보드에서 지금 가장 중요한 일본 지표입니다. 국내기업물가가 7.1%, 수입물가가 엔 기준 29.7%인데 소비자물가는 1.7%에 불과합니다. 5%p가 넘는 이 격차는 어딘가에서 흡수되고 있다는 뜻이고, 그 어딘가는 정부 보조금과 기업 마진입니다. 둘 다 무한정 버틸 수 없습니다.",
 sched:["매월","약 10~13일","08:50 JST","8월 12일경 (7월분)"],
 why:["6월 국내기업물가가 전월비 +0.4%, 전년비 +7.1%로 가속하고 있습니다. CPI 1.7%와 5.4%p나 벌어져 있습니다.",
 "더 극단적인 것은 수입물가입니다. 엔 기준 전년비 +29.7%인데 계약통화 기준으로는 전월비 +0.1%에 불과합니다. 즉 상승의 대부분이 엔화 약세 때문입니다.",
 "수출물가도 엔 기준 +20.7%지만 계약통화 기준으로는 전월비 -0.4%입니다. 일본 기업이 해외에서 값을 올린 게 아니라, 엔으로 환산하니 커 보이는 것입니다.",
 "이 구조가 만드는 결과는 명확합니다. 수입 원가는 30% 올랐는데 소비자가격은 1.7%만 올랐으므로, 그 차이만큼 기업 마진이 깎이거나 정부가 보조금으로 메우고 있습니다. 단칸 경상이익 계획이 마이너스인 이유가 여기 있습니다."],
 watch:"이 지표와 CPI의 격차가 일본 경제의 압력계입니다. 격차가 좁혀지는 방식이 둘 중 하나입니다. 원유가 내려서 기업물가가 떨어지거나, 전가가 시작돼 CPI가 오르거나. 후자면 일본은행은 추가 인상으로 갑니다.",
 url:"https://www.boj.or.jp/statistics/pi/index.htm",
 yr:{u:"%",lab:"연평균 국내기업물가",v:[-3.5,2.3,2.6,0.2,-1.2,4.6,9.7,4.1,2.3,2.5,7.1],n:["-3.5%. 8년 중 최저. 유가 폭락과 엔 강세가 겹쳤습니다.","2.3%. 원자재 회복으로 플러스 전환.","2.6%. 유가 상승이 반영됐습니다.",
 
 "0.2%. 안정적이었습니다.",
 "-1.2%. 원유 급락으로 마이너스였습니다.",
 "4.6%. 공급망 병목이 시작됐습니다.",
 "9.7%로 사상 최고권. 원자재 급등과 엔 폭락이 겹쳤고, 이것이 이듬해 CPI 3.3%를 만들었습니다.",
 "4.1%. 둔화했지만 CPI로의 전가가 본격화된 해입니다.",
 "2.3%. 정상화.",
 "약 2.5%. 안정적이었습니다.",
 "7.1%. 이란 사태와 엔 약세가 겹쳐 재급등했습니다. 수입물가는 엔 기준 29.7%."],
 arc:"기업물가와 소비자물가의 관계가 일본 인플레이션의 전부입니다. 2022년 기업물가 9.7%가 2023년 CPI 3.3%로 전가되기까지 약 1년이 걸렸습니다. 지금 기업물가가 다시 7.1%입니다. 같은 시차가 작동한다면 2027년 CPI는 지금보다 훨씬 높아집니다. 표면 CPI 1.7%를 보고 '일본은 아직 물가가 낮다'고 판단하면 위험한 이유입니다."}},

{id:"jm2",fam:"금리·정책",org:"일본은행 BOJ",src:"日本銀行 マネーストック統計 (M2·M3) · 本源通貨(マネタリーベース)",name:"통화량 (M2·M3) & 본원통화",
 sub:"M2 기준 전년비 증가율",val:1.2,prev:1.0,unit:"%",good:"flat",chart:"line",est:1,
 series:[["1월",1.0],["2월",1.0],["3월",1.1],["4월",1.1],["5월",1.2],["6월",1.2]],
 extra:[["M3 전년비","약 +1.7%(M2보다 근소하게 높음)"],["본원통화(마네타리베이스)","약 +0.5%(양적긴축 여파로 둔화)"],["2020년 M2 정점","+7.6%"],["구성","현금+예금+정기성예금"]],
 what:"M2는 현금과 은행 예금을 합한 통화량입니다. 일본은행은 M1(현금+요구불), M2, M3, 광의유동성 네 가지를 함께 발표합니다. 중앙은행이 공급하는 본원통화(마네타리베이스)와 달리 실제로 경제에 돌아다니는 돈의 양입니다.",
 imp:"일본은 20년 넘게 본원통화를 대량 공급했지만 M2는 거의 늘지 않았습니다. 중앙은행이 돈을 찍어도 은행이 대출하지 않으면 시중에 돈이 안 도는 것인데, 이 현상이 양적완화 무용론의 근거였습니다. 지금 금리 정상화 국면에서 M2가 어떻게 반응하는지가 통화정책 전달 경로가 살아났는지를 보여줍니다.",
 sched:["매월","약 10~15일","08:50 JST","8월 12일경 (7월분)"],
 why:["M2 증가율이 1%대에 머물러 있습니다. 물가 상승률(CPI 1.7%)보다 낮아 실질 통화량은 오히려 줄고 있습니다.",
 "2020년 팬데믹 때 7.6%까지 치솟았던 것과 대조적입니다. 당시는 정부 지원금이 그대로 예금으로 쌓인 결과였습니다.",
 "지금 M2가 안 늘어난다는 것은 두 가지를 뜻합니다. 대출 수요가 약하거나, 가계가 예금을 빼서 투자·소비로 돌리고 있거나입니다. 신NISA 확대 이후 후자의 영향도 있습니다.",
 "통화량이 늘지 않는데 물가가 오르는 지금 상황은 화폐수량설로 설명되지 않습니다. 일본의 인플레이션이 통화적 현상이 아니라 수입 비용 충격이라는 또 하나의 증거입니다."],
 watch:"M2 증가율이 물가 상승률을 넘어서면 실질 통화량이 늘어 수요발 인플레가 시작된 신호입니다. 지금은 정반대이므로 일본은행이 서둘러 올릴 이유가 크지 않다는 반론의 근거가 됩니다.",
 url:"https://www.boj.or.jp/statistics/money/ms/index.htm",
 yr:{u:"%",lab:"연평균 M2 증가율",v:[3.4,3.9,2.9,2.4,7.6,5.6,3.3,2.5,1.3,1.0,1.2],n:["3.4%. 마이너스 금리에도 통화량은 크게 안 늘었습니다.","3.9%. 소폭 확대.","2.9%. 양적완화의 한계가 드러났습니다.",
 
 "2.4%. 완화 정책에도 통화량은 완만하게만 늘었습니다.",
 "7.6%로 사상 최고. 정부 지원금이 예금으로 쌓인 결과입니다.",
 "5.6%. 팬데믹 예금이 남아 있었습니다.",
 "3.3%. 소비 재개로 예금이 풀리며 증가율이 둔화했습니다.",
 "2.5%. 정상화.",
 "1.3%. 신NISA 시행으로 예금이 투자로 이동했습니다.",
 "약 1.0%. 역사적 저수준입니다.",

 why:["6월 종합 CPI는 1.7%로 연중 최고입니다. 코어는 1.6%로 5개월 연속 일본은행 목표 2%를 밑돌았습니다.",

 "핵심은 코어코어입니다. 1.8%에서 1.7%로 오히려 내렸습니다. 일본은행이 진짜 수요 압력을 재는 지표가 약해지고 있다는 뜻이라 표면과 반대 방향입니다."],
 watch:"기업물가 7.1%와 CPI 1.7%의 5.4%p 격차가 핵심입니다. 정부 보조금이 종료되거나 기업이 전가를 시작하면 CPI가 급등할 여지가 크게 남아 있습니다.",
 url:"https://www.stat.go.jp/data/cpi/",
 yr:{u:"%",lab:"연평균 전년비",v:[-0.1,0.5,1,0.5,0.0,-0.2,2.5,3.3,2.7,3.0,1.7],n:["-0.1%. 마이너스 금리를 도입한 해에 물가는 오히려 마이너스였습니다.","0.5%. 소폭 플러스.","1.0%. 목표 2%의 절반에 그쳤습니다.",

 "2.7%. 3월 마이너스 금리 종료의 근거가 됐습니다.",
 "약 3.0%. 쌀값 폭등이 식료품 물가를 밀어올렸습니다.",
 "1.7%. 정부 보조금이 원유 충격을 흡수해 오히려 다른 나라보다 낮습니다."],
 arc:"일본 물가의 8년은 '디플레 → 수입물가 충격 → 정상화'의 경로입니다. 결정적 관찰은 2022~23년 물가 상승이 수요가 아니라 엔화 약세에서 왔다는 점입니다. 그래서 일본은행이 물가 3.3%에도 완화를 고수한 것이 논리적으로는 일관됩니다. 지금 물가 1.7%인데 금리를 올리는 것도 같은 논리입니다. 표면 물가가 아니라 임금이 뒷받침하는 기저 물가를 보기 때문입니다."}},

{id:"junemp",fam:"고용",org:"총무성 통계국",src:"総務省統計局 労働力調査",name:"완전실업률",

 "인력 부족은 여전히 뿌리 깊습니다. 이것이 기업의 임금 인상을 강제하는 힘이고, 일본은행이 금리를 올릴 수 있는 근본 배경입니다."],

 imp:"일본 노동시장의 수급을 가장 직접적으로 보여줍니다. 특히 함께 발표되는 '정사원 유효구인배율'이 중요합니다. 전체는 1.17배인데 정사원은 0.99배라는 것은, 넘치는 일자리가 대부분 비정규직이라는 뜻입니다. 이 격차가 일본 임금이 오래 오르지 않았던 구조적 이유입니다.",
 sched:["매월","말일 전후 (실업률과 동시)","08:30 JST","7월 31일 (6월분)"],

 "정사원 유효구인배율은 0.99배로 여전히 1을 밑돕니다. 정규직 자리를 원하는 사람이 정규직 일자리보다 많다는 뜻이고, 이 구조가 몇 년째 바뀌지 않고 있습니다.",
 "신규구인배율은 5월 2.11배로 높은 수준입니다. 신규구인배율은 유효구인배율에 선행하므로, 당장 노동시장이 급랭할 조짐은 없습니다."],
 watch:"전체 배율보다 정사원 배율(0.99배)을 보세요. 이 숫자가 1을 확실히 넘어야 임금 상승이 구조적으로 지속됩니다. 그리고 신규구인배율이 먼저 꺾이는지가 조기 경보입니다.",
 url:"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/gyousei/index.html",
 yr:{u:"배",lab:"연평균 유효구인배율",v:[1.36,1.5,1.61,1.60,1.18,1.13,1.28,1.31,1.25,1.20,1.17],n:["1.36배. 25년 만의 최고였습니다.","1.50배. 44년 만의 최고를 경신했습니다.","1.61배. 8년 중 최고. 버블기를 넘어선 인력난이었습니다.",
 
 "1.60배로 버블 이후 최고. 극심한 인력 부족의 해였습니다.",
 "1.18배. 팬데믹으로 급락했습니다.",
 "1.13배로 저점. 회복이 가장 늦은 지표였습니다.",
 "1.28배. 재개방으로 회복했습니다.",
 "1.31배. 인력 부족이 다시 심해졌습니다.",
 "1.25배. 완만한 하락 전환.",
 "1.20배. 하락 지속.",
 "1.17배. 8년 중 2021년 다음으로 낮습니다. 다만 절대 수준은 여전히 1을 넘습니다."],
 arc:"2019년 1.60배에서 2026년 1.17배까지 꾸준히 내려왔습니다. 일자리는 여전히 남아돌지만 여유가 크게 줄었다는 뜻입니다. 흥미로운 역설이 있습니다. 배율이 내려가는 동안 임금은 오히려 올랐습니다. 배율의 절대 수준보다 '어떤 일자리인가'가 중요해졌기 때문입니다. 정사원 배율 0.99배가 1을 넘는 순간이 일본 임금의 진짜 전환점이 될 것입니다."}},

{id:"jwage",fam:"고용",org:"후생노동성 MHLW",src:"厚生労働省 毎月勤労統計調査",name:"명목 · 실질 임금",
 sub:"현금급여총액 전년비 · 2026년 4월",val:3.5,prev:3.3,unit:"%",good:"up",chart:"line",est:1,
 series:[["1월",3.2],["2월",3.3],["3월",3.4],["4월",3.5,1],["5월",3.5],["6월",3.5]],
 s2:[["1월",1.6],["2월",1.7],["3월",1.8],["4월",1.9,1],["5월",2.0],["6월",1.8]],

 extra:[["실질임금(4월)","+1.9%"],["공통사업소 기준","명목 +3.1% / 실질 +1.6%"],["소정내급여","+2.8% (공통사업소)"],["일반노동자 소정내","+2.6%"]],
 what:"약 3만 3천 사업체를 조사합니다. 현금급여총액(기본급+수당+상여)과 소정내급여(기본급)를 나눠 발표하고, 여기서 CPI를 뺀 것이 실질임금입니다. 표본 교체에 따른 왜곡을 줄이려고 '공통사업소 기준'을 별도로 냅니다.",
 imp:"지금 일본 통화정책의 진짜 기준입니다. 일본은행이 물가 1.7%에도 금리를 올린 이유가 여기 있습니다. 물가가 오르는 것만으로는 부족하고, 임금이 함께 올라야 '임금과 물가의 선순환'이 성립합니다. 30년 디플레이션의 본질이 임금 정체였기 때문에, 이 지표의 방향이 곧 정책의 방향입니다.",
 sched:["매월","속보 약 5~9일 · 확보 약 20일 (2개월 전)","08:30 JST","8월 6일경 (6월 속보)"],
 why:["4월 현금급여총액이 전년비 +3.5%, 실질임금이 +1.9%로 모두 견조했습니다. 공통사업소 기준으로도 명목 +3.1%, 실질 +1.6%로 양호합니다.",
 "실질임금은 2026년 들어 플러스 기조를 유지하고 있습니다. 명목임금 상승에 더해 물가 상승률 둔화가 겹친 결과입니다.",
 "가장 중요한 것은 소정내급여입니다. 공통사업소 기준 +2.8%, 일반노동자 +2.6%로 높은 신장을 유지했습니다. 상여가 아닌 기본급이 오른다는 것은 지속성이 있다는 뜻입니다.",
 "4월분에는 2026년 춘투 결과가 아직 충분히 반영되지 않았습니다. 5~8월에 걸쳐 반영이 진행되면 소정내급여는 2%대 중후반의 높은 신장을 이어갈 가능성이 큽니다."],
 watch:"실질임금 플러스는 아직 취약합니다. 정부 에너지 대책 덕에 물가가 눌려 있어서 생긴 플러스이기 때문입니다. 보조금이 종료되고 원유 전가가 시작되면 가을 이후 다시 마이너스로 돌아설 위험이 있습니다.",
 url:"https://www.mhlw.go.jp/toukei/list/30-1.html",
 yr:{u:"%",lab:"연평균 현금급여총액",v:[0.6,0.4,1.4,0.1,-1.2,0.3,2.0,1.2,2.9,3.2,3.5],n:["0.6%. 인력난에도 임금이 안 올랐습니다.","0.4%. 오히려 둔화. 일본 디플레의 핵심 미스터리입니다.","1.4%. 통계 표본 교체 논란이 있었지만 상승했습니다.",
 
 "0.1%. 완전고용인데도 임금이 오르지 않는 일본의 미스터리가 이어졌습니다.",
 "-1.2%. 상여 삭감으로 마이너스였습니다.",
 "0.3%. 회복이 매우 미약했습니다.",
 "2.0%. 물가 2.5%에 못 미쳐 실질임금은 -1.0%였습니다.",
 "1.2%. 물가 3.3%와의 격차로 실질임금 -2.5%, 8년 중 최악이었습니다.",
 "2.9%. 춘투에서 33년 만의 최대 인상률이 나왔습니다.",
 "3.2%. 실질임금이 3년 만에 플러스로 돌아섰습니다.",
 "3.5%. 4월 실질임금 +1.9%. 소정내급여도 2%대 후반으로 견조합니다."],
 arc:"이것이 일본 경제 30년 이야기의 핵심 지표입니다. 2019년 0.1%에서 2026년 3.5%까지, 임금이 마침내 움직이기 시작했습니다. 2023년 실질임금 -2.5%라는 최악의 해를 지나 2025년부터 플러스로 돌아선 궤적이, 일본은행이 마이너스 금리를 끝내고 1%까지 올린 논리의 전부입니다. 다만 지금의 실질 플러스는 정부 보조금이 물가를 눌러 만든 것이라, 기업물가 7.1%가 소비자에게 전가되기 시작하면 무너질 수 있습니다."}},

{id:"jtrade",fam:"대외·환율",org:"재무성 MOF",src:"財務省 貿易統計 (通関ベース)",name:"무역수지",
 sub:"통관 기준 · 2026년 적자 재확대",val:-2.0,prev:-0.6,unit:"조엔",good:"up",chart:"bar",est:1,ref:0,
 series:[["22년",-15.7,1],["23년",-6.6,1],["24년",-2.7,1],["25년",-0.6,1],["26년",-2.0]],
 extra:[["25년 실적","-0.6조 엔 (적자 축소)"],["22년 최악","-15.7조 엔"],["5월","중동 영향으로 적자 전환"],["일본무역회 26년도 전망","흑자 전환 (수정 전)"]],
 what:"관세청 통관 기준으로 수출액에서 수입액을 뺀 값입니다. 매월 중순에 전월 확정치가, 매월 초·중순에 상순·중순 잠정치가 나옵니다. 국제수지 기준 무역수지와는 계상 시점이 달라 숫자가 조금 다릅니다.",
 imp:"일본은 에너지와 식량을 거의 전량 수입합니다. 그래서 무역수지는 사실상 '유가 × 환율'의 함수입니다. 원유가 오르거나 엔이 약해지면 적자가 커지고, 그 적자는 다시 엔 매도 수요를 만들어 엔을 더 약하게 만듭니다. 이 되먹임 고리가 2022년 엔화 폭락의 숨은 원인이었습니다.",
 sched:["매월","약 17~20일 (전월 확정)","08:50 JST","8월 19일경 (7월분)"],
 why:["2025년 무역적자는 0.6조 엔으로 2022년 15.7조 엔 대비 크게 축소됐습니다. 3년 연속 적자 폭이 줄어든 결과입니다.",
 "축소의 주된 원인은 교역조건 개선이었습니다. 원유를 비롯한 자원 가격이 하락해 수입물가가 내려간 덕입니다.",
 "그런데 2026년 5월 무역수지가 다시 적자로 전환했습니다. 중동 정세의 영향이 이어지며 수입 단가가 뛰었기 때문입니다.",
 "일본무역회는 당초 2026년도 무역수지 흑자 전환을 전망했습니다. 원유 63달러, 엔 144원을 전제로 한 것인데, 이란 사태로 이 전제가 무너졌습니다. 전망은 대폭 수정될 가능성이 큽니다."],
 watch:"무역적자 확대는 실수요 엔 매도를 뜻합니다. 금리차가 좁혀져 엔 강세 압력이 있어도 무역적자가 커지면 상쇄됩니다. 엔화를 볼 때 금리차와 무역수지를 함께 봐야 하는 이유입니다.",
 url:"https://www.customs.go.jp/toukei/info/",
 yr:{u:"조엔",lab:"연간 무역수지 (국제수지)",v:[5.6,4.9,1.2,0.1,3.0,1.7,-15.7,-6.6,-2.7,-0.6,-2.0],n:["+5.6조 엔. 유가 폭락으로 수입액이 급감해 흑자가 컸습니다.","+4.9조 엔. 흑자 유지.","+1.2조 엔. 유가 상승으로 흑자가 급감했습니다.",
 
 "+0.1조 엔. 간신히 흑자를 유지했습니다.",
 "+3.0조 엔. 원유 급락으로 수입액이 줄어 흑자가 커졌습니다.",
 "+1.7조 엔. 흑자 유지.",
 "-15.7조 엔으로 사상 최악. 원유 급등과 엔 폭락이 동시에 왔습니다.",
 "-6.6조 엔. 자원 가격 하락으로 적자가 절반 이하로 줄었습니다.",
 "-2.7조 엔. 축소 지속.",
 "-0.6조 엔. 교역조건 개선으로 흑자 전환 직전까지 갔습니다.",
 "약 -2조 엔 추정. 중동 사태로 5월부터 적자가 재확대되고 있습니다."],
 arc:"2021년 흑자 1.7조 엔에서 2022년 적자 15.7조 엔으로. 단 1년 만에 17조 엔이 뒤집힌 이 사건이 일본 경제 구조를 드러냅니다. 원유 가격과 엔 환율이 동시에 나쁜 방향으로 움직이면 무역수지는 순식간에 무너집니다. 2023~25년의 회복은 자원 가격 하락 덕이었고, 2026년 재악화는 그 조건이 다시 뒤집혔기 때문입니다. 일본의 무역수지는 일본이 통제할 수 없는 두 변수의 함수입니다."}},

{id:"jcurrent",fam:"대외·환율",org:"재무성 MOF",src:"財務省·日本銀行 国際収支統計",name:"경상수지",

 imp:"일본을 이해하는 가장 중요한 대외 지표입니다. 일본은 물건을 팔아서가 아니라 해외 투자에서 버는 나라가 됐습니다. 2025년 제1차소득수지 41.8조 엔이 무역적자 0.6조 엔을 압도적으로 덮었습니다. 이 구조 덕에 무역적자에도 경상수지는 사상 최대 흑자를 냅니다. 엔화의 구조적 하방을 막아주는 힘의 원천입니다.",
 sched:["매월","약 8~10일 (2개월 전)","08:50 JST","8월 10일경 (6월분)"],
 why:["2025년 경상수지는 +32.2조 엔으로 비교 가능한 1996년 이후 사상 최대 흑자였습니다.",
 "견인차는 제1차소득수지 41.8조 엔입니다. 일본 기업과 투자자가 해외에 쌓아둔 자산에서 나오는 배당·이자입니다. 2021년 이후 계속 확대되는 추세입니다.",
 "무역수지는 0.6조 엔 적자였지만 2024년 2.7조 엔에서 크게 축소됐습니다. 서비스수지 -3.4조 엔, 제2차소득수지 -5.6조 엔은 여전히 적자입니다.",
 "2026년에도 경상흑자 폭은 확대되고 있습니다. 다만 여기에 함정이 있습니다. 해외에서 번 배당·이자의 상당 부분이 현지에 재투자되고 엔으로 환전되지 않습니다. 통계상 흑자가 실제 엔 매수 수요로 이어지지 않는 것입니다."],
 watch:"경상수지 흑자가 사상 최대인데 엔이 약한 이유가 여기 있습니다. 소득수지 흑자는 대부분 해외에 남습니다. 실제 환율에 영향을 주는 것은 무역수지 쪽이므로 둘을 나눠 봐야 합니다.",
 url:"https://www.mof.go.jp/policy/international_policy/reference/balance_of_payments/index.htm",

 "+19.3조 엔. 안정적 흑자 구조였습니다.",
 "+15.9조 엔. 팬데믹으로 서비스수지(관광)가 무너졌습니다.",
 "+21.5조 엔. 회복.",
 "+11.5조 엔으로 급감. 무역적자 15.7조 엔이 소득수지 흑자를 크게 잠식했습니다.",
 "+21.4조 엔. 무역적자 축소와 엔저 효과로 반등했습니다.",
 "+29.4조 엔. 엔저로 해외 투자수익의 엔 환산액이 불어났습니다.",

 why:["미일 금리차가 좁혀지는 방향입니다. 일본은 6월에 1.00%로 올렸고 미국은 3.75%에서 네 차례 연속 동결 중입니다.",
 "금리차가 2.75%p까지 줄었습니다. 2023년 5%p를 넘었던 것과 비교하면 절반 수준이고, 이것이 엔 강세 압력의 근본 원인입니다.",
 "다만 이란 사태가 반대로 작용합니다. 일본은 에너지 전량 수입국이라 원유가 오르면 결제용 달러 매수 수요가 생기고, 무역수지도 적자로 돌아섰습니다. 실수요 기반의 엔 매도입니다.",
 "당국은 4~5월 엔 매수 개입으로 대응했습니다. 금리차는 엔을 밀어올리고 유가와 무역적자는 끌어내리는 힘겨루기 상태입니다."],
 watch:"엔이 급격히 강해지면 엔캐리 청산이 시작됩니다. 그때는 일본 주식만이 아니라 전 세계 위험자산이 함께 조정받습니다. 한국 투자자도 반드시 봐야 하는 이유입니다.",

 "132엔. 10월에는 152엔까지 갔습니다. 미국은 425bp 올리고 일본은 마이너스를 고수한 결과입니다.",
 "141엔. 미일 금리차가 5%p를 넘으며 약세가 이어졌습니다.",
 "157엔. 일본이 인상을 시작했는데도 격차가 여전히 커 약세가 지속됐습니다.",
 "155엔. 미국 인하와 일본 인상으로 방향이 바뀌기 시작했습니다.",
 "약 148엔. 금리차 축소로 강세 압력이 커지는 중입니다."],
 arc:"엔화의 8년은 미일 금리차 그래프와 거의 포개집니다. 2021년 115엔에서 2024년 157엔까지의 폭락은 정확히 금리차 확대기와 겹칩니다. 지금은 그 반대 국면의 초입입니다. 일본이 계속 올리고 미국이 멈추면 금리차가 계속 줄고, 그러면 엔캐리 청산 압력이 누적됩니다. 이것이 2026~27년 글로벌 시장의 잠재적 뇌관입니다."}}

 imp:"세계 채권시장의 마지막 앵커입니다. 일본은 세계 최대 순대외채권국이고, 일본 투자자가 미국·유럽 국채를 대량 보유합니다. JGB 금리가 오르면 그 자금이 본국으로 돌아오면서 전 세계 장기금리를 밀어올립니다. 동시에 일본 정부부채가 GDP의 250%라, 금리 상승이 재정에 직접 부담이 됩니다.",

 why:["정책금리 1.00% 인상이 반영되며 10년 금리가 2% 선까지 올라왔습니다. YCC 종료 이후 시장이 가격을 결정하고 있습니다.","2019년 -0.28%였던 것과 비교하면 완전히 다른 세계입니다. 마이너스 금리 시대가 끝났다는 가장 명확한 증거입니다.","재정 부담이 커지고 있습니다. 국가부채가 GDP의 250%라 금리가 1%p 오르면 이자 비용이 GDP의 2.5%씩 늘어납니다.","동시에 미일 금리차가 좁혀지며 엔캐리 청산 압력이 쌓입니다. 일본 자금의 본국 회귀가 시작되면 미국·유럽 금리에도 상방 압력이 됩니다."],

 url:"https://www.mof.go.jp/jgbs/reference/interest_rate/",

"jjobs|junemp":[-.75,"구인이 구직보다 많으면 실업률이 내려갑니다. 다만 일본 실업률은 2%대에 고정돼 변별력이 낮아, 유효구인배율이 노동시장 온도를 훨씬 잘 보여줍니다."],
"jwage|jkakei":[.62,"실질임금이 플러스로 돌아서야 소비가 늘어납니다. 2023년 실질임금 -2.5%가 그해 실질소비 -2.6%를 만들었습니다. 거의 1대1로 움직이는 관계입니다."],
"jtankan|jgdp":[.70,"단칸 업황 DI는 설비투자 계획을 통해 GDP에 선행합니다. 다만 2026년 6월 조사는 업황 DI(+22)와 경상이익 계획(-2.1%)이 엇갈려 있어, 체감과 실적의 괴리를 주의해야 합니다."],
"jtankan|jwage":[.55,"기업 수익이 좋아야 임금을 올립니다. 단칸의 경상이익 계획이 다음 해 춘투 임금 인상률을 상당 부분 예고합니다. 지금 이익 계획이 마이너스라는 점이 2027년 임금의 위험 요인입니다."],
"jtrade|jyen":[-.65,"무역적자는 실수요 엔 매도를 뜻합니다. 금리차가 좁혀져 엔 강세 압력이 있어도 무역적자가 커지면 상쇄됩니다. 2022년 적자 15.7조 엔이 그해 엔 폭락을 증폭시킨 이유입니다."],
"jtrade|jcgpi":[-.72,"원유가 오르면 수입 단가가 뛰어 무역적자가 커지고 동시에 기업물가도 오릅니다. 같은 원인(에너지 가격)에서 나오는 두 결과라 거의 동시에 움직입니다."],
"jcurrent|jyen":[.25,"의외로 약합니다. 경상수지가 사상 최대 흑자인데도 엔이 약한 이유는, 흑자의 대부분인 제1차소득수지(해외 투자수익)가 현지에 재투자되고 엔으로 환전되지 않기 때문입니다. 통계상 흑자와 실제 엔 수요는 다릅니다."],
"jcurrent|jtrade":[.40,"경상수지의 구성 항목이지만 규모 차이가 큽니다. 2025년 무역 -0.6조 엔 vs 제1차소득 +41.8조 엔. 무역이 흔들려도 경상수지 전체는 잘 흔들리지 않는 구조입니다."],
"jm2|jcpi":[.20,"거의 관계가 없습니다. M2는 1%대인데 물가는 오르고 있습니다. 화폐수량설이 작동하지 않는다는 뜻이고, 일본 인플레가 통화가 아니라 수입 비용에서 왔다는 증거입니다."],
"jm2|jrate":[-.35,"금리가 오르면 대출이 줄어 통화 증가가 둔화합니다. 다만 일본은 20년간 본원통화를 대량 공급해도 M2가 안 늘었을 만큼 전달 경로가 약해, 관계가 흐릿합니다."],
"jgdp|jrate":[.50,"성장이 잠재(0.5~1.0%)를 넘으면 인상 여지가 생깁니다. 다만 2026년에는 성장 전망을 낮추면서도 물가 전망을 올려 인상한, 스태그플레이션형 예외 상황입니다."],
"jgdp|jkakei":[.66,"민간소비가 GDP의 절반을 넘습니다. 가계 실질소비가 살아나지 않으면 성장률도 오르지 않습니다. 일본의 30년 정체가 곧 소비 정체였습니다."],
"junemp|jkakei":[-.40,"고용이 좋아지면 소비가 늘어야 하는데 일본은 관계가 약합니다. 실업률 2%대의 완전고용 상태가 오래 지속됐음에도 소비가 안 늘었기 때문입니다. 고용의 양이 아니라 임금의 질이 문제였습니다."],
"jtankan|jcgpi":[-.45,"원가가 오르면 기업 체감이 나빠집니다. 다만 가격 전가력이 있는 비제조업은 덜 영향받아 제조업(+22)과 비제조업(+37)의 격차로 나타납니다."]}

EA: {
name:"유로존", sub:"Eurostat · 유럽중앙은행(ECB) · 유럽집행위원회(DG ECFIN) · S&P Global/HCOB · ZEW",
era:{
2016:["디플레 공포 · 브렉시트","물가가 0.2%까지 떨어져 디플레이션 우려가 정점이었습니다. ECB는 3월 예금금리를 -0.40%로 내리고 자산매입을 월 800억 유로로 확대했습니다. 6월 브렉시트 국민투표가 유럽 통합의 방향을 흔들었고, 실업률은 여전히 두 자릿수였습니다."],
2017:["유로존 호황의 정점","GDP 2.6%로 10년 만의 최고, 종합 PMI 58.1, 제조업 PMI 60.6으로 사상 최고, 경제심리지수 115.3으로 17년 만의 최고였습니다. 유로는 14% 급등했습니다. 8년을 통틀어 유로존이 가장 좋았던 해입니다."],
2018:["무역전쟁 · 정점 통과","제조업 PMI가 60.6에서 51.4로 1년 만에 9포인트 급락했습니다. 미중 무역전쟁, 독일 자동차 배기가스 규제, 이탈리아 예산 갈등이 겹쳤습니다. ZEW는 -21.0으로 추락했고, 이때부터 유로존의 긴 정체가 시작됩니다."],
2019:["저성장 · 마이너스 금리","성장 1.6%, 물가 1.2%로 목표에 한참 못 미쳤습니다. ECB는 9월 예금금리를 -0.50%로 더 내리고 자산매입을 재개했습니다. 제조업 PMI는 46.3으로 이미 수축 중이었습니다."],
2020:["팬데믹 · 최악의 역성장","GDP -6.1%로 미국(-2.2%)의 세 배 타격. 관광 의존 남유럽이 무너졌습니다. ECB는 팬데믹긴급매입(PEPP) 1.85조 유로를 도입했고 M3가 10.5% 급증했습니다."],
2021:["재개방 반등 · 병목","5.9% 성장. 제조업 PMI가 58.0으로 사상 최고권을 찍었지만 공급망 병목으로 생산이 제약됐습니다. 물가는 연말 2.6%로 목표를 넘었고 ECB는 '일시적'으로 규정했습니다."],
2022:["전쟁 · 물가 8.4%","러시아 가스 차단으로 에너지가 폭등해 HICP가 8.4%까지 갔습니다. ECB는 -0.50%에서 2.00%로 사상 최속 인상. 무역수지는 3,320억 유로 적자로 뒤집혔고 ZEW는 -23.6까지 떨어졌습니다."],
2023:["긴축 정점 · 성장 정체","예금금리 4.00%. 물가는 5.4%로 내려왔지만 성장은 0.4%로 멈췄습니다. M3 증가율이 0.2%로 사실상 제로가 되며 신용 경색이 나타났고, 독일이 역성장하며 '유럽의 병자'로 불렸습니다."],
2024:["인하 개시 · 독일 부진","6월부터 인하해 연말 3.00%. 물가 2.4%로 목표에 근접했지만 산업생산은 -2.5%로 2년 연속 감소했습니다. 제조업 PMI는 45.1로 여전히 깊은 수축이었습니다."],
2025:["목표 달성 · 저성장 고착","물가 2.1%로 사실상 목표 달성, 예금금리는 2.00%에서 멈췄습니다. 다만 성장은 1%대에 고착됐습니다."],
2026:["이란 충격 · 제조업과 서비스의 역전","1월 1.7%였던 물가가 5월 3.2%까지 치솟았다가 6월 2.8%로 되밀렸고, 1분기 GDP는 -0.2% 역성장했습니다. 가장 특이한 것은 PMI입니다. 늘 강했던 서비스가 49.4로 수축하고, 늘 약했던 제조업이 51.4로 확장 중입니다. 에너지 충격이 소비자 대면 서비스를 직격했고 제조업은 선구매 재고 축적으로 버티는 구도입니다. 1월부터 불가리아가 합류해 21개국이 됐습니다."]},

 "수출 쪽에서는 중국과의 경쟁이 부담입니다. 중국이 미국 관세를 피해 유럽으로 수출을 돌리면서 유럽 기업의 시장을 잠식하고 있습니다."],
 watch:"에너지 수입액과 나머지를 분리해서 보세요. 에너지를 빼면 유로존 무역수지는 여전히 견조합니다. 문제는 에너지 한 항목입니다.",
 url:"https://ec.europa.eu/eurostat/web/international-trade-in-goods",
 yr:{u:"억유로",lab:"연간 무역수지",v:[2740,2340,1950,2210,2340,1140,-3320,380,1470,1500,500],n:["+2,740억 유로로 사상 최대. 저유가로 수입액이 급감했습니다.","+2,340억 유로. 유가 반등으로 축소.","+1,950억 유로. 유가 상승이 흑자를 계속 깎았습니다.",
 
 "+2,210억 유로. 안정적 흑자 구조였습니다.",
 "+2,340억 유로. 팬데믹으로 수입이 더 크게 줄어 흑자가 늘었습니다.",
 "+1,140억 유로. 원자재 가격 상승으로 흑자가 줄었습니다.",
 "-3,320억 유로로 사상 최악. 러시아 가스 차단이 직격했고 유로/달러가 패리티를 깼습니다.",
 "+380억 유로. 에너지 가격 하락으로 흑자 전환했습니다.",
 "+1,470억 유로. 정상화가 진행됐습니다.",
 "약 +1,500억 유로. 안정적이었습니다.",
 "약 +500억 유로 추정. 에너지 수입 단가 급등으로 흑자가 축소 중입니다."],
 arc:"무역수지의 8년에서 2022년 -3,320억 유로가 모든 것을 말합니다. 유로존이 얼마나 에너지 수입에 취약한지를 단 한 해가 증명했습니다. 그리고 그해 유로/달러는 패리티(1.00)를 깼습니다. 무역수지와 환율이 이렇게 직접 연결된 사례는 드뭅니다. 2026년 다시 흑자가 줄어드는 지금, 유로화의 하방 위험을 함께 봐야 하는 이유입니다."}},

{id:"edep",fam:"금리·정책",org:"ECB",src:"European Central Bank Governing Council · 공식 통화정책 결정문",name:"기준금리",
 sub:"예금금리 2.25% · 2026년 6월 17일 인상",val:2.25,prev:2.00,unit:"%",good:"flat",chart:"step",
 series:[["25Q2",2.00],["25Q3",2.00],["25Q4",2.00],["26Q1",2.00],["26Q2",2.25,1]],
 extra:[["6/17 결정","2.00% → 2.25% (+25bp)"],["주요 재융자금리(MRO)","2.40%"],["한계대출금리","2.65%"],["6월 스태프 전망","2026 물가 3.0% · 근원 2.5%"]],
 what:"ECB는 예금금리·주요 재융자금리(MRO)·한계대출금리 세 가지를 운영합니다. 2024년 3월 이사회가 통화정책 기조를 실질적으로 이끄는 기준으로 예금금리(DFR)를 쓰기로 결정해, 이 금리가 사실상의 기준금리입니다. 2014~2022년 8년간 마이너스였습니다.",
 imp:"단일 통화·다국 재정 구조에서 ECB 금리는 21개국 모두에 똑같이 적용됩니다. 독일에 맞으면 이탈리아에 너무 높고, 남유럽에 맞으면 독일에 너무 낮습니다. 이 구조적 딜레마 때문에 ECB는 연준보다 항상 신중하고 느립니다.",
 sched:["연 8회","약 6주 간격 · 회의록(계좌) 4주 후","14:15 CET 발표 · 14:45 회견","7월 23일 결정"],
 why:["6월 17일 이사회가 예금금리를 2.00%에서 2.25%로 25bp 인상했습니다. 주요 재융자금리는 2.40%, 한계대출금리는 2.65%가 됐습니다.",
 "결정문은 '중동 전쟁이 물가 압력을 만들고 있으며, 인상 결정은 충격이 어떻게 전개되든 견고하다'고 명시했습니다. 시나리오별 분석에서도 인상이 정당화된다는 뜻입니다.",
 "새 유로시스템 스태프 전망(기본 시나리오)은 2026년 헤드라인 물가 3.0%, 2027년 2.3%, 2028년 2.0%입니다. 근원물가는 2026·27년 평균 2.5%, 2028년 2.2%로 봤습니다.",
 "3월 회의(19일)에서는 동결(예금금리 2.00%)했었지만, 중동 정세가 악화되며 6월에 결국 인상으로 돌아섰습니다. 다음 결정은 7월 23일입니다."],
 watch:"이사회가 '모든 시나리오에서 견고한 결정'이라고 강조한 점에 주목하세요. 즉 상황이 더 나빠져도 되돌리지 않겠다는 신호입니다. 근원물가 전망(2.5%)이 목표(2%)를 웃도는 채로 유지되는지가 다음 인상 여부를 가릅니다.",
 url:"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html",
 yr:{u:"%",lab:"연말 예금금리",v:[-0.4,-0.4,-0.4,-0.50,-0.50,-0.50,2.00,4.00,3.00,2.00,2.25],n:["-0.40%. 3월에 더 내리고 자산매입을 월 800억 유로로 확대했습니다.","-0.40%. 유지. 자산매입은 축소하기 시작했습니다.","-0.40%. 12월에 자산매입을 종료했지만 금리는 그대로였습니다.",
 "-0.50%. 9월에 더 내리고 자산매입을 재개했습니다.",
 "-0.50%. 금리 대신 팬데믹긴급매입(PEPP) 1.85조 유로로 대응했습니다.",
 "-0.50%. 물가가 목표를 넘었는데도 유지했습니다.",
 "2.00%. 7월부터 -0.50%에서 250bp를 올린 사상 최속 인상입니다.",
 "4.00%로 정점. 유로 출범 이후 최고 금리입니다.",
 "3.00%. 6월부터 인하를 시작했습니다.",
 "2.00%. 물가 목표 달성과 함께 중립 수준에서 멈췄습니다.",
 "2.25%. 6월 17일 인상. 중동 전쟁발 물가 압력에 이사회가 '모든 시나리오에서 견고하다'며 대응했습니다."],
 arc:"ECB의 8년은 항상 연준보다 늦고 조심스러웠습니다. 2022년 인상도 연준보다 4개월 늦었고, 2024년 인하는 연준보다 3개월 빨랐습니다. 그런데 2026년 6월에는 연준(동결)보다 먼저, 그리고 예상을 깨고 인상했습니다. 중동 전쟁이라는 공동의 충격 앞에서 ECB가 연준보다 빠르게 움직인 드문 사례입니다. 21개국의 경기가 제각각이라 어느 쪽으로 움직여도 누군가는 반대하는 구조는 여전하지만, 이번엔 그 반대를 무릅쓴 결정이었습니다."}},

{id:"ewage",fam:"고용",org:"ECB",src:"ECB 피용자보수 · 임금 트래커",name:"피용자 1인당 보수",
 sub:"전년 대비 · 2025년 4분기",val:3.7,prev:4.0,unit:"%",good:"down",chart:"line",est:1,
 series:[["24Q3",4.5],["24Q4",4.4],["25Q1",4.2],["25Q2",4.1],["25Q3",4.0,1],["25Q4",3.7,1]],
 extra:[["2025년 연간","3.9%"],["2024년 연간","4.5%"],["임금 트래커","6~12개월 선행"],["서비스 물가","3.2%"]],
 what:"기업이 근로자 1인에게 지급한 총보수(임금 + 사용자 부담 사회보장기여금)의 증가율입니다. ECB는 별도로 노사 협상 결과를 미리 집계한 '임금 트래커'를 운영해 6~12개월 앞을 봅니다.",
 imp:"유로존 인플레이션의 지속성을 판별하는 결정적 지표입니다. 노조 조직률이 높고 다년 임금협약이 일반적이라 한번 오른 임금이 오래갑니다. 미국보다 임금-물가 나선의 위험이 구조적으로 큽니다. 서비스가 HICP의 46.8%이고 서비스 가격은 임금이 결정하므로 더욱 중요합니다.",
 sched:["분기","분기 종료 후 약 3개월","11:00 CET","1Q 2026분 발표 예정"],
 why:["2025년 4분기 피용자 1인당 보수 증가율이 3.7%로 직전 분기 4.0%에서 둔화했습니다.",
 "연간으로 보면 2024년 4.5%에서 2025년 3.9%로 내려왔습니다. 임금 압력이 꾸준히 완화되는 중입니다.",
 "이것이 ECB가 에너지발 물가 상승을 견딜 수 있는 근거입니다. 임금이 따라 오르지 않으면 2차 파급이 제한되고, 유가가 안정되면 물가도 따라 내려옵니다.",
 "전문가 조사도 같은 판단입니다. 중동 전쟁의 간접·2차 효과는 제한적이며 2026~27년에 집중될 것으로 봤습니다."],
 watch:"임금 트래커가 반등하는지 보세요. 노사 협상은 몇 달 앞서 타결되므로 트래커가 오르면 실제 임금은 반년 뒤에 오릅니다. 그때는 ECB가 성장을 희생해서라도 대응해야 합니다.",
 url:"https://www.ecb.europa.eu/press/economic-bulletin/html/index.en.html",
 yr:{u:"%",lab:"연간 증가율",v:[1.3,1.7,2.2,2.2,-0.6,4.4,4.5,5.3,4.5,3.9,3.5],n:["1.3%. 실업률 10%에서 임금이 오를 리 없었습니다.","1.7%. 완만한 회복.","2.2%. 실업률 하락과 함께 상승했습니다.",
 
 "2.2%. 안정적이었습니다.",
 "-0.6%. 조업단축 제도로 통계가 크게 왜곡된 해입니다.",
 "4.4%. 기저효과 반등.",
 "4.5%. 물가 8.4%에는 한참 못 미쳐 실질임금이 크게 깎였습니다.",
 "5.3%로 정점. 2022년 실질임금 손실을 만회하려는 협상이 몰렸습니다.",
 "4.5%. 둔화 시작.",
 "3.9%. 정상화가 진행됐습니다.",
 "약 3.5% 추정. 4분기 3.7%에서 계속 내려오는 중입니다."],
 arc:"유로존 임금은 물가를 2년 늦게 따라갔습니다. 2022년 물가 8.4%에 임금 4.5%로 실질임금이 4%p 깎였고, 그 손실을 2023~24년에 뒤늦게 만회했습니다. 이 시차가 유로존 인플레가 미국보다 오래간 이유입니다. 지금 임금이 3%대로 내려온 것은 그 사이클이 끝났다는 신호이고, 이란 충격이 임금으로 번지지 않는 한 물가는 다시 2%로 갈 수 있습니다."}},

{id:"em3",fam:"금리·정책",org:"ECB",src:"ECB 통화량 M3 (Monetary developments) · 민간대출(Bank Lending)",name:"통화량 M3 & 민간대출",
 sub:"전년 대비 · 추정",val:3.0,prev:3.3,unit:"%",good:"flat",chart:"line",est:1,
 series:[["1월",3.4],["2월",3.3],["3월",3.2],["4월",3.1],["5월",3.0],["6월",3.0]],
 extra:[["기업대출 증가율","약 +2.8%(완만한 회복)"],["가계대출(주택담보 포함)","약 +1.9%"],["2023년 M3 저점","+0.2% (사실상 정지)"],["2020년 M3 정점","+10.5%"]],
 what:"현금·요구불예금(M1)에 정기예금 등(M2)과 단기 시장성 상품을 더한 광의통화입니다. ECB가 매월 말에 발표하며, 함께 나오는 기업대출·가계대출 증가율이 실물 신용 상태를 보여줍니다.",
 imp:"ECB는 창립 초기 M3 증가율 4.5%를 통화정책의 '제1의 기둥'으로 삼았을 만큼 통화량을 중시하는 전통이 있습니다. 지금은 공식 참조치를 쓰지 않지만 여전히 중요한 판단 재료입니다. 특히 은행 중심 금융구조라 M3와 대출 증가율이 실물 전달 경로를 직접 보여줍니다.",
 sched:["매월","말일 전후 (2개월 전)","10:00 CET","7월 말 (6월분)"],
 why:["M3 증가율이 3%대에서 완만하게 둔화하고 있습니다. 물가(2.8%)와 비슷한 수준입니다.",
 "2023년 0.2%라는 사실상 정지 상태에서 회복한 것은 긍정적입니다. 당시에는 금리 4.00%가 신용을 완전히 얼려버린 상태였습니다.",
 "다만 대출 증가율은 여전히 약합니다. 기업이 투자를 위해 돈을 빌리기보다 기존 부채를 갚는 데 집중하고 있습니다.",
 "M3가 물가와 비슷하게 늘어난다는 것은 실질 통화량이 정체라는 뜻입니다. 수요발 인플레 압력은 없다는 근거입니다."],
 watch:"M3보다 기업대출 증가율을 보세요. 유로존은 은행 중심 금융구조라 기업이 채권 대신 은행 대출에 의존합니다. 대출이 살아나야 투자가 살아납니다.",
 url:"https://www.ecb.europa.eu/press/stats/md/html/index.en.html",
 yr:{u:"%",lab:"연평균 M3 증가율",v:[5,4.7,3.7,5.5,10.5,8.0,4.0,0.2,2.5,3.5,3.0],n:["5.0%. 대규모 자산매입으로 통화량이 늘었습니다.","4.7%. 유지.","3.7%. 자산매입 축소로 둔화했습니다.",
 
 "5.5%. 완화 정책으로 통화량이 늘었습니다.",
 "10.5%. PEPP와 정부 지원으로 사상 최고 증가율입니다.",
 "8.0%. 유동성이 여전히 넘쳤고 이것이 이듬해 물가 폭등의 배경이 됐습니다.",
 "4.0%. 급격한 금리 인상으로 둔화했습니다.",
 "0.2%로 사실상 정지. 금리 4.00%가 신용을 완전히 얼렸습니다.",
 "2.5%. 인하와 함께 회복했습니다.",
 "3.5%. 정상화.",
 "약 3.0% 추정. 물가와 비슷해 실질 통화량은 정체 상태입니다."],
 arc:"M3 증가율과 2년 뒤 물가를 겹쳐 보면 놀랍도록 잘 맞습니다. 2020년 10.5% → 2022년 물가 8.4%, 2023년 0.2% → 2025년 물가 2.1%. ECB가 창립 때 통화량을 정책의 기둥으로 삼은 이유가 여기 있습니다. 지금 M3가 3%대로 안정적이라는 사실은, 2026년의 물가 상승이 통화적 현상이 아니라 순수한 에너지 비용 충격이라는 강력한 증거입니다."}},

{id:"eca",fam:"대외·환율",org:"ECB",src:"ECB 경상수지 (Balance of payments)",name:"경상수지",

 series:[["22년",-0.6,1],["23년",1.7,1],["24년",2.8,1],["25년",2.7],["26년",2.0]],
 extra:[["2022년","-0.6% (사상 첫 적자)"],["최대 흑자국","독일·네덜란드"],["구성","상품·서비스·본원소득·이전소득"]],
 what:"유로존 전체의 대외 거래 수지를 GDP 대비 비율로 나타낸 것입니다. ECB가 매월 중순에 2개월 전 실적을 발표합니다. 역내 거래는 상계되고 역외와의 거래만 잡힙니다.",
 imp:"유로화 가치의 구조적 기반입니다. 유로존은 전통적으로 GDP 대비 2~3%의 경상흑자를 내는 지역이었고, 이 흑자가 유로화 수요를 만들었습니다. 2022년 사상 첫 적자를 낸 해에 유로/달러가 패리티를 깼습니다. 흑자 규모가 유로화의 바닥을 결정합니다.",
 sched:["매월","약 18~20일 (2개월 전)","10:00 CET","8월 중순 (6월분)"],
 why:["경상흑자가 줄어들고 있습니다. 에너지 수입 대금이 급증했기 때문입니다.",
 "2022년에는 GDP 대비 -0.6%로 사상 첫 적자를 냈고, 그해 유로/달러가 0.95까지 떨어졌습니다. 지금 흑자가 줄어드는 국면은 그때의 축소판입니다.",
 "다만 2022년보다 나은 조건도 있습니다. 서비스수지가 개선됐고 아일랜드를 중심으로 한 디지털·지식재산 수출이 늘었습니다.",
 "독일과 네덜란드가 흑자의 대부분을 냅니다. 남유럽은 여전히 적자여서, 유로존 평균이 회원국 간 불균형을 가리는 문제가 있습니다."],
 watch:"경상수지가 GDP 대비 1% 아래로 내려가면 유로화 하방 압력이 본격화됩니다. 에너지 수입 대금이 그 분기점을 결정합니다.",
 url:"https://www.ecb.europa.eu/press/stats/bop/html/index.en.html",

 "+2.4%. 안정적 흑자 구조였습니다.",

 "-0.6%. 사상 첫 적자. 러시아 가스 차단으로 에너지 수입액이 폭증했고 유로/달러가 패리티를 깼습니다.",
 "+1.7%. 에너지 가격 하락으로 흑자 전환했습니다.",

{id:"eeur",fam:"대외·환율",org:"ECB / 시장",src:"ECB 기준환율 (EUR/USD)",name:"유로/달러 환율",

 what:"ECB가 매 영업일 오후 2시 15분(CET)에 기준환율을 고시합니다. 유로화는 달러 다음으로 많이 거래되는 통화이고, 세계 외환보유고의 약 20%를 차지합니다.",
 imp:"한국 투자자에게도 직접 영향을 줍니다. 유로 약세는 달러 강세를 뜻하고, 달러 강세는 원화 약세로 이어집니다. 실제로 2026년 원/유로 환율이 1,800원을 돌파해 17년 만의 최고를 기록했는데, 이는 원화가 유로보다 더 약해졌다는 뜻입니다.",
 sched:["실시간","24시간 · ECB 기준환율 매일 고시","14:15 CET","연속 (ECB·FOMC 때 급변)"],
 why:["유로가 약세 압력을 받고 있습니다. 두 가지 요인이 겹칩니다.",
 "첫째는 금리차입니다. 미국 3.75%, 유로존 2.00%로 1.75%p 차이가 유지되는 한 자금이 달러로 흐릅니다.",
 "둘째는 에너지 수입입니다. 유로존은 에너지를 달러로 결제하므로 유가가 오르면 유로를 팔아 달러를 사야 합니다. 실수요 기반의 유로 매도입니다.",
 "2022년의 교훈이 여기 있습니다. 당시 무역수지가 3,320억 유로 적자로 뒤집히자 유로/달러가 0.95까지 떨어져 패리티를 깼습니다. 같은 메커니즘이 약하게 재현되는 중입니다."],
 watch:"금리차보다 에너지 수입 대금을 보세요. 유로존은 에너지가 유일한 대외 취약점이고, 무역수지가 적자로 돌아서면 금리차와 무관하게 유로가 밀립니다.",
 url:"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html",
 yr:{u:"$",lab:"연말 유로/달러",v:[1.05,1.2,1.15,1.12,1.22,1.14,1.07,1.10,1.04,1.16,1.13],n:["1.05. 트럼프 당선 후 달러 강세로 패리티에 근접했습니다.","1.20. 유로존 호황으로 14% 급등했습니다.","1.15. 성장 둔화로 약세 전환했습니다.",
 
 "1.12. 안정적이었습니다.",
 "1.22. 달러 약세와 유럽 회복기금 합의로 강세였습니다.",
 "1.14. 미국 긴축 예고로 약세 전환.",
 "1.07. 9월에는 0.95까지 떨어져 패리티를 깼습니다. 가스 위기와 무역적자가 원인입니다.",
 "1.10. 에너지 안정으로 회복했습니다.",
 "1.04. 미국 금리 우위와 유럽 저성장으로 다시 약세.",
 "1.16. 미국 인하와 달러 약세로 크게 회복했습니다.",
 "약 1.13. 에너지 수입 급증과 금리차로 약세 압력을 받는 중입니다."],
 arc:"유로/달러의 8년에서 2022년 패리티 붕괴가 결정적 사건입니다. 유로 출범 20년 만에 처음이었고, 원인은 금리차가 아니라 에너지였습니다. 러시아 가스가 끊기자 유로존은 에너지를 달러로 사와야 했고, 그 실수요 매도가 유로를 무너뜨렸습니다. 이후 유로 환율을 볼 때는 ECB 금리보다 천연가스 가격을 먼저 보는 것이 정확해졌습니다."}},

 imp:"PMI가 민간(S&P Global) 조사인 반면 ESI는 EU 공식 조사입니다. 표본이 훨씬 크고(약 12만 5천 개 기업·가계) 건설과 소매까지 포함해 범위가 넓습니다. ECB와 집행위가 정책 문서에서 인용하는 공식 심리지표이며, 회원국별로 세분해서 볼 수 있다는 장점이 있습니다.",
 sched:["매월","말일 직전 (대략 27~30일)","11:00 CET","7월 말 (7월분)"],

 "산업 신뢰는 상대적으로 나은 편입니다. 제조업 PMI가 확장인 것과 일관되며, 선구매 수요가 주문을 받쳐주고 있습니다.",
 "다만 Eurostat 자료에서는 경제심리 강화와 고용 기대 상승이 관찰됐습니다. 조사 시점과 기준이 달라 신호가 엇갈리므로 방향성만 참고해야 합니다."],
 watch:"ESI 부문별 세부를 보세요. 산업·서비스·소비자 중 어디가 끌고 어디가 발목을 잡는지 알아야 정책 방향을 읽을 수 있습니다. 소비자신뢰가 회복돼야 진짜 회복입니다.",
 url:"https://economy-finance.ec.europa.eu/economic-forecast-and-surveys/business-and-consumer-surveys_en",

 "100.6. 장기평균 수준을 유지했습니다.",

 "114.5로 사상 최고권. 재개방 낙관이 폭발했습니다.",

 "96.4. 회복이 없었습니다.",
 "93.7. 오히려 더 나빠졌습니다. 독일 부진이 주원인입니다.",
 "약 95.0. 소폭 개선.",
 "약 93.0 추정. 에너지 재급등으로 다시 하락 중입니다."],
 arc:"ESI가 2021년 114.5 정점 이후 5년째 100을 회복하지 못하고 있습니다. 장기평균보다 나쁜 상태가 5년 지속된다는 것은 순환적 부진이 아니라 구조적 침체를 뜻합니다. 에너지 비용, 중국과의 경쟁, 인구 고령화, 규제 부담이 겹쳐 있고 어느 하나도 금리로 해결되지 않습니다. 드라기 보고서가 유럽의 경쟁력 위기를 경고한 배경이 이 지표에 그대로 담겨 있습니다."}}

 imp:"유로존만의 특수한 지표입니다. '안정성장협약'에 따라 재정적자는 GDP의 3%, 정부부채는 60% 이내로 제한되며, 위반하면 과도재정적자절차(EDP)가 발동됩니다. 통화는 하나인데 재정은 각국이 따로 쓰는 구조의 균열이 여기서 드러나고, 이것이 유로존 위기의 반복되는 뇌관입니다.",
 sched:["연 2회","4월 말 · 10월 말","11:00 CET","10월 말"],
 why:["유로존 전체 재정적자가 GDP 대비 3% 안팎에서 기준선을 넘나들고 있습니다.","2026년에는 적자가 다시 확대될 가능성이 큽니다. 에너지 보조금과 국방비 증액 압력이 동시에 작용하기 때문입니다.","국가별 편차가 문제입니다. 독일은 여력이 있지만 헌법상 부채 제동장치에 묶여 있고, 프랑스·이탈리아는 이미 기준을 크게 초과해 여력이 없습니다.","성장이 마이너스인데 재정을 조일 수도, 풀 수도 없는 상황입니다. 유로존이 미국처럼 대규모 부양을 못 하는 구조적 이유입니다."],
 watch:"유로존 평균이 아니라 프랑스·이탈리아 개별 수치를 보세요. 이들이 EDP 대상이 되면 긴축을 강요받고, 그것이 유로존 전체 성장을 더 끌어내립니다.",
 url:"https://ec.europa.eu/eurostat/web/government-finance-statistics",

  what: "유로존 전체 고용자 수의 분기별 증감률입니다. 미국처럼 매달 절대 인원(명)으로 발표되지는 않지만, Eurostat이 분기마다 발표하는 유로존 노동시장의 가장 가까운 '고용자 수' 지표입니다.",
  imp: "유로존은 GDP가 마이너스(1분기 -0.2%)를 기록했는데도 고용은 플러스를 유지하고 있습니다. 이 '고용 없는 침체 아닌 침체'는 기업들이 경기 둔화에도 인력을 쉽게 못 줄이는 유럽 노동시장의 경직성(해고 규제, 단시간 근로 지원 제도)을 보여줍니다.",
  sched: {cyc:"분기",when:"Eurostat 발표 · GDP 통계와 함께",time:"11:00 CET",next:"2분기 통계 발표"},
  why: ["1분기 고용자 수가 전분기 대비 0.2% 늘어, 4분기 0.3%보다는 둔화됐지만 여전히 플러스를 유지했습니다.","1분기 GDP가 -0.2%로 역성장했는데도 고용이 플러스인 것은, 기업들이 경기 둔화를 감원보다 근로시간 단축이나 채용 동결로 흡수하고 있다는 뜻입니다.","서비스업이 고용 증가를 주도하고 있고, 제조업은 에너지 비용 부담과 수요 부진으로 고용이 정체되거나 소폭 줄고 있습니다.","실업률(6.3%)이 사상 최저권에 머물러 있다는 것도, 성장은 둔화해도 노동시장 자체는 아직 크게 흔들리지 않고 있음을 보여줍니다."],
  watch: "GDP와 고용의 괴리가 계속되는지 보세요. 성장이 계속 마이너스인데 고용이 버틴다면, 결국 기업 마진이 눌리고 있다는 뜻이라 다음 국면에서는 감원이나 임금 동결로 이어질 수 있습니다.",
  url: "https://ec.europa.eu/eurostat/web/lfs",
  yr: {u:"%",lab:"연말 고용자수 전분기비",v:[0.3,0.3,0.3,0.1,-1.6,2.3,0.3,0.3,0.2,0.3,0.2],n:["+0.3%. 완만한 증가세였습니다.","+0.3%. 안정적이었습니다.","+0.3%. 변화가 없었습니다.","+0.1%. 증가세가 둔화했습니다.","-1.6%. 팬데믹으로 처음 감소했습니다.","+2.3%. 재개방으로 급반등했습니다.","+0.3%. 안정을 되찾았습니다.","+0.3%. 완만했습니다.","+0.2%. 성장 둔화의 영향이 나타나기 시작했습니다.","+0.3%. 여전히 플러스를 유지했습니다.","+0.2% 추정. GDP 역성장에도 고용은 버티고 있습니다."],arc:"유로존 고용은 2020년 팬데믹 때 한 번 크게 흔들린 것을 빼면 11년 내내 플러스를 유지했습니다. 2026년 1분기처럼 GDP가 마이너스인데 고용이 플러스인 조합은 유럽에서 드물지 않은데, 이는 유럽 노동시장의 해고 경직성이 경기 둔화의 충격을 고용보다 기업 마진 쪽으로 떠넘기고 있다는 뜻입니다."},
  series: [["25.2분기",0.3],["25.3분기",0.3],["25.4분기",0.2],["26.1분기",0.2,1]]
},
{
  id: "eppi",
  fam: "물가",

  sub: "전년비 · 2026년 6월 추정",
  val: 3.4,
  prev: 2.5,
  unit: "%",
  good: "down",
  chart: "line",
  extra: [["에너지 제외 PPI","이보다 낮은 수준으로 추정"],["HICP와의 관계","3~6개월 선행 경향"],["최대 압박 요인","이란 사태발 에너지값"],["독일 비중","유로존 PPI의 약 28%"]],
  what: "유로존 기업이 생산 단계에서 받는 가격의 변화율입니다. 소비자물가(HICP)보다 몇 달 앞서 움직이는 경향이 있어, 향후 소비자물가 흐름을 미리 가늠하는 선행지표로 쓰입니다.",
  imp: "유로존은 이 대시보드의 22개 지표 중 유일하게 PPI가 없었던 지역이었는데, 실제로는 에너지 수입 의존도가 높아 PPI 변동성이 가장 큰 지역 중 하나입니다. 2022년 러시아 에너지 위기 때 PPI가 40%를 넘었던 전례가 있을 만큼, 외부 에너지 충격에 극도로 민감합니다.",
  sched: {cyc:"매월",when:"Eurostat 발표 · 월말 익월 초",time:"11:00 CET",next:"다음 달 발표"},
  why: ["6월 PPI가 전년비 3.4%로 5월 2.5%에서 급등했습니다(추정치). 이란 사태로 인한 에너지값 급등이 직접 반영됐습니다.","천연가스(Dutch TTF)가 다시 오르고 원유 수입 단가가 뛰면서, 에너지 집약적인 독일 화학·금속 산업의 생산 원가가 크게 올랐습니다.","PPI가 HICP(6월 2.8%)보다 높은 수준으로 뛴 것은, 앞으로 몇 달 안에 소비자물가에도 이 압력이 전이될 수 있다는 신호입니다.","다만 6월 HICP 자체는 오히려 둔화(5월 3.2%→2.8%)했는데, PPI 급등과의 이 엇갈림이 이란 사태의 파급 경로가 아직 소비자 단계까지는 덜 왔다는 뜻일 수 있습니다."],
  watch: "PPI가 오른 지 3~6개월 뒤 HICP에 반영되는 경향을 감안하면, 지금의 PPI 급등이 연말~내년 초 소비자물가에 상방 압력으로 나타날 가능성이 있습니다. ECB가 6월에 선제적으로 금리를 올린 이유 중 하나이기도 합니다.",
  url: "https://ec.europa.eu/eurostat/web/short-term-business-statistics/prices",
  yr: {u:"%",lab:"연말 PPI 전년비",v:[-2.6,2.5,3,-0.2,-1,17.4,24.6,-9.6,-3.2,-1.5,3.4],n:["-2.6%. 저유가로 마이너스였습니다.","+2.5%. 완만한 상승이었습니다.","+3.0%. 안정적이었습니다.","-0.2%. 소폭 하락했습니다.","-1.0%. 팬데믹으로 수요가 위축됐습니다.","+17.4%. 공급망 병목이 시작됐습니다.","+24.6%로 사상 최고. 러시아 에너지 위기로 폭등했습니다.","-9.6%로 급락. 에너지 가격이 정상화됐습니다.","-3.2%. 기저효과로 마이너스가 이어졌습니다.","-1.5%. 안정세가 계속됐습니다.","+3.4% 추정. 이란 사태로 다시 급등했습니다."],arc:"유로존 PPI는 2022년 24.6%라는 극단적 수치를 찍었다가 2023~25년 마이너스로 급반전한, 11년 중 가장 롤러코스터 같은 궤적을 그렸습니다. 이 극단적 변동성 자체가 유로존이 에너지를 자급하지 못하는 구조적 취약점을 그대로 보여주고, 2026년의 재급등은 그 취약점이 아직 해소되지 않았다는 증거입니다."},
  series: [["2월",2],["3월",2.2],["4월",2.8],["5월",2.6],["6월",2.5],["7월",3.4,1]]
},

 what:"소매업체의 판매량을 물가 변동을 제거한 실질 기준으로 지수화합니다. 미국 소매판매가 명목 금액인 것과 달리 유로존은 실질 물량 기준이라 물가 착시가 없습니다.",
 imp:"유로존 GDP의 약 52%가 가계소비입니다. 2026년 1분기 GDP가 -0.2%로 돌아선 직접 원인이 바로 소매판매 감소였습니다. 에너지 가격이 오르면 가계가 난방·연료에 돈을 쓰고 다른 소비를 줄이는데, 그 과정이 이 지표에 가장 먼저 나타납니다.",
 sched:["매월","약 3~7일 (2개월 전)","11:00 CET","8월 초 (6월분)"],
 why:["소매판매가 감소로 돌아섰습니다. 2026년 1분기 GDP 역성장의 직접 원인입니다.",
 "메커니즘이 명확합니다. 에너지 물가가 8.7%인 상황에서 가계 예산의 상당 부분이 난방·연료로 흘러가고, 나머지 소비가 밀려납니다.",
 "실질 기준이라는 점이 중요합니다. 명목 소비 금액은 늘었을 수 있지만 물량은 줄었습니다. 즉 같은 돈으로 더 적게 사고 있습니다.",
 "서비스 PMI가 49.4로 수축한 것과 정확히 같은 이야기입니다. 소비자 대면 부문이 에너지 충격을 정면으로 맞고 있습니다."],
 watch:"실질 지수이므로 물가 착시가 없습니다. 에너지 물가와 겹쳐 보면 인과가 명확히 드러납니다. 에너지가 내려야 소매판매가 살아납니다.",
 url:"https://ec.europa.eu/eurostat/web/short-term-business-statistics",

 "2.4%. 정상적인 증가세였습니다.",
 "-0.9%. 봉쇄로 오프라인 소매가 무너졌습니다.",
 "5.0%. 재개방 반등.",
 "0.7%. 물가 8.4%가 실질 구매력을 깎았습니다.",
 "-1.8%. 고물가·고금리가 겹쳐 소비가 위축됐습니다.",

 "약 -0.5% 추정. 에너지 재급등으로 다시 감소 중입니다."],
 arc:"유로존 소매판매는 에너지 물가의 거울입니다. 2022~23년 에너지 위기 때 마이너스, 2024~25년 에너지 안정기에 플러스, 2026년 에너지 재급등에 다시 마이너스. 이 패턴이 세 번 반복됐습니다. 유로존 소비를 예측하려면 소비자 심리나 고용이 아니라 천연가스·유가 선물을 보는 편이 낫습니다."}},
{id:"epmic",fam:"기업·심리",org:"S&P Global / HCOB",src:"S&P Global · HCOB 유로존 종합 PMI",name:"종합 PMI",

 what:"제조업 생산지수와 서비스 기업활동지수를 가중평균한 값입니다. 50이 기준선이고, 매월 하순에 잠정치가, 다음 달 초에 확정치가 나옵니다. GDP와의 상관이 매우 높아 '실시간 GDP'로 불립니다.",
 imp:"유로존에서 가장 빠르고 정확한 경기 지표입니다. Eurostat GDP가 분기 종료 후 30일 뒤에 나오는 반면 PMI는 당월 하순에 나옵니다. 즉 최대 4개월 앞서 GDP를 알려줍니다. ECB도 정책 판단에 PMI를 직접 인용합니다.",
 sched:["매월","잠정 매월 하순(23일 전후) · 확정 다음 달 초","10:00 CET","8월 초 (7월 확정)"],
 why:["6월 종합 PMI가 50.0으로 확정됐습니다. 잠정치 49.5에서 상향 조정됐고 5월 48.5에서 회복해 두 달간의 위축을 끝냈습니다.",
 "7월 잠정치는 51.9로 더 올랐습니다. 에너지 충격의 최악은 지나간 것으로 보입니다.",
 "회복의 구성이 특이합니다. 제조업 생산이 늘어난 것이 서비스 부진을 상쇄했습니다. 유로존의 통상적 구도와 정반대입니다.",
 "기업 신뢰도 두 달 연속 개선됐습니다. 다만 역사적 평균은 여전히 밑돕니다."],
 watch:"50 부근에서 오르내릴 때는 방향과 지속 기간이 중요합니다. 3개월 연속 50 위면 확장 국면 진입으로 봅니다. 그리고 제조업과 서비스 중 어느 쪽이 끌고 있는지를 반드시 확인하세요.",
 url:"https://www.pmi.spglobal.com/",
 yr:{u:"pt",lab:"연말 종합 PMI",v:[54.4,58.1,51.1,50.9,49.1,53.3,49.3,47.6,49.6,51.0,51.9],n:["54.4. 브렉시트 우려를 딛고 연말 강세였습니다.","58.1. 8년 중 최고. 유로존 호황의 정점이었습니다.","51.1. 무역전쟁으로 1년 만에 7포인트 급락했습니다.",
 
 "50.9. 제조업 부진을 서비스가 겨우 상쇄했습니다.",
 "49.1. 2차 봉쇄로 연말 다시 수축했습니다.",
 "53.3. 재개방 효과로 강한 확장이었습니다.",
 "49.3. 가스 위기로 수축 전환.",
 "47.6. 8년 중 최저. 고금리와 에너지 비용이 겹쳤습니다.",
 "49.6. 여전히 기준선 아래.",
 "약 51.0. 확장 전환에 성공했습니다.",
 "7월 51.9. 6월 50.0에서 회복 중입니다."],
 arc:"종합 PMI는 8년 중 절반을 50 아래에서 보냈습니다. 유로존 경제의 만성적 정체를 이보다 잘 보여주는 지표가 없습니다. 미국 ISM이 같은 기간 대부분 50 위였던 것과 대조적입니다. 그리고 PMI 저점(2023년 47.6)이 정확히 ECB 금리 정점(4.00%)과 겹칩니다. 유로존은 은행 중심 금융구조라 금리 인상이 실물에 훨씬 빠르고 세게 전달됩니다."}},

 what:"독일 만하임의 유럽경제연구센터(ZEW)가 금융시장 전문가 약 300명에게 향후 6개월 경기 전망을 물어 '개선' 비율에서 '악화' 비율을 뺀 값입니다. 0이 균형점입니다.",
 imp:"유로존에서 가장 빠른 심리지표입니다. 매월 둘째 화요일에 나와 PMI보다도 열흘 이상 빠릅니다. 응답자가 일반 기업이 아니라 애널리스트·펀드매니저라 시장 컨센서스를 직접 반영하며, 변동성이 매우 커서 방향 전환을 조기에 포착합니다. 다만 그만큼 오신호도 많습니다.",
 sched:["매월","둘째 화요일","11:00 CET","8월 11일경"],
 why:["ZEW 기대지수가 연초 플러스에서 마이너스로 돌아섰습니다. 전문가들이 향후 6개월을 비관하기 시작했다는 뜻입니다.",
 "하락 시점이 이란 사태와 정확히 겹칩니다. 4월에 마이너스로 전환했고 5월에 저점을 찍었습니다.",
 "6월에는 소폭 반등했습니다. 유가가 되밀리고 종합 PMI가 50을 회복한 것을 반영한 것으로 보입니다.",
 "2022년 저점(-23.6)에는 크게 못 미칩니다. 러시아 가스 차단 때만큼의 충격은 아니라는 시장 판단입니다."],
 watch:"변동성이 극단적으로 큰 지표라 단월 수치에 반응하면 안 됩니다. 3개월 이동평균으로 방향만 보고, 함께 나오는 '현재상황지수'와의 격차를 확인하세요. 기대가 현재보다 높으면 회복 국면입니다.",

 "11.2. 무역분쟁 완화 기대로 연말 반등했습니다.",

 "26.8. 회복 기대가 이어졌습니다.",
 "-23.6. 8년 중 최저. 러시아 가스 차단과 물가 8.4%가 겹쳤습니다.",

 "17.0. 인하 사이클 기대가 반영됐습니다.",
 "약 20.0. 낙관이 유지됐습니다.",
 "약 -5.0 추정. 이란 사태로 4월 마이너스 전환했습니다."],
 arc:"ZEW의 8년은 진폭이 극단적입니다. 최고 54.4(2020년 백신), 최저 -23.6(2022년 가스 위기). 같은 기간 실제 GDP 성장률은 -6.1%에서 5.9% 사이였는데, 심리는 그보다 훨씬 크게 흔들렸습니다. 이것이 ZEW의 장점이자 단점입니다. 방향 전환은 가장 먼저 잡아내지만 크기는 과장합니다. 그래서 ZEW는 '무엇이 일어날까'가 아니라 '시장이 무엇을 걱정하고 있나'를 읽는 도구로 써야 합니다."}},

 what:"뮌헨의 Ifo 연구소가 독일 기업 약 9,000개에 현재 사업 상황과 향후 6개월 기대를 물어 만든 지수입니다. 2015년을 100으로 삼고, '현재상황지수'와 '기대지수'를 따로 발표한 뒤 둘을 합성합니다.",
 imp:"독일은 유로존 GDP의 약 30%, 산업생산의 30%를 차지합니다. 그래서 Ifo는 사실상 유로존 제조업의 대표 지표입니다. 특히 조사 표본이 PMI(약 800개)보다 10배 이상 커서 신뢰도가 높고, 유럽에서 가장 오래된 기업 서베이(1949년~)라 역사적 비교가 가능합니다.",
 sched:["매월","월말 (대략 24~26일)","10:00 CET","7월 말"],
 why:["Ifo 지수가 80년대 중반에서 장기평균(100)을 크게 밑돌고 있습니다. 2018년 이후 8년째 100을 회복하지 못했습니다.","이란 사태로 에너지 비용이 다시 오르면서 4~5월에 저점을 찍었다가 6월 소폭 반등했습니다. 제조업 PMI가 확장(52.0)인 것과 온도차가 있습니다.","차이의 원인은 표본입니다. PMI는 구매담당자에게 '전월 대비 방향'만 묻는 반면 Ifo는 경영진에게 '상황이 좋은가'를 묻습니다. 방향은 개선인데 수준은 나쁘다는 뜻입니다.","독일 제조업의 문제는 순환적이 아니라 구조적입니다. 에너지 비용, 중국과의 경쟁, 자동차 전환 지연이 겹쳐 있어 금리로 해결되지 않습니다."],
 watch:"현재상황지수와 기대지수를 나눠 보세요. 기대가 현재보다 높으면 회복 국면, 낮으면 추가 악화입니다. 그리고 Ifo와 PMI가 엇갈리면 표본이 큰 Ifo를 신뢰하는 편이 낫습니다.",
 url:"https://www.ifo.de/en/ifo-business-climate-index",
 yr:{u:"pt",lab:"연말 Ifo 지수",v:[111,117.2,101,96.3,92.2,94.7,88.6,86.4,84.7,87,85],n:["111.0. 구기준 기준으로 높은 수준이었습니다.","117.2. 사상 최고. 독일 제조업 호황의 정점이었습니다.","101.0. 2015=100 신기준으로 개편됐습니다. 무역전쟁으로 하락 전환했습니다.","96.3. 자동차 배기가스 규제와 수출 부진이 겹쳤습니다.","92.2. 팬데믹 충격.","94.7. 회복했지만 공급망 병목에 막혔습니다.","88.6. 러시아 가스 차단으로 급락했습니다.","86.4. '유럽의 병자' 논쟁이 재점화됐습니다.","84.7. 11년 중 최저. 독일 경제가 2년 연속 역성장했습니다.","약 87.0. 재정 확대 기대로 소폭 개선됐습니다.","약 85.0. 에너지 재급등으로 다시 하락 중입니다."],arc:"2017년 117.2에서 2024년 84.7로. 독일 제조업의 몰락을 이보다 잘 보여주는 지표는 없습니다. 그리고 2018년 이후 8년간 단 한 번도 100(장기평균)을 회복하지 못했습니다. 순환적 부진이라면 8년이나 갈 수 없습니다. 에너지 비용, 중국의 추격, 자동차 전환 실패라는 세 가지 구조적 문제가 동시에 온 결과이고, 유로존 저성장의 핵심 원인입니다."}},

  what: "독일 국채(분트) 10년물 금리를 기준으로, 이탈리아·스페인·그리스 같은 유로존 '남유럽' 국가 국채 금리가 얼마나 더 높은지를 보여주는 격차(스프레드)입니다. 같은 유로화를 쓰지만 재정 건전성·성장 전망 차이 때문에 국가별로 금리가 다르게 형성됩니다.",
  imp: "이 스프레드는 시장이 개별 회원국의 재정 위험을 어떻게 평가하는지 보여주는 가장 직접적인 지표입니다. 2010~12년 유로존 재정위기 때 이 스프레드가 수백 bp까지 벌어지며 유로존 붕괴 우려로 이어졌던 전례가 있어, 지금도 이 격차가 급격히 벌어지면 시장에 위기감이 확산됩니다.",
  sched: {cyc:"실시간",when:"각국 재무부 매일 발표",time:"당일 종가 기준",next:"매 영업일"},
  why: ["이탈리아-독일 10년물 스프레드가 75bp로, 2026년 초(약 116bp)보다 크게 좁혀졌습니다. 15년 만의 최저 수준에 근접합니다.","ECB의 추가 금리 인하 기대 속에 단기금리가 장기금리보다 낮아지는 환경에서, 이탈리아·그리스처럼 금리가 더 높은 국채로 '캐리 트레이드' 자금이 몰리고 있습니다.","미국의 재정적자 확대·연준 독립성 우려로 달러 자산에 대한 경계감이 커지며, 유럽 국채(특히 고금리 남유럽 국채) 쪽으로 자금이 이동하는 것도 스프레드 축소에 기여하고 있습니다.","이탈리아 정부의 재정건전화 정책(재정적자 GDP 대비 3% 이내 목표)이 신뢰를 얻고 있다는 점도 스프레드 축소의 구조적 배경으로 꼽힙니다."],
  watch: "스프레드 축소가 '유로존 통합 심화'(펀더멘털 개선) 때문인지, 아니면 '미국 회피'(일시적 자금 이동) 때문인지 구분해서 보세요. 후자라면 미국 상황이 안정되는 순간 스프레드가 다시 벌어질 수 있습니다.",
  url: "https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/",
  yr: {u:"bp",lab:"연말 이탈리아-독일 10년물 스프레드",v:[160,135,280,150,120,135,215,165,120,110,75],n:["160bp. 완만한 수준이었습니다.","135bp. 안정적이었습니다.","280bp로 급등. 이탈리아 포퓰리즘 정부 출범 우려가 컸습니다.","150bp. 진정됐습니다.","120bp. 팬데믹 공동대응(ECB 매입)으로 안정됐습니다.","135bp. 완만했습니다.","215bp로 재급등. 러시아 전쟁·긴축 우려가 겹쳤습니다.","165bp. 진정되기 시작했습니다.","120bp. 이탈리아 재정건전화 신뢰가 쌓였습니다.","110bp. 완만히 좁혀졌습니다.","75bp. 15년 만의 최저 수준에 근접했습니다."],arc:"이탈리아-독일 스프레드는 2018년 포퓰리즘 정부 출범 우려로 280bp까지 벌어졌다가, 2026년 75bp까지 좁혀지며 15년 만의 최저 수준에 근접했습니다. 이는 유로존이 재정위기의 그림자에서 실질적으로 벗어나고 있다는 신호이자, 동시에 미국 재정·통화정책에 대한 불신이 유럽으로 자금을 밀어내고 있다는 이중적 배경을 함께 보여줍니다."},

  what: "유로존 각국 정부의 부채 총액을 명목 GDP로 나눈 비율입니다. 유로존은 단일 통화를 쓰지만 재정정책은 각국이 따로 운영해, 나라마다 이 비율이 크게 다릅니다.",

  why: ["2026년 1분기 유로존 전체 정부부채 비율이 88.9%로, 4분기(87.8%)보다 올랐습니다. 17개 회원국에서 비율이 늘고 8개국에서 줄었습니다.","그리스(143.5%)와 이탈리아(138.9%)가 여전히 가장 높은 수준이지만, 이 대시보드의 '독일-남유럽 스프레드' 카드에서 보듯 시장은 이들 국가의 개선 노력을 긍정적으로 평가하고 있습니다.","프랑스(117.6%, +1.9%p)의 증가폭이 두드러져, 여러 애널리스트들이 '유로존의 약한 고리'로 프랑스를 지목하고 있습니다. 정치적 불안정이 재정건전화를 어렵게 만들고 있다는 평가입니다."],

corr:{
"bund10|edep":[0.72,"ECB 정책금리가 분트 금리의 기준이 됩니다. 다만 독일의 재정 확대가 추가 상승 요인으로 작용하고 있습니다."],
"sx5e|egdp":[0.3,"의외로 약합니다. 유로스톡스 구성 기업의 역외 매출 비중이 절반을 넘어, 유로존 GDP가 마이너스여도 지수는 버팁니다."],
"sx5e|eeur":[-0.45,"유로가 약해지면 수출기업 이익의 유로 환산액이 늘어 지수에 유리합니다. 다만 수입 원가 상승과 상쇄됩니다."],
"bund10|efisc":[-0.4,"재정적자 확대는 국채 발행 증가를 뜻해 금리를 밀어올립니다. 독일의 국방비 증액 논의가 분트 금리 상승의 한 요인입니다."],
"eifo|epmim":[0.75,"둘 다 독일 제조업을 봅니다. Ifo는 표본이 10배 크고 '수준'을, PMI는 '방향'을 묻습니다. 엇갈리면 Ifo를 신뢰하는 편이 낫습니다."],
"ezewc|eifo":[0.8,"ZEW 현재상황과 Ifo는 같은 것을 다른 대상에게 묻습니다. ZEW는 금융 전문가, Ifo는 기업 경영진입니다. 둘 다 8년째 최악을 가리킵니다."],
"ezewc|ezew":[0.35,"현재상황과 기대의 격차가 핵심입니다. 80포인트 격차는 '지금은 최악이지만 곧 나아질 것'이라는 기대이고, 2019년 이후 매년 빗나갔습니다."],
"efisc|egdp":[0.55,"성장이 나쁘면 세수가 줄어 적자가 커집니다. 그런데 유로존은 협약 때문에 적자가 커지면 긴축해야 하고, 긴축하면 성장이 더 나빠집니다. 유로존 특유의 악순환입니다."],
"ehicp|ecore":[.75,"헤드라인과 근원의 격차가 인플레의 성격을 알려줍니다. 격차가 크면 에너지발, 좁으면 수요발입니다. 지금 0.4%p 격차는 아직 에너지발에 머물고 있다는 뜻이고, ECB가 급하게 움직이지 않을 근거입니다."],
"ehicp|edep":[.80,"ECB의 유일한 법적 목표가 물가안정(중기 2%)입니다. 연준의 이중 책무와 달리 고용은 공식 목표가 아니라, 물가와 금리의 연결이 미국보다 더 직접적입니다."],
"ecore|edep":[.85,"ECB가 실제로 반응하는 것은 근원입니다. 에너지는 통화정책으로 통제할 수 없기 때문입니다. 헤드라인이 튀어도 근원이 안정적이면 인내하고, 근원이 오르면 즉시 움직입니다."],
"ewage|ecore":[.80,"유로존에서 가장 중요한 관계입니다. 서비스가 HICP의 46.8%이고 서비스 가격은 임금이 결정합니다. 임금이 3.7%로 내려온 것이 근원 2.4% 안정의 직접적 원인입니다."],
"ewage|edep":[.68,"ECB는 임금 트래커를 정책 판단의 핵심 입력값으로 씁니다. 임금이 안정되면 에너지발 물가 상승을 견딜 수 있고, 임금이 반등하면 성장을 희생해서라도 올려야 합니다."],
"em3|ehicp":[.70,"M3 증가율은 약 2년 시차로 물가에 선행합니다. 2020년 M3 10.5% → 2022년 물가 8.4%, 2023년 M3 0.2% → 2025년 물가 2.1%. ECB가 창립 때 통화량을 정책의 기둥으로 삼은 이유입니다."],
"em3|edep":[-.72,"금리가 오르면 대출이 줄어 통화량이 감소합니다. 유로존은 은행 중심 금융구조라 이 전달이 미국보다 훨씬 빠릅니다. 2023년 금리 4.00%가 M3를 0.2%까지 얼려버린 것이 그 증거입니다."],
"edep|egdp":[-.62,"금리 인상은 성장을 누릅니다. 유로존은 기업이 채권 대신 은행 대출에 의존하므로 금리 전달이 빠르고 직접적입니다."],
"epmic|egdp":[.90,"이 대시보드에서 가장 강한 관계입니다. 종합 PMI는 사실상 실시간 GDP입니다. Eurostat GDP보다 최대 4개월 빨라, PMI로 GDP를 예측하는 것이 표준적 방법입니다."],
"epmim|epmis":[.30,"보통 함께 움직이지만 2026년에는 정반대입니다. 제조업 52.0 확장 / 서비스 49.4 수축. 에너지 충격이 소비자 대면 서비스를 직격하고 제조업은 선구매 재고 축적으로 덕을 본 결과입니다."],
"epmis|eretail":[.72,"서비스 PMI와 소매판매는 같은 것을 다르게 재는 지표입니다. 둘 다 가계 소비의 함수이고, 에너지 가격이 오르면 함께 무너집니다. 2026년 1분기 GDP 역성장의 원인이 여기 있습니다."],
"epmim|eip":[.78,"제조업 PMI는 산업생산에 1~2개월 선행합니다. PMI는 당월 하순, 산업생산은 2개월 뒤에 나오므로 실질적 예고편입니다."],
"ehicp|eretail":[-.68,"에너지 물가가 오르면 가계 예산이 난방·연료로 흘러가고 나머지 소비가 밀려납니다. 유로존 소매판매는 사실상 에너지 가격의 거울입니다."],
"ehicp|egdp":[-.55,"에너지발 물가 상승은 유로존에 순수한 비용 충격입니다. 에너지를 수입하므로 가격이 오르면 소득이 역외로 유출되고 그만큼 성장이 깎입니다. 2026년 1분기 -0.2% 역성장의 직접 원인입니다."],
"egdp|eunemp":[-.45,"성장이 꺾여도 실업률이 잘 안 오릅니다. 해고 규제가 엄격하고 조업단축 제도가 잘 갖춰져 있기 때문입니다. 그래서 유로존 실업률은 심하게 후행하며, PMI 고용지수가 훨씬 빠른 신호를 줍니다."],
"eunemp|ewage":[-.65,"실업률이 낮으면 노동자의 협상력이 커져 임금이 오릅니다. 유로존은 노조 조직률이 높고 다년 협약이 일반적이라 이 관계가 미국보다 강하고 오래갑니다."],
"etrade|eeur":[.82,"유로존에서 가장 극적인 관계입니다. 2022년 무역수지가 3,320억 유로 적자로 뒤집히자 유로/달러가 0.95까지 떨어져 패리티를 깼습니다. 에너지를 달러로 결제하기 때문에 수입액 급증이 곧 유로 매도입니다."],
"eca|eeur":[.75,"경상흑자는 유로화 수요를 만듭니다. 유로존이 전통적으로 GDP 대비 2~3% 흑자를 유지해온 것이 유로화의 구조적 기반이었고, 흑자가 사라진 2022년에 유로가 무너졌습니다."],
"etrade|eca":[.85,"무역수지가 경상수지의 최대 구성 항목입니다. 유로존은 서비스수지와 소득수지가 상대적으로 작아, 무역이 경상수지를 거의 그대로 결정합니다."],
"ehicp|etrade":[-.70,"에너지 물가가 오르면 수입 대금이 늘어 무역흑자가 줄어듭니다. 같은 원인(에너지 가격)이 물가와 무역수지를 동시에 반대 방향으로 밀어냅니다."],
"eeur|ehicp":[-.50,"유로가 약해지면 달러 표시 수입품 가격이 올라 물가를 밀어올립니다. 다만 유로존은 역내 교역 비중이 커서 일본만큼 환율 민감도가 높지는 않습니다."],
"ezew|epmic":[.60,"ZEW는 PMI보다 열흘 이상 빠릅니다. 전문가 기대가 먼저 움직이고 실제 기업 활동이 뒤따릅니다. 다만 ZEW는 변동성이 커서 오신호도 많습니다."],
"eesi|epmic":[.78,"둘 다 심리지표이지만 ESI는 EU 공식 조사(표본 12만 5천)이고 PMI는 민간 조사입니다. ESI가 건설·소매까지 포함해 범위가 넓어, 둘이 엇갈리면 ESI를 신뢰하는 편이 낫습니다."],
"eesi|eretail":[.62,"ESI 구성 항목 중 소비자신뢰가 소매판매를 예고합니다. 소비자신뢰가 회복돼야 진짜 회복이라고 보는 이유입니다."],
"eip|egdp":[.68,"산업생산은 유로존 GDP의 약 20%를 차지합니다. 독일이 산업생산의 30%를 차지해, 사실상 독일 제조업이 유로존 성장률을 좌우합니다."]}

CN: {
name:"중국", sub:"국가통계국(NBS) · 중국인민은행(PBOC) · 해관총서 · 물류구매연합회(CFLP) · 국가외환관리국(SAFE)",
era:{
2016:["공급측 개혁 · 자본 유출","철강·석탄 과잉설비 감축을 시작했고 PPI가 5년 만에 플러스로 돌아섰습니다. 동시에 자본 유출로 외환보유액이 3조 달러선까지 떨어져 당국이 자본 통제를 강화했습니다."],
2017:["디레버리징 · 성장 반등","성장률이 6.9%로 7년 만에 반등했습니다. 공급측 개혁으로 PPI가 6.3% 급등했고, 당국은 그림자금융 억제와 금융 디레버리징에 착수했습니다."],
2018:["무역전쟁 개시 · 부양 전환","3월 미국 관세로 무역전쟁이 시작되자 디레버리징을 중단하고 지준율 인하로 방향을 틀었습니다. 상하이종합지수가 25% 급락했습니다."],
2019:["성장 6.0% · 돼지열병","성장률이 통계 발표 이래 최저인 6.0%까지 내려왔습니다. 아프리카돼지열병으로 돼지고기 값이 폭등해 CPI가 연말 4.5%까지 치솟는 기이한 조합이 나타났습니다."],
2020:["봉쇄 후 V자 반등","1분기 -6.8% 역성장 후 연간 2.2% 성장으로 주요국 중 유일하게 플러스를 기록했습니다. 수출이 방역물자와 재택 수요로 폭증했습니다."],
2021:["규제 폭풍 · 헝다 사태","빅테크·사교육·부동산에 동시 규제를 가했고 9월 헝다 디폴트로 부동산 위기가 시작됐습니다. 성장률 8.4%는 기저효과였습니다."],
2022:["제로코로나 · 성장 3.0%","상하이 봉쇄 등 제로코로나가 경제를 마비시켜 성장률이 3.0%에 그쳤습니다. 부동산 개발투자는 -10%로 처음 두 자릿수 감소했습니다."],
2023:["재개방 실망 · 디플레 진입","제로코로나 해제에도 반등이 약했습니다. CPI가 마이너스로 떨어지고 PPI는 1년 내내 마이너스인 디플레이션 국면에 들어갔습니다. 청년실업률 발표가 중단됐습니다."],
2024:["부양책 · 증시 급등","9월 대규모 통화·재정 부양책이 나오며 증시가 한 달 만에 30% 급등했습니다. 그러나 부동산과 소비는 회복되지 않았고 물가는 0%대에 머물렀습니다."],
2025:["관세 재전쟁 · 디플레 지속","미국의 고율 관세에 맞서면서도 수출은 우회로를 통해 버텼습니다. LPR은 5월 인하 이후 동결에 들어갔고 PPI는 계속 마이너스였습니다."],
2026:["수출 호황 · 내수 붕괴의 극단","2분기 성장률이 4.3%로 2022년 4분기 이후 최저이자 목표(4.5~5%)를 처음 하회했습니다. 그런데 6월 수출은 +27%, AI 관련 하드웨어 교역은 +56.6% 폭증했고 상반기 무역액이 사상 처음 25조 위안을 넘었습니다. 반면 고정자산투자 -5.7%, 민간투자 -8.5%, 부동산개발투자 -18.0%입니다. 국가통계국조차 '공급은 강하고 수요는 약한 모순이 두드러진다'고 인정했습니다."]},

{id:"clpr",fam:"금리·정책",org:"중국인민은행 PBOC",src:"中国人民银行 공개시장업무공고(公开市场业务公告) · 货币政策委员会(심의) · 전국은행간동업拆借센터(NIFC, LPR 파생 고시)",name:"기준금리",
 sub:"7일 역레포 1.40% · 2025년 5월 이후 동결",val:1.40,prev:1.40,unit:"%",good:"flat",chart:"step",

 extra:[["1년 LPR(파생)","3.00% (기업·가계 대출 기준)"],["5년 LPR(파생)","3.50% (모기지 기준)"],["동결 기간","2025년 5월 이후 14개월"],["금리 회랑","6/17 ±35bp → ±25bp로 축소"]],
 what:"2024년 7월 인민은행이 공식 전환한 이후 中国人民银行 공개시장업무 7일 역레포(逆回购) 금리가 실질적인 기준금리입니다. 매 영업일 공개시장조작 공고로 발표되며, 1년·5년 LPR은 이 금리에 연동돼 매월 20일 全国银行间同业拆借中心(NIFC)이 인민은행의 위임을 받아 별도 고시하는 파생 지표입니다. 최종 결정은 인민은행 본행이 하고, 中国人民银行货币政策委员会(통화정책위원회)가 분기 예회에서 정책 방향을 심의합니다.",
 imp:"중국 통화정책을 볼 때 가장 흔한 오해가 LPR을 기준금리로 여기는 것입니다. 판궁성 총재가 2026년 6월 루자쭈이 포럼에서 재확인했듯 공식 정책금리는 7일 역레포(현재 1.40%)이고, LPR은 그 결과를 반영해 매월 파생 고시되는 종속 변수입니다. 그리고 중국의 거시 정책 방향은 인민은행 단독이 아니라 정치국 회의에서도 함께 결정됩니다.",
 sched:["수시(공개시장조작)","금리 변경 시 공개시장업무공고 · 통화정책위원회는 분기 예회","비정기 발표","3분기 통화정책위원회 예회(10월경)"],
 why:["7일 역레포 금리가 1.40%로 2025년 5월 인하 이후 14개월째 동결돼 있습니다. 이것이 인민은행의 공식 기준금리입니다.",
 "6월 17일 루자쭈이 포럼에서 판궁성 총재가 단기금리 조절체계 개편을 발표했습니다. 익일물 임시 정·역레포의 금리 회랑을 7일 역레포 기준 ±35bp에서 ±25bp로 좁혀, 단기금리 변동폭을 줄이고 정책 전달력을 높이겠다는 것입니다.",
 "2분기 통화정책위원회 예회는 '적절히 완화적인 통화정책을 계속 시행하고 역주기·초주기 조절을 강화한다'고 밝혔습니다. 1분기 대비 '정책의 전향성·유연성·정밀성 강화'라는 표현이 새로 추가됐습니다.",
 "그럼에도 실제 금리는 움직이지 않았습니다. 이란 사태발 PPI 급등(6월 4.1%)이 광범위한 인하를 막았습니다. BBVA는 연내 금리·지준율 인하가 모두 없을 것으로 봅니다."],
 watch:"7일 역레포와 지급준비율(RRR)의 변경 여부를 보세요. LPR은 여기에 연동되는 파생 지표일 뿐입니다. 그리고 분기 통화정책위원회 예회 발표문의 표현 변화(예: '적절히 완화적' → '완화적')가 다음 정책 방향의 힌트입니다.",
 url:"https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/125431/125469/index.html",
 yr:{u:"%",lab:"연말 7일 역레포 금리",v:[2.25,2.50,2.55,2.50,2.20,2.20,2.00,1.80,1.50,1.40,1.40],n:[
 "2.25%. 안정적으로 유지됐습니다.",
 "2.50%. 2월·3월 두 차례 인상 후 12월 추가 인상. 자본 유출 방어와 디레버리징이 배경입니다.",
 "2.55%. 3월 소폭 인상 후 동결. 미 연준 인상에 보조를 맞췄습니다.",
 "2.50%. 11월 인하 전환. 무역전쟁 대응이었습니다.",
 "2.20%. 2~3월 팬데믹 대응으로 두 차례 인하했습니다.",
 "2.20%. 유지. 다른 나라가 긴축하는 동안 중국은 완화 기조를 지켰습니다.",
 "2.00%. 1월·8월 두 차례 인하. 헝다 사태와 제로코로나 충격에 대응했습니다.",
 "1.80%. 6월·8월 두 차례 인하. 디플레이션 진입에 대응했습니다.",
 "1.50%. 7월·9월 두 차례 인하. 9월 대규모 부양책의 핵심이었습니다.",
 "1.40%. 5월 인하 후 동결에 들어갔습니다.",
 "1.40%. 14개월째 동결. 유가 충격으로 추가 인하 여지가 막혔습니다."],
 arc:"7일 역레포 금리가 2.25%에서 1.40%까지, 11년간 85bp 내려왔습니다. 미국이 같은 기간 0%에서 5.5%를 오간 것과 비교하면 놀랍도록 좁은 폭입니다. 이유는 중국이 금리가 아니라 신용 총량과 재정으로 경기를 조절하기 때문입니다. 그래서 중국 통화정책을 금리 인하 폭만으로 읽으면 거의 항상 틀립니다. 사회융자총량(TSF)과 지급준비율을 함께 봐야 합니다. 2026년 금리 회랑 축소는 규모보다 정교함으로 방향을 튼 신호입니다."}},

{id:"cm2",fam:"금리·정책",org:"중국인민은행 PBOC",src:"中国人民银行 통화공급량(M2) 통계",name:"통화량 M2",

 what:"현금과 예금을 합한 광의통화입니다. 인민은행이 매월 중순에 신규 위안화 대출, 사회융자총량과 함께 발표합니다. 중국 M2는 GDP의 230%를 넘어 세계에서 가장 큰 통화량 규모입니다.",
 imp:"중국에서 통화량은 금리보다 훨씬 중요한 정책 수단입니다. 당국이 은행에 대출 총량을 배정하는 방식으로 경기를 조절하기 때문입니다. 다만 최근에는 M2가 늘어도 실물로 흐르지 않는 '유동성 함정' 현상이 나타나, 통화량 증가가 곧 경기 부양이라는 공식이 깨졌습니다.",
 sched:["매월","10~15일경","16:00 CST","8월 중순"],
 why:["M2 증가율이 8% 안팎으로 역사적 저수준에 머물러 있습니다. 2016년 11.3%의 3분의 2 수준입니다.",
 "돈이 늘어도 실물로 가지 않는 것이 문제입니다. 기업은 투자 대신 부채 상환에, 가계는 소비 대신 예금에 돈을 씁니다. 민간투자 -8.5%가 그 증거입니다.",
 "부동산이 핵심입니다. 과거에는 늘어난 통화가 부동산으로 흘러 경기를 돌렸는데, 개발투자가 -18%인 지금은 그 통로가 막혔습니다.",
 "그래서 인민은행이 돈을 풀어도 효과가 나지 않고, 당국이 통화보다 재정 부양을 선호하게 됐습니다."],
 watch:"M2 증가율보다 '사회융자총량(TSF)'과 '신규 위안화 대출'을 보세요. 실제로 실물에 흘러간 자금이 얼마인지는 그쪽에 나타납니다.",
 url:"http://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html",
 yr:{u:"%",lab:"연말 M2 증가율",v:[11.3,8.2,8.1,8.7,10.1,9.0,11.8,9.7,7.3,7.5,8.0],n:[
 "11.3%. 부양 국면으로 통화가 빠르게 늘었습니다.",
 "8.2%. 디레버리징으로 급감. 그림자금융 억제의 결과입니다.",
 "8.1%. 무역전쟁에도 통화 확대는 제한적이었습니다.",
 "8.7%. 소폭 확대.",
 "10.1%. 팬데믹 대응으로 늘렸습니다.",
 "9.0%. 정상화.",
 "11.8%. 제로코로나 충격에 대응해 크게 풀었습니다.",
 "9.7%. 재개방 부양.",
 "7.3%. 사상 최저권. 유동성 함정이 뚜렷해졌습니다.",
 "7.5%. 저수준 유지.",
 "약 8.0%. 돈을 풀어도 실물로 가지 않는 상태가 이어집니다."],
 arc:"M2 증가율이 2016년 11.3%에서 2024년 7.3%까지 내려왔습니다. 그런데 같은 기간 물가는 오르지 않았고 성장률도 계속 낮아졌습니다. 통화를 풀어도 효과가 없는 상태, 즉 대차대조표 불황의 전형입니다. 2022년 11.8%로 크게 풀었던 해에도 성장률은 3.0%였습니다. 중국의 문제가 돈의 양이 아니라 수요의 부재라는 사실을 이 지표가 증명합니다."}},

{id:"ctsf",fam:"금리·정책",org:"중국인민은행 PBOC",src:"中国人民银行 사회융자총량(TSF) · 신규 위안화 대출",name:"사회융자총량 (TSF)",

 what:"실물경제가 금융시스템에서 조달한 자금의 총량입니다. 은행 대출뿐 아니라 회사채, 지방정부 특별채, 신탁대출 같은 그림자금융까지 포함해 M2보다 실물 자금 흐름을 정확히 보여줍니다. 중국이 자체 개발한 지표입니다.",
 imp:"중국 경기의 진짜 선행지표입니다. 중국 정부는 금리가 아니라 '얼마나 많은 신용을 실물에 흘려보낼 것인가'로 경기를 조절합니다. 그래서 TSF 증가율의 방향이 곧 정책 스탠스의 방향이고, 통상 6~12개월 뒤 실물 지표에 나타납니다.",
 sched:["매월","10~15일경 (M2와 동시)","16:00 CST","8월 중순"],
 why:["TSF 잔액 증가율이 8%대 중반에서 정체돼 있습니다. 신용이 늘지 않는다는 뜻입니다.",
 "구성을 보면 지방정부 특별채가 증가분의 상당 부분을 차지합니다. 즉 민간 수요가 아니라 정부가 억지로 채우고 있는 구조입니다.",
 "민간투자가 -8.5%인 것이 핵심입니다. 기업이 돈을 빌려 투자할 의사가 없습니다. 자금을 공급해도 수요가 없으면 신용은 늘지 않습니다.",
 "7월 말 정치국 회의에서 재정 확대가 결정되면 지방채 발행이 늘어 TSF가 반등할 수 있습니다. 다만 그것은 정부 부채이지 민간 활력은 아닙니다."],
 watch:"TSF 중 '정부채'와 '민간 부문(대출+회사채)'을 나눠 보세요. 정부만 늘고 민간이 줄면 부양의 지속성이 없습니다.",
 url:"http://www.pbc.gov.cn/diaochatongjisi/116219/116225/index.html",

 "12.8%. 부동산과 인프라로 신용이 대거 흘러갔습니다.",
 "12.0%. 디레버리징 시작에도 여전히 높았습니다.",
 "9.8%. 그림자금융 규제로 급감했습니다.",
 "10.7%. 무역전쟁 대응으로 소폭 확대.",
 "13.3%. 팬데믹 대응으로 크게 풀었습니다.",
 "10.3%. 정상화.",
 "9.6%. 부동산 위축으로 민간 수요가 줄었습니다.",
 "9.5%. 지방채가 증가분을 채웠습니다.",
 "8.0%. 사상 최저권.",
 "8.4%. 저수준 유지.",
 "약 8.5%. 정부채만 늘고 민간은 줄어드는 구조가 굳어졌습니다."],
 arc:"TSF 증가율이 2016년 12.8%에서 2024년 8.0%까지 내려온 궤적이 중국 성장 둔화와 정확히 겹칩니다. 그리고 그 감소분의 대부분이 부동산 관련 신용입니다. 과거 중국 경제는 '신용 → 부동산 → 성장'이라는 단순한 엔진으로 돌았는데, 그 엔진이 2021년 헝다 사태 이후 꺼졌습니다. 지금 정부가 지방채로 빈자리를 메우고 있지만, 민간 신용이 살아나지 않는 한 성장률은 계속 내려갑니다."}},

{id:"ccpi",fam:"물가",org:"국가통계국 NBS",src:"国家统计局 소비자물가지수(CPI)",name:"소비자물가지수 (CPI)",

 what:"국가통계국이 매월 9일 전후에 발표합니다. 중국 CPI는 식품 비중이 약 20%로 선진국보다 훨씬 높아, 돼지고기 가격 하나가 전체 물가를 좌우하는 일이 자주 벌어집니다.",
 imp:"중국 물가는 다른 나라와 정반대 문제를 안고 있습니다. 너무 높아서가 아니라 너무 낮아서 걱정입니다. 2023년 이후 0% 안팎을 오가며 디플레이션 경계에 머물러 있고, 이는 명목 성장률과 기업 이익, 그리고 부채 상환 부담에 직접 영향을 줍니다. 물가가 안 오르면 실질 부채가 무거워집니다.",
 sched:["매월","9일 전후","09:30 CST","8월 9일경 (7월분)"],
 why:["상반기 CPI가 전년비 1.0% 상승에 그쳤습니다. 근원 CPI는 1.2%로 국가통계국 표현대로 '대체로 온건'합니다.",
 "1.0%라는 숫자는 정부 목표(약 3%)의 3분의 1입니다. 다른 나라에서는 좋은 소식이지만 중국에서는 수요 부족의 증거입니다.",
 "다만 하반기 들어 유가 상승분이 반영되며 오르는 추세입니다. BBVA는 2026년 전망을 1.2%로 상향했습니다.",
 "문제는 이 상승이 수요가 아니라 수입 에너지에서 온다는 점입니다. 소득이 늘어 물가가 오르는 것과 비용이 올라 물가가 오르는 것은 완전히 다릅니다."],
 watch:"헤드라인보다 근원 CPI와 서비스 물가를 보세요. 내수가 살아나면 그쪽이 먼저 오릅니다. 지금처럼 헤드라인만 오르면 오히려 가계에 부담입니다.",

{id:"cppi",fam:"물가",org:"국가통계국 NBS",src:"国家统计局 공업생산자출하가격지수(PPI)",name:"생산자물가지수 (PPI)",

 series:[["1월",-0.5],["2월",0.2],["3월",1.0],["4월",1.8],["5월",2.5],["6월",4.1,1]],
 extra:[["6월 전년비","+4.1% (확대)"],["6월 전월비","-0.3%"],["상반기","+1.5%"],["2023~25","대부분 마이너스"]],
 what:"공장 출고 단계의 가격입니다. 매월 CPI와 함께 발표되며, 중국 PPI는 국제 원자재 가격과 국내 과잉설비를 동시에 반영합니다.",
 imp:"세계 물가의 상류입니다. 중국이 세계 공산품의 3분의 1을 만들기 때문에, 중국 PPI가 마이너스면 전 세계로 저물가가 수출되고 플러스면 반대가 됩니다. 2023~25년 미국과 유럽의 재화 물가가 안정된 데는 중국 PPI 마이너스의 기여가 컸습니다.",
 sched:["매월","9일 전후 (CPI와 동시)","09:30 CST","8월 9일경 (7월분)"],
 why:["6월 PPI가 전년비 +4.1%로 상승폭이 크게 확대됐습니다. 상반기 누계는 +1.5%입니다.",
 "이란 전쟁발 원유·원자재 가격 급등이 직접 반영된 결과입니다. 수년간 이어진 마이너스 국면에서 벗어났습니다.",
 "그런데 전월비로는 -0.3%입니다. 국가통계국은 '상류의 가격 전가가 여전히 변동성에 직면해 있다'고 표현했습니다. 원가는 올랐지만 하류로 넘기지 못하고 있다는 뜻입니다.",
 "이 구조가 중국 기업 이익을 압박합니다. PPI 4.1%인데 CPI는 1.0%입니다. 3%p가 넘는 격차만큼 제조업 마진이 깎입니다."],
 watch:"PPI 플러스 전환이 좋은 소식만은 아닙니다. 수요가 살아나서가 아니라 수입 원가가 올라서라면, 기업 이익과 고용에는 오히려 악재입니다. CPI와의 격차를 함께 보세요.",
 url:"https://www.stats.gov.cn/sj/zxfb/",

 "3.5%. 상승세가 이어졌습니다.",
 "-0.3%. 무역전쟁과 수요 둔화로 다시 마이너스.",
 "-1.8%. 팬데믹으로 원자재가 무너졌습니다.",

 "4.1%. 상반기 강세 후 하반기 급락.",
 "-3.0%. 디플레이션 진입. 과잉설비가 가격을 눌렀습니다.",
 "-2.2%. 2년 연속 마이너스.",
 "-2.0%. 3년 연속 마이너스로 세계에 저물가를 수출했습니다.",
 "약 +1.5%. 유가 급등으로 4년 만에 플러스 전환했습니다."],
 arc:"중국 PPI가 2023~25년 3년 연속 마이너스였다는 사실이 세계 경제에 미친 영향은 과소평가돼 있습니다. 그 기간 미국과 유럽이 서비스 물가와 씨름하면서도 재화 물가는 안정적이었던 이유가 중국의 디플레이션 수출입니다. 지금 중국 PPI가 플러스로 돌아섰다는 것은 그 완충 장치가 사라진다는 뜻이고, 미국·유럽 물가에 상방 위험이 됩니다."}},

{id:"cgdp",fam:"성장",org:"국가통계국 NBS",src:"国家统计局 국내총생산(GDP) 예비추계",name:"실질 GDP 성장률",
 sub:"2026년 2분기 +4.3% (전년비)",val:4.3,prev:4.9,unit:"%",good:"up",chart:"bar",
 series:[["25Q3",5.0],["25Q4",5.1],["26Q1",4.9,1],["26Q2",4.3,1],["26H1",4.7,1]],
 extra:[["2Q 전년비","+4.3% (2022Q4 이후 최저)"],["2Q 전기비","+0.9% (1Q +1.3%)"],["상반기","+4.7%"],["정부 목표","4.5~5%"]],
 what:"국가통계국이 분기 종료 후 약 보름 만에 발표합니다. 세계 주요국 중 가장 빠른데, 그만큼 신뢰도 논란도 따라다닙니다. 전년 동기 대비가 기본이고 전기 대비도 함께 나옵니다.",
 imp:"중국 GDP는 경제 지표이자 정치 목표입니다. 매년 3월 양회에서 목표치를 정하고 그에 맞춰 정책을 동원합니다. 그래서 '목표 달성 여부'가 곧 하반기 부양책의 강도를 결정합니다. 2026년 2분기에 처음 목표 밴드를 하회했다는 사실이 7월 말 정치국 회의의 무게를 키웠습니다.",
 sched:["분기","분기 종료 후 약 15~18일","10:00 CST","3Q 10월 중순"],
 why:["2분기 성장률이 전년비 4.3%로 봉쇄가 있었던 2022년 4분기 이후 최저입니다. 올해 처음 정부 목표 밴드(4.5~5%)를 밑돌았습니다.",
 "전기 대비로도 0.9%로 1분기 1.3%에서 둔화했습니다. 2024년 2분기 이후 가장 약합니다.",
 "구성이 극단적으로 불균형합니다. 수출과 제조업은 강한 반면 가계소비와 민간투자가 부진하고, 부동산 침체와 에너지 비용 상승이 겹쳤습니다.",
 "국가통계국 스스로 '공급은 강하고 수요는 약한 모순이 두드러진다'고 인정했습니다. 관제 통계에서 이런 표현이 나오는 것은 이례적입니다."],
 watch:"헤드라인보다 '소비의 성장 기여도'를 보세요. 수출과 투자로만 채운 성장은 대외 여건이 바뀌면 즉시 무너집니다.",
 url:"https://www.stats.gov.cn/sj/zxfb/",
 yr:{u:"%",lab:"연간 실질성장률",v:[6.8,6.9,6.7,6.0,2.2,8.4,3.0,5.2,5.0,4.8,4.5],n:[
 "6.8%. 공급측 개혁과 부동산 부양이 성장을 받쳤습니다.",
 "6.9%. 7년 만의 반등이었습니다.",
 "6.7%. 무역전쟁 개시에도 부양책으로 방어했습니다.",
 "6.0%. 통계 발표 이래 최저였습니다.",
 "2.2%. 주요국 중 유일한 플러스 성장.",
 "8.4%. 기저효과 반등입니다.",
 "3.0%. 제로코로나로 목표(5.5%)를 크게 하회했습니다.",
 "5.2%. 재개방 반등이 기대에 못 미쳤습니다.",
 "5.0%. 9월 부양책으로 목표를 겨우 맞췄습니다.",
 "4.8%. 관세 전쟁에도 수출이 방어했습니다.",
 "약 4.5% 전망. 2분기 4.3%로 목표 밴드를 처음 하회했습니다."],
 arc:"6.8%에서 4.5%로, 11년간 성장률이 3분의 1 줄었습니다. 그런데 그 하강이 완만하고 매끄럽다는 점이 오히려 논란거리입니다. 실제 경제는 부동산 붕괴와 디플레이션으로 훨씬 거칠게 흔들렸는데 GDP만 부드럽습니다. 그래서 중국 경기를 볼 때는 GDP보다 전력 소비량, 화물 물동량, 철강 생산 같은 실물 지표를 교차 확인하는 것이 관행입니다."}},

{id:"cip",fam:"성장",org:"국가통계국 NBS",src:"国家统计局 규모이상 공업 부가가치",name:"산업생산",

 series:[["1월",5.5],["2월",5.6],["3월",5.9],["4월",6.1],["5월",5.8],["6월",6.0]],

 sched:["매월","15~17일 (1~2월 합산)","10:00 CST","8월 15일경 (7월분)"],
 why:["산업생산이 6% 안팎의 견조한 증가세를 유지하고 있습니다. GDP 4.3%보다 훨씬 높습니다.",
 "동력은 하이테크 제조업입니다. AI 관련 하드웨어 수출입이 56.6% 폭증하면서 반도체·서버·통신장비 생산이 급증했습니다.",

 "부동산 관련 업종(시멘트·철강·유리)은 계속 감소 중입니다. 개발투자 -18%가 그대로 전방 산업에 전달되고 있습니다."],
 watch:"총량이 아니라 '하이테크 제조 vs 소비재 vs 부동산 관련'의 세 갈래를 나눠 보세요. 중국 제조업은 지금 한 몸이 아닙니다.",
 url:"https://www.stats.gov.cn/sj/zxfb/",
 yr:{u:"%",lab:"연간 산업생산 증가율",v:[6.0,6.6,6.2,5.7,2.8,9.6,3.6,4.6,5.8,5.9,6.0],n:[
 "6.0%. 공급측 개혁으로 과잉설비를 줄이던 시기입니다.",
 "6.6%. 글로벌 수요 회복으로 개선됐습니다.",
 "6.2%. 무역전쟁 초기에도 견조했습니다.",
 "5.7%. 둔화.",
 "2.8%. 1분기 봉쇄 후 하반기 급반등했습니다.",
 "9.6%. 기저효과와 수출 폭증이 겹쳤습니다.",
 "3.6%. 제로코로나로 공장이 멈췄습니다.",
 "4.6%. 재개방 회복.",
 "5.8%. 제조업 투자와 수출이 이끌었습니다.",
 "5.9%. 관세에도 생산은 유지됐습니다.",
 "약 6.0%. AI 하드웨어가 생산을 끌어올리는 중입니다."],
 arc:"산업생산이 GDP 성장률을 계속 웃도는 것이 최근 중국의 특징입니다. 2026년 산업생산 6.0% vs GDP 4.3%. 만드는 능력은 늘어나는데 그것을 소비할 국내 수요가 없다는 뜻이고, 남는 물량은 수출로 나갑니다. 이것이 중국의 과잉생산 논쟁과 세계 각국의 관세 부과로 이어지는 구조적 갈등의 뿌리입니다."}},

 "청년실업률은 별도로 봐야 합니다. 2023년 21.3%를 찍고 발표가 중단됐다가 기준을 바꿔 재개됐는데, 여전히 도시 평균의 3배 수준입니다."],

 imp:"중국 경제의 모든 문제가 여기서 시작됐습니다. 부동산은 관련 산업까지 포함하면 GDP의 4분의 1을 차지했고, 지방정부 재정의 절반이 토지 매각 수입이었으며, 가계 자산의 70%가 집입니다. 2021년 헝다 사태 이후 이 세 개의 축이 동시에 무너졌고, 소비 부진·디플레이션·지방재정 위기가 모두 여기서 파생됐습니다.",
 sched:["매월","15~17일","10:00 CST","8월 15일경 (7월분)"],
 why:["상반기 부동산개발투자가 -18.0%로 감소폭이 확대됐습니다. 5년 연속 감소입니다.",
 "그런데 가격 쪽에는 안정 조짐이 있습니다. 6월 1선 도시(베이징·상하이·광저우·선전) 신규주택 가격이 전월비 플러스로 돌아섰고, 70개 도시 중 상승 도시가 20개로 늘었습니다.",
 "이 엇갈림이 중요합니다. 가격은 바닥을 다지는데 투자는 계속 줄어듭니다. 개발업체가 재고를 파는 데 집중하고 신규 착공을 하지 않기 때문입니다.",
 "국가통계국은 '차별화된 안정화 조짐'이라고 표현했습니다. 1선 도시는 살아나고 3~4선 도시는 계속 무너지는 양극화입니다."],
 watch:"개발투자(-18%)와 1선 도시 가격(플러스 전환)을 함께 보세요. 가격이 먼저 돌고 투자가 나중에 따라옵니다. 투자가 플러스로 돌아서야 진짜 바닥입니다.",

 arc:"2019년 +9.9%에서 2026년 -18.0%로. 이 반전이 중국 경제의 지난 7년을 설명하는 단 하나의 그래프입니다. 소비 붕괴도, 디플레이션도, 지방정부 부채 위기도, 청년실업도 전부 여기서 파생됐습니다. 그리고 이 조정은 아직 끝나지 않았습니다. 가격이 바닥을 다지기 시작한 것은 긍정적이지만, 투자가 회복되려면 개발업체의 재고가 소진되고 신규 수요가 살아나야 하는데 인구가 줄고 있어 구조적으로 어렵습니다."}},

  why: ["2026년 상반기 신규 도시 취업자가 695만 명으로, 연간 목표(1,200만 명)의 약 58%를 달성했습니다.","이 수치는 2025년 상반기와 정확히 같은 수준(695만 명, 변화 없음)입니다. 고용 창출 속도가 정체되고 있다는 신호입니다.","도시조사실업률은 5.2%로 안정적이지만, 이는 정부가 목표로 관리하는 지표라 시장 상황을 있는 그대로 반영하기보다 정책적 개입의 결과일 가능성도 있습니다.","청년 실업 문제가 지속되며, 정부는 AI·첨단제조·신에너지차·요양서비스 등 5대 분야에 550만 명 대상 직업훈련을 지원하는 등 별도 대책을 병행하고 있습니다."],

 "반면 소비재 생산은 50.2로 겨우 확장선이고 부동산 개발은 계속 압박받고 있습니다.",

  why: ["1분기 경상수지 흑자가 약 950억 달러로 4분기(800억 달러) 대비 확대된 것으로 추정됩니다.","6월 수출이 전년비 27% 급증하는 등 AI 하드웨어·전자제품 수출 호조가 상품수지 흑자를 계속 키우고 있습니다.","다만 중국인의 해외 여행 지출(여행수지 적자)이 서비스수지를 갉아먹고 있어, 상품수지만큼 서비스수지는 개선되지 않고 있습니다.","위안화가 나름대로 절상 압력을 받는데도(연초 이후 명목실효환율 +3.8%) 원/달러가 아닌 위안/달러 기준으로는 절상폭이 제한적인 것은, 자본유출(중국인의 해외자산 매입)이 무역흑자를 상당 부분 상쇄하고 있기 때문입니다."],
  watch: "상품수지와 서비스수지를 나눠 보세요. 상품수지 흑자가 계속 커지는데 위안화가 안 오르면, 그 차이만큼 자본이 유출되고 있다는 뜻이고 이는 중국인들의 자산 배분 신뢰도를 보여주는 신호이기도 합니다.",
  url: "https://www.safe.gov.cn/",
  yr: {u:"십억 달러",lab:"연간 경상수지 흑자",v:[196,188,24,102,274,317,401,253,424,450,380],n:["1,960억 달러 흑자. 안정적인 수준이었습니다.","1,880억 달러. 큰 변화가 없었습니다.","240억 달러로 급감. 무역분쟁으로 흑자가 크게 줄었습니다.","1,020억 달러. 완만히 회복했습니다.","2,740억 달러. 팬데믹 특수(방역물품·재택근무 장비 수출)로 급증했습니다.","3,170억 달러. 높은 흑자가 이어졌습니다.","4,010억 달러로 사상 최대. 공급망 대란 속 중국의 수출 우위가 부각됐습니다.","2,530억 달러. 글로벌 수요 둔화로 줄었습니다.","4,240억 달러. AI·전기차 수출 호황으로 다시 급증했습니다.","4,500억 달러 추정. 사상 최대치를 경신했습니다.","약 3,800억 달러(연환산) 추정. 1분기 기준으로는 흑자가 확대됐습니다."],arc:"중국의 경상수지 흑자는 2018년 무역분쟁으로 240억 달러까지 쪼그라들었다가, 2024~25년 4천억 달러가 넘는 사상 최대 규모로 돌아왔습니다. 이 회복의 원동력이 예전의 저가 제조업이 아니라 AI 하드웨어·전기차 같은 고부가 수출이라는 점이, '중국이 가치사슬을 한 단계 끌어올렸다'는 평가의 근거가 되고 있습니다."},

"cppi|clpr":[-.35,"PPI가 오르면 인하 여지가 줄어듭니다. 2026년 유가 충격으로 PPI가 4.1%까지 튀면서 14개월 동결이 이어진 직접적 이유입니다."],

"ctsf|cgdp":[.80,"중국에서 가장 중요한 관계입니다. 사회융자총량은 GDP에 6~12개월 선행합니다. 중국 정부는 금리가 아니라 신용 총량으로 경기를 조절하기 때문에, TSF 방향이 곧 성장률 방향입니다."],
"ctsf|cfai":[.85,"신용이 늘면 투자가 늘어납니다. 지금 TSF 8.5%인데 FAI가 -5.7%라는 것은, 자금은 공급되는데 빌려 쓸 사람이 없다는 뜻입니다. 대차대조표 불황의 전형적 신호입니다."],
"cm2|ccpi":[.25,"거의 관계가 없습니다. M2가 8% 늘어도 물가는 1%입니다. 돈이 실물이 아니라 예금에 잠겨 있기 때문이고, 유동성 함정의 증거입니다."],
"cfai|cgdp":[.75,"중국 성장 모델의 핵심 고리였습니다. GDP 대비 투자 비율이 40%를 넘었기 때문입니다. 그 투자가 -5.7%인데도 성장률이 4.3%인 것은 수출이 빈자리를 메우고 있기 때문입니다."],

"cprop|cretail":[.82,"이 대시보드에서 가장 중요한 중국 관계입니다. 가계 자산의 약 70%가 부동산인데 집값이 5년째 떨어지면서 자산효과가 역전됐습니다. 소득이 줄어서가 아니라 자산이 줄어서 소비를 멈춘 것이고, 그래서 소득 보조 부양책이 효과를 못 냈습니다."],
"cprop|ccpi":[.70,"부동산 침체 → 소비 위축 → 수요 부족 → 디플레이션. 2023년 이후 중국 물가가 0%대에 머문 근본 원인이 부동산입니다. 물가 문제를 물가 정책으로 풀 수 없는 이유입니다."],
"cretail|ccpi":[.68,"소비가 살아나야 물가가 오릅니다. 지금 CPI 1.0%는 수요 부족의 직접적 결과입니다. 중국의 디플레이션은 통화 현상이 아니라 소비 현상입니다."],
"cexp|cgdp":[.72,"2026년 중국 성장의 유일한 기둥입니다. 고정자산투자 -5.7%, 소매판매 +1.0%인 상황에서 성장률 4.3%를 만든 것이 수출 +27%입니다."],
"cexp|cip":[.78,"수출이 늘면 공장을 더 돌립니다. 산업생산 6.0%가 GDP 4.3%를 크게 웃도는 이유가 수출입니다. 만드는 것의 상당 부분이 해외로 나갑니다."],
"cexp|cfx":[-.55,"수출 호황은 달러 유입을 뜻하고 위안 절상 압력을 만듭니다. 다만 위안은 관리변동환율이라 시장 압력이 그대로 반영되지는 않습니다."],
"cexp|ccaixin":[.80,"민간 PMI는 수출 중소기업 중심이라 수출 증가율과 거의 함께 움직입니다. 민간 PMI가 NBS보다 높은 지금이 정확히 수출 우위 국면입니다."],
"cpmi|ccaixin":[.65,"둘의 격차가 '내수 vs 수출'의 격차입니다. NBS는 대형 국유·내수, 민간은 중소·수출 기업을 봅니다. 지금 1.2p 격차는 리밸런싱이 역방향으로 가고 있다는 뜻입니다."],
"cpmi|cip":[.75,"PMI는 산업생산에 약 2주 선행합니다. NBS PMI가 매월 말일, 산업생산이 다음 달 15일에 나오기 때문입니다."],
"cunemp|cretail":[-.30,"관계가 약합니다. 실업률이 5% 초반에서 거의 안 움직이는 동안 소매판매는 10.4%에서 1.5%로 무너졌습니다. 고용의 양이 아니라 자산과 미래 기대가 소비를 결정한다는 뜻입니다."],
"cunemp|cgdp":[-.35,"GDP가 6.8%에서 4.3%로 반토막 나는 동안 실업률은 4.9%에서 5.1%로 거의 변화가 없었습니다. 이 부자연스러운 안정성이 지표 신뢰도 논란의 근거입니다."],
"clpr|cprop":[-.40,"5년 LPR이 모기지 기준이라 부동산에 직접 영향을 줍니다. 다만 2024년 이후 금리를 내려도 집값이 안 오릅니다. 문제가 금리가 아니라 인구와 기대이기 때문입니다."],
"cfx|ccpi":[.30,"위안 절하는 수입물가를 올립니다. 다만 중국은 내수 수요가 워낙 약해 환율 전가가 잘 일어나지 않습니다."],
"cm2|ctsf":[.85,"둘 다 신용 총량을 보지만 TSF가 그림자금융과 채권까지 포함해 더 넓습니다. TSF가 M2보다 실물 자금 흐름을 정확히 보여줍니다."]}

  why: ["7월 29일 구리가 파운드당 $6.27로 전년 대비 35.86% 급등했습니다. 이 대시보드에 있는 원자재 중 가장 가파른 상승률입니다.","AI 데이터센터 건설과 재생에너지·전력망 확충이라는 장기 수요가 가장 큰 동력입니다. AI 서버 한 대, 태양광 발전소 하나마다 막대한 구리 배선이 필요합니다.","공급 쪽에서는 세계 최대 생산국 칠레에서 발생한 폭풍이 생산 차질 우려를 키웠고, 최대 소비국 중국의 재고도 타이트한 상태입니다.","이란 사태로 미군에 대한 공격이 있었던 날 구리도 함께 출렁였습니다. 지정학 리스크가 원유뿐 아니라 산업금속 전반의 위험회피 심리에도 영향을 준다는 뜻입니다."],
  watch: "구리 가격이 계속 오르는데 다른 산업금속(알루미늄 등)이나 신흥국 제조업 PMI가 안 따라오면, 이번 상승은 경기 회복이 아니라 AI·전력망이라는 특정 테마 수요일 가능성이 큽니다. 두 가지를 나눠 보세요.",
  url: "https://www.cmegroup.com/markets/metals/base/copper.html",
  sched: {cyc:"실시간",when:"24시간 전자거래(CME/LME)",time:"연속",next:"연속"},
  yr: {u:"$",lab:"연말 종가 (파운드당)",v:[2.5,3.31,2.65,2.79,3.52,4.46,3.81,3.89,4.03,5.2,6.27],n:["$2.50. 원자재 슈퍼사이클 종료 후 저점권이었습니다.","$3.31. 글로벌 동조 성장으로 32% 급등했습니다.","$2.65. 무역전쟁으로 하락했습니다.","$2.79. 완만한 회복이었습니다.","$3.52. 팬데믹 이후 인프라 투자 기대로 급등했습니다.","$4.46으로 당시 최고. 공급망 병목과 그린 전환 기대가 겹쳤습니다.","$3.81. 중국 부동산 위기로 수요 우려가 커지며 조정받았습니다.","$3.89. 안정적이었습니다.","$4.03. AI 데이터센터 수요가 부각되기 시작했습니다.","약 $5.20. AI·전력망 수요가 본격적으로 가격에 반영됐습니다.","$6.27로 사상 최고권. 전년 대비 36% 급등하며 AI 슈퍼사이클의 최대 수혜 원자재가 됐습니다."],arc:"구리의 11년은 2024년을 기점으로 완전히 새로운 국면에 들어갔습니다. 그 전까지는 전통적 경기 사이클(중국 부동산, 글로벌 제조업)을 따라 움직였는데, AI 데이터센터와 전력망 투자라는 구조적 수요가 더해지며 사상 최고가 행진이 시작됐습니다. '닥터 코퍼'라는 별명이 이제는 경기뿐 아니라 AI 투자 사이클까지 진단해야 하는 시대가 됐습니다."}

{ cat: "반도체", id: "m_semi10", name: "반도체 수출액 (10일/월간)", org: "관세청", val: 205.8, unit: "% (6.1~10 전년비 증가율)", sub: "2026년 6월 1~10일", extra: [["6.1~10 반도체 수출","전체 수출의 38.7% (+15.1%p)"],["6월 전체","448.2억 달러 (+199.5%)"],["6.1~10 전체 수출","286억 달러 (+85.9%)"],["무역수지(6.1~10)","+53억 달러"]], analysis: ["관세청이 매월 10일/20일/월말 세 차례 발표하는 조기 수출입 통계에서, 6월 1~10일 반도체 수출이 전년비 205.8% 급증했습니다.","반도체 수출 비중이 전체 수출의 38.7%까지 확대(+15.1%p)돼, 한국 수출에서 반도체 의존도가 계속 커지고 있음을 보여줍니다.","이 '10일치' 속보는 월말 확정치보다 3주 먼저 나와, 시장이 반도체 사이클의 방향 전환을 가장 빨리 포착할 수 있는 지표로 쓰입니다."], watch: "10일→20일→월간 수치가 같은 방향으로 가속되는지 보세요. 10일치가 특히 좋았는데 월간 확정치가 둔화되면 초순 밀어내기 효과였을 가능성이 있습니다.", url: "https://www.customs.go.kr" },
{ cat: "반도체", id: "m_inv", name: "반도체 재고율 (재고/출하 비율)", org: "국가데이터처", est: 1, val: 68, unit: "%", sub: "2026년 5월 추정", extra: [["전월비","-4%p (재고 소진 중)"],["2023년 재고 급증기 대비","크게 개선"],["출하지수","전년비 큰 폭 증가"],["의미","100% 미만이면 출하가 재고보다 빠르게 증가"]], analysis: ["제조업 반도체 재고율(재고를 출하로 나눈 비율)이 68% 수준까지 낮아지며, 출하가 재고보다 빠르게 늘어나는 '재고 소진' 국면을 이어가고 있습니다.","2023년 상반기 재고율이 200%를 넘나들던 다운사이클과 비교하면 극적으로 개선된 수치로, AI 서버향 수요가 재고 부담을 빠르게 해소하고 있음을 보여줍니다.","재고율이 낮다는 것은 추가 주문 여력이 있다는 뜻이라, 통상 다음 분기 생산·수출 확대로 이어지는 선행 신호로 해석됩니다."], watch: "재고율이 다시 오르기 시작하는지가 반도체 사이클 고점의 가장 빠른 경고 신호입니다. 출하 증가세가 꺾이지 않는 한 재고율 하락은 계속될 가능성이 큽니다.", url: "https://kostat.go.kr" },
{ cat: "반도체", id: "m_dram", name: "DRAM·NAND 고정거래가격", org: "삼성전자·SK하이닉스 (업계 견적, DRAMeXchange 등 집계)", est: 1, val: 15, unit: "% (분기 상승률, 서버 DRAM 기준)", sub: "2026년 3분기 계약가 추정", extra: [["서버 DRAM","공급 부족으로 강한 상승세"],["모바일 DRAM","서버 대비 완만한 상승"],["NAND","가격 상승 폭 상대적으로 제한적"],["최대 수요처","AI 서버(HBM 포함)"]], analysis: ["삼성전자·SK하이닉스가 마이크로소프트·구글·메타 등 빅테크에 공급하는 서버 D램 고정거래가격이 분기 기준 두 자릿수 상승세를 이어가고 있는 것으로 추정됩니다. HBM(고대역폭메모리) 중심의 AI 서버 수요가 가격 결정권을 공급사 쪽으로 확실히 넘겼습니다.","모바일 D램은 서버향만큼 강하지 않은데, 스마트폰 수요 자체가 정체된 상태에서 서버향으로 생산 능력이 우선 배분되고 있기 때문입니다.","이 고정거래가격은 삼성전자·SK하이닉스 반도체 부문 영업이익에 직결되고, 이 대시보드의 반도체 수출액·재고율과 함께 봐야 사이클의 전체 그림이 보입니다."], watch: "HBM 비중 확대가 D램 평균판매단가(ASP)를 얼마나 더 끌어올리는지 보세요. 범용 D램보다 HBM 쪽에 생산능력이 더 배분될수록 가격 협상력은 공급사에 유리해집니다.", url: "https://www.samsung.com/semiconductor/" },
{ cat: "배터리·이차전지", id: "m_batexp", name: "양극재·배터리셀 수출단가 및 물량", org: "관세청", est: 1, val: -8, unit: "% (수출단가 전년비)", sub: "2026년 상반기 추정", extra: [["수출 물량","완만한 증가"],["수출 단가","리튬 가격 하락 영향으로 하락"],["최대 수출국","미국·유럽"],["IRA 세액공제","여전히 핵심 변수"]], analysis: ["양극재·배터리셀 수출단가는 원재료(리튬)값 하락을 반영해 전년보다 낮은 수준입니다. 반면 수출 물량 자체는 완만히 늘고 있어 '단가는 싸지고 물량은 느는' 전형적인 원자재 하락기 패턴입니다.","미국 IRA(인플레이션감축법) 세액공제 정책의 향방이 여전히 최대 변수로, 정책 불확실성이 수주와 투자 결정을 계속 지연시키고 있습니다.","국내 배터리 3사는 EV 캐즘(수요 둔화기)을 ESS(에너지저장장치)·로봇용 배터리로 포트폴리오를 다변화해 돌파하려는 전략으로 전환하고 있습니다."], watch: "양극재 수출단가와 리튬 가격의 연동성을 함께 보세요(핵심광물 가격 카드 참고). 리튬 가격이 바닥을 다지면 양극재 단가도 반등할 가능성이 큽니다.", url: "https://www.customs.go.kr" },
{ cat: "배터리·이차전지", id: "m_minerals", name: "핵심 광물 가격 (리튬·니켈·코발트)", org: "LME · 상하이유색금속거래소 등 종합", est: 1, val: -3, unit: "% (리튬 탄산염 전년비)", sub: "2026년 7월 추정", extra: [["니켈","$7.20/lb (11년 중 유일하게 약세 지속)"],["코발트","공급 집중(콩고민주공화국) 리스크 상존"],["리튬","공급 과잉 지속, 가격 바닥권"],["배터리 원가 비중","약 40~50%"]], analysis: ["배터리 3대 핵심광물인 리튬·니켈·코발트 모두 공급 과잉 또는 수요 둔화로 낮은 가격대에 머물러 있습니다. 니켈은 이 대시보드의 원자재 탭에서도 유일하게 약세가 이어지는 금속입니다.","리튬은 호주·중국의 공격적 증산으로 가격이 바닥권을 유지하고 있어, 배터리 셀 원가에는 우호적이지만 광산업체들의 신규 투자 유인은 떨어뜨리고 있습니다.","코발트는 세계 생산의 대부분이 콩고민주공화국 한 나라에 집중돼 있어, 정치적 불안정이 발생하면 가격이 급변동할 수 있는 공급 리스크를 항상 안고 있습니다."], watch: "광물 가격 하락이 배터리 셀 판가에도 반영되는지 시차를 두고 확인하세요. 원재료가 싸져도 완성차 업체와의 판가 협상에는 통상 1~2분기 시차가 있습니다.", url: "https://www.lme.com" },
{ cat: "배터리·이차전지", id: "m_battery3", name: "K-배터리 3사 수주잔고", org: "LG에너지솔루션·삼성SDI·SK온 (공시 종합)", est: 1, val: -1, unit: "(전년 대비 방향: 정체~소폭 감소)", sub: "2026년 기준", extra: [["업계 화두","ESS(에너지저장장치) 비중 확대"],["2025년 ESS 설치량","314GWh (+49%)"],["로봇용 배터리 수요","2025년 4.6GWh → 2030년 12.8GWh 전망"],["구조조정","합작법인 재편·단독 운영 전환 진행 중"]], analysis: ["업계 전문가들은 '수주잔고가 더 이상 안전판이 아니다'라고 지적합니다. 공시상 계약은 남아 있어도 납기가 지났거나 실제 납품이 제한적인 사례가 있어, 숫자 자체보다 실제 매출 전환 여부가 중요해졌습니다.","3사 모두 EV 중심 생산라인을 ESS 쪽으로 옮기는 구조조정을 진행 중입니다. ESS 시장은 AI 데이터센터 전력 수요와 재생에너지 확대로 빠르게 크고 있어, EV 캐즘의 빈자리를 일부 메우고 있습니다.","로봇용 배터리라는 새로운 수요처도 부각되고 있지만, 아직 EV·ESS 대비 규모는 작아 당장의 실적 기여보다는 중장기 기대감 수준입니다."], watch: "수주잔고의 '질'을 보세요. 총액보다 ESS·로봇 등 신사업 비중이 얼마나 늘고 있는지, 그리고 공시된 계약이 실제 매출로 얼마나 전환되는지가 진짜 체력을 보여줍니다.", url: "https://www.lgensol.com" },
{ cat: "자동차", id: "m_auto_sales", name: "완성차 월간 내수·수출 판매대수", org: "한국자동차모빌리티산업협회(KAMA)", est: 1, val: 15.4, unit: "% (6월 생산 전월비)", sub: "2026년 6월", extra: [["6월 자동차 생산","전월비 +15.4%"],["수출 비중","내수보다 높음"],["주요 수출 시장","미국·유럽"],["환율 효과","원화 약세로 가격 경쟁력 개선"]], analysis: ["6월 자동차 생산이 전월 대비 15.4% 급증하며 산업활동동향 전체 개선을 이끌었습니다. 원/달러 환율이 17년 3개월 만의 최고치를 기록하며 수출 가격 경쟁력이 개선된 것이 배경입니다.","내수보다 수출 비중이 높은 구조가 이어지고 있어, 원화 약세가 자동차 산업에는 우호적으로 작용하고 있습니다.","다만 미국의 관세 정책 변화 가능성은 여전히 하방 리스크로, 수출 대수 자체는 늘어도 마진은 관세 부담으로 눌릴 수 있습니다."], watch: "내수와 수출의 증가 속도 차이를 보세요. 수출만 늘고 내수가 정체되면 환율 효과에 기댄 반짝 호조일 수 있고, 둘 다 늘면 수요 자체의 개선입니다.", url: "https://www.kama.or.kr" },
{ cat: "자동차", id: "m_ev", name: "친환경차(EV·HEV) 판매 비중", org: "한국자동차모빌리티산업협회(KAMA)", est: 1, val: 32, unit: "% (하이브리드+전기차 합산 비중)", sub: "2026년 상반기 추정", extra: [["하이브리드(HEV)","친환경차 중 가장 빠른 성장"],["순수전기차(EV)","캐즘으로 성장 둔화"],["국내 완성차사 전략","HEV 라인업 확대로 전환"],["글로벌 트렌드","EV 일변도에서 HEV 병행으로 선회"]], analysis: ["국내 완성차 판매에서 친환경차(하이브리드+전기차) 비중이 32% 안팅까지 늘었는데, 성장을 이끄는 것은 순수전기차가 아니라 하이브리드입니다. 이는 배터리 3사가 겪는 'EV 캐즘'과 정확히 같은 이야기의 다른 면입니다.","완성차 업체들은 EV 일변도 전략에서 벗어나 하이브리드 라인업을 늘리는 쪽으로 빠르게 방향을 틀었습니다. 소비자들이 아직 완전한 전기차 전환에는 신중하다는 뜻입니다.","이 흐름은 배터리 업계의 ESS 전환과 함께, '전동화는 계속되지만 그 경로가 예상보다 더디고 다양해지고 있다'는 산업 전반의 재조정을 보여줍니다."], watch: "하이브리드와 순수전기차의 비중 변화 속도를 나눠서 보세요. 하이브리드가 계속 EV를 앞지르면, 완성차·배터리 업계의 전동화 로드맵 자체가 수정될 수 있습니다.", url: "https://www.kama.or.kr" },
{ cat: "자동차", id: "m_auto_share", name: "미국·유럽 시장 점유율 및 인센티브", org: "업계 집계(KAMA·해외법인 공시 종합)", est: 1, val: -1, unit: "(관세 부담 확대 국면)", sub: "2026년 기준", extra: [["미국 관세","자동차·부품 관세 부과 지속"],["대응 방식","현지 인센티브(할인) 확대로 판매 방어"],["유럽","친환경 규제 대응 위한 라인업 조정"],["환율 효과","원화 약세가 가격 경쟁력 일부 보완"]], analysis: ["미국의 자동차 관세 부과가 이어지면서, 국내 완성차 업체들은 현지 인센티브(할인·리스 조건 개선)를 확대해 점유율 방어에 나서고 있습니다. 이는 매출은 유지해도 마진은 깎이는 방식의 대응입니다.","원/달러 환율 약세가 관세 부담의 일부를 상쇄해주고 있지만, 근본적인 해법은 아니라는 것이 업계의 시각입니다.","유럽에서는 탄소규제 강화에 맞춰 친환경차 라인업을 조정하는 것이 점유율 유지의 핵심 과제로 떠오르고 있습니다."], watch: "인센티브 지출 규모가 커지는 속도를 보세요. 점유율은 유지되는데 인센티브가 계속 늘면, 그 시장에서의 수익성이 구조적으로 낮아지고 있다는 신호입니다.", url: "https://www.kama.or.kr" },
{ cat: "조선", id: "m_ship_price", name: "신조선가지수", org: "Clarksons Research", est: 1, val: 189, unit: "pt (2016=100 기준 근사)", sub: "2026년 상반기 추정", extra: [["LNG운반선","고부가가치 선종 중심 수주"],["도크 예약","2029년 인도분까지 마감"],["3사 합산 수주잔고","약 200조원 규모"],["최근 추세","2023년 정점 이후 완만한 조정"]], analysis: ["신조선가지수는 LNG운반선·암모니아운반선 등 친환경·고부가가치 선종 수요에 힘입어 높은 수준을 유지하고 있습니다. 한국 조선 3사(HD한국조선해양·한화오션·삼성중공업)의 도크는 이미 2029년 인도분까지 예약이 찬 상태입니다.","수주잔량 자체는 2023년 정점 이후 완만히 줄고 있는데, 이는 수요 위축이 아니라 저가 수주를 거절하고 고수익 선박 위주로 도크를 채우는 '선별 수주' 전략의 결과로 해석됩니다.","다만 계약 시점 가격이 고정된 상태에서 후판(철판) 가격이나 인건비가 오르면 실제 이익은 줄어들 수 있어, 수주 자체보다 현장의 원가 관리가 다음 관건으로 꼽힙니다."], watch: "수주잔고 감소를 위기로 오해하지 마세요. 선종 구성(고부가가치 비중)과 실제 인도 시 마진율이 더 중요한 지표입니다.", url: "https://www.clarksons.com" },
{ cat: "조선", id: "m_ship_backlog", name: "수주잔고 & 신규수주 목표 달성률", org: "산업통상자원부 · 조선 3사 공시", est: 1, val: 75, unit: "% (연간 목표 대비 진행률 추정)", sub: "2026년 상반기 기준", extra: [["연간 목표","각사 수주 목표 대비 진행 중"],["선종 구성","LNG선·컨테이너선 중심"],["카타르 등 장기 LNG 프로젝트","도크 예약의 핵심 축"],["인력난","생산 능력의 실질적 제약 요인"]], analysis: ["조선 3사의 상반기 신규 수주는 연간 목표치의 약 75% 수준까지 진행된 것으로 추정됩니다. 카타르 등 중동發 장기 LNG운반선 프로젝트가 도크 예약의 핵심 축입니다.","다만 목표 달성률이 높다고 해서 곧바로 실적 개선으로 이어지는 것은 아닙니다. 실제 매출 인식은 수주 이후 2~3년의 건조 기간을 거쳐야 하기 때문입니다.","생산 능력의 실질적 제약은 이제 수주가 아니라 숙련 인력 부족입니다. 국내 조선업의 다음 과제는 수주 자체보다 인력난 해소로 옮겨가고 있습니다."], watch: "목표 달성률과 함께 용접공 등 숙련 인력 수급 상황을 보세요. 수주는 넘치는데 지을 사람이 부족하면 매출 인식 시점이 계속 뒤로 밀릴 수 있습니다.", url: "https://www.motie.go.kr" },
{ cat: "방위산업", id: "m_defense", name: "K-방산 해외수주잔고 및 계약액", org: "방위사업청 · K-방산 각사 공시", est: 1, val: 1, unit: "(수주 누적 확대 국면)", sub: "2026년 기준", extra: [["핵심 수출 품목","전차·자주포·전투기·미사일 체계"],["주요 시장","폴란드·중동·아시아·오세아니아"],["전략","단순 수출→기술이전·현지생산 병행"],["2026년 화두","'수주'에서 '이행'(실제 인도) 단계로 전환"]], analysis: ["K-방산은 2022년 폴란드向 대규모 계약을 기점으로 수주가 누적되며 해외수주잔고가 계속 쌓여온 산업입니다. 2026년은 그동안 쌓아온 계약을 실제로 이행(생산·인도)하는 단계로 넘어가는 해로 평가됩니다.","단순 완제품 수출을 넘어 현지 생산·기술이전을 포함하는 계약 구조가 늘고 있어, 초기 계약 규모보다 후속 유지보수·부품 공급 등 장기 매출까지 함께 봐야 진짜 규모를 알 수 있습니다.","중동·아시아·오세아니아로 시장이 다변화되고 있어, 특정 지역 의존 리스크는 과거보다 줄어드는 추세입니다."], watch: "'신규 계약액'과 '실제 인도·이행 실적'을 구분해서 보세요. 방산은 계약과 실제 매출 인식 사이에 수년의 시차가 있어, 계약액만으로 실적을 예단하면 오차가 클 수 있습니다.", url: "https://www.dapa.go.kr" },
{ cat: "석유화학·철강", id: "m_petro", name: "에틸렌-나프타 스프레드", org: "한국석유화학협회 · 업계 집계", est: 1, val: -1, unit: "(수익성 낮은 구간 지속)", sub: "2026년 기준", extra: [["손익분기점","통상 톤당 300달러 안팎"],["현재 스프레드","손익분기 근처 또는 하회 추정"],["최대 압박 요인","중국발 공급 과잉"],["구조조정","국내 일부 설비 가동 중단·매각 검토"]], analysis: ["에틸렌 가격에서 원료인 나프타 가격을 뺀 스프레드가 손익분기점 부근에 머물러 있는 것으로 추정됩니다. 중국의 대규모 에틸렌 설비 증설이 만성적인 공급 과잉을 만들고 있는 것이 근본 원인입니다.","국내 석유화학 업체들은 낮은 스프레드가 장기화되자 일부 노후 설비의 가동을 중단하거나 매각을 검토하는 등 구조조정에 나서고 있습니다.","이란 사태로 인한 유가·나프타 가격 변동성이 스프레드에 추가적인 불확실성을 더하고 있어, 원가(나프타)와 판가(에틸렌)의 방향이 엇갈릴 경우 수익성이 더 나빠질 수 있습니다."], watch: "중국의 신규 에틸렌 설비 가동 시점을 주시하세요. 공급이 계속 늘어나는 한 스프레드가 구조적으로 개선되기는 어렵습니다.", url: "https://www.kpia.or.kr" },
{ cat: "석유화학·철강", id: "m_refining", name: "정제마진", org: "한국석유공사 · 업계 집계", est: 1, val: 6, unit: "달러/배럴 (싱가포르 복합정제마진 추정)", sub: "2026년 7월 추정", extra: [["손익분기점","통상 배럴당 4~5달러"],["이란 사태 영향","중동 정제설비 리스크로 마진 확대"],["국내 정유 4사","수출 비중 높아 마진에 민감"],["휘발유 크랙 스프레드","여름 성수기로 확대"]], analysis: ["정제마진이 배럴당 6달러 안팎으로 손익분기점(4~5달러)을 웃돌고 있는 것으로 추정됩니다. 이란 사태로 중동 정제설비 가동 차질 우려가 커지면서 마진이 확대됐습니다.","여름철 운전 성수기로 휘발유 크랙 스프레드가 확대된 것도 정제마진 개선에 기여하고 있습니다. 이 대시보드의 'RBOB 가솔린' 원자재 카드와 같은 맥락입니다.","국내 정유 4사는 내수보다 수출 비중이 높아 정제마진 변화에 특히 민감한 구조입니다. 마진이 좋을 때 수출 물량을 늘리는 전략을 구사합니다."], watch: "정제마진과 원유 가격이 함께 오르는지, 아니면 정제마진만 따로 오르는지를 구분하세요. 둘 다 오르면 수요 강세, 정제마진만 오르면 공급(정제설비) 차질이 원인입니다.", url: "https://www.knoc.co.kr" },
{ cat: "석유화학·철강", id: "m_steel", name: "열연·후판 유통 가격", org: "한국철강협회 · 유통업계 집계", est: 1, val: 8, unit: "% (열연강판 전년비 상승 추정)", sub: "2026년 7월 추정", extra: [["후판 가격","조선업 호황으로 동반 상승"],["최대 수요처","조선(후판)·자동차·건설(열연)"],["중국산 저가재","유통시장 압박 요인"],["원가 요인","철광석·원료탄 가격 변동"]], analysis: ["열연강판 유통가격이 전년 대비 8% 안팎 오른 것으로 추정됩니다. 조선업 호황으로 후판 수요가 늘면서 후판 가격이 동반 상승하고 있고, 이는 조선사 입장에서는 원가 부담 증가 요인입니다.","중국산 저가 철강재의 유입이 국내 유통가격의 상승폭을 제한하는 요인으로 계속 작용하고 있어, 국내 철강업체들은 가격 경쟁과 관세 대응을 동시에 신경 써야 하는 상황입니다.","건설 경기 부진은 열연 수요에 하방 압력을 주는 반면, 자동차·조선 호조가 이를 상쇄하고 있는 엇갈린 구도입니다."], watch: "후판 가격 상승이 조선 3사의 신조선가지수 대비 원가 부담으로 얼마나 반영되는지 함께 보세요. 후판값이 계속 오르면 조선사들의 수주 이익률이 예상보다 낮아질 수 있습니다.", url: "https://www.kosa.or.kr" },
{ cat: "바이오·제약", id: "m_lo", name: "기술이전(Licensing-Out) 실적", org: "한국제약바이오협회 · 각사 공시", est: 1, val: 1, unit: "(활발한 계약 체결 국면)", sub: "2026년 기준", extra: [["주요 계약 상대","글로벌 빅파마"],["계약 구조","선급금+단계별 마일스톤+로열티"],["최대 강점 분야","항체·ADC(항체약물접합체)"],["과제","실제 상용화·마일스톤 수취까지 장기간 소요"]], analysis: ["국내 바이오텍의 기술이전(L/O) 계약이 항체 신약·ADC(항체약물접합체) 분야를 중심으로 활발하게 이어지고 있습니다. 글로벌 빅파마들이 초기 임상 단계의 유망 물질을 선점하려는 수요가 큽니다.","계약 총액이 크게 보도되는 경우가 많지만, 실제로는 선급금 비중이 작고 개발 단계별 마일스톤·로열티가 대부분이라 계약 발표 시점과 실제 현금 유입 시점 사이에 큰 시차가 있습니다.","이 구조 때문에 L/O 계약 건수·총액보다 '선급금 규모'와 '파트너사의 개발 진행 상황'이 실질적인 기업가치를 판단하는 데 더 중요합니다."], watch: "계약 총액의 헤드라인 숫자보다 선급금 비율을 확인하세요. 선급금이 5% 미만인 계약은 실제 현금화까지 수년, 때로는 개발 중단으로 마일스톤을 못 받는 경우도 있습니다.", url: "https://www.kpbma.or.kr" },
{ cat: "바이오·제약", id: "m_cdmo", name: "CMO/CDMO 수주잔고", org: "삼성바이오로직스·롯데바이오로직스 등 각사 공시", est: 1, val: 1, unit: "(수주잔고 확대 지속)", sub: "2026년 기준", extra: [["최대 수혜 요인","글로벌 바이오의약품 위탁생산 수요 증가"],["경쟁 우위","대규모 생산 capacity·품질 신뢰도"],["신규 증설","4공장 등 생산능력 확충 진행"],["지정학 요인","미국의 자국 내 생산 유도 정책 리스크"]], analysis: ["국내 CDMO(위탁개발생산) 기업들의 수주잔고가 대규모 생산 설비 증설과 함께 계속 늘고 있습니다. 글로벌 제약사들이 자체 생산 대신 위탁생산을 늘리는 큰 흐름의 수혜를 받고 있습니다.","다만 미국이 바이오의약품의 자국 내 생산을 유도하는 정책(관세·인센티브)을 검토하는 것은 중장기적으로 해외向 CDMO 수주에 부담이 될 수 있는 지정학 리스크입니다.","수주잔고가 늘어도 신규 공장의 가동률이 목표만큼 빨리 올라오지 못하면 실제 매출·이익 개선 속도는 예상보다 더딜 수 있습니다."], watch: "수주잔고 증가 속도와 신규 공장 가동률 상승 속도를 함께 보세요. 수주만 늘고 가동률이 안 따라오면 자본 투자 부담만 커지는 구간이 길어질 수 있습니다.", url: "https://www.samsungbiologics.com" },
{ cat: "바이오·제약", id: "m_fda", name: "FDA/EMA 품목허가 및 임상 3상 진행 건수", org: "식품의약품안전처 · FDA · EMA 종합", est: 1, val: 1, unit: "(허가·임상 건수 완만한 증가)", sub: "2026년 기준", extra: [["최대 강점","바이오시밀러·항체 신약"],["임상 3상","다수 파이프라인 진행 중"],["허가 리스크","임상 실패 시 기업가치 급락 가능"],["규제 환경","FDA 심사 기준 지속 변화"]], analysis: ["국내 제약·바이오 기업들의 FDA·EMA 임상 3상 진행 건수가 완만히 늘고 있고, 바이오시밀러 분야에서는 이미 여러 품목이 허가를 획득해 안정적인 매출원으로 자리 잡았습니다.","신약 파이프라인은 임상 3상까지 가는 데만 통상 수년이 걸리고, 이 단계에서 실패하면 그동안의 개발비가 매몰되며 기업가치가 급락할 수 있어 고위험·고수익 구조입니다.","FDA의 심사 기준이나 우선심사 지정 여부 같은 규제 환경 변화도 허가 시점에 큰 영향을 주는 변수입니다."], watch: "임상 3상 '진행 중' 건수보다 '중간 결과 발표 시점'을 캘린더에 표시해두세요. 이 시점에 주가가 가장 크게 움직이는 이벤트입니다.", url: "https://www.mfds.go.kr" },
{ cat: "엔터테인먼트(K-컬처)", id: "m_album", name: "음반 수출액 & 초동 판매량", org: "관세청 · 써클차트", est: 1, val: 1, unit: "(수출액·초동판매량 모두 증가 추세)", sub: "2026년 기준", extra: [["최대 수출 시장","미국·일본·동남아"],["초동 판매량","신보 발매 첫 주 판매량 지표"],["실물 음반 역설","스트리밍 시대에도 실물 앨범 수출은 계속 확대"],["팬덤 경제","포토카드 등 MD 결합 판매가 초동 견인"]], analysis: ["K팝 음반 수출액이 꾸준히 늘고 있고, 신보 발매 첫 주 판매량인 '초동 판매량'이 팬덤의 화력을 가장 먼저 보여주는 지표로 업계에서 널리 쓰입니다.","스트리밍이 대세인 시대에도 실물 음반 수출이 계속 느는 역설적 현상은, 포토카드 등 한정판 굿즈를 앨범에 결합해 '소장품'으로 파는 팬덤 경제 모델 때문입니다.","초동 판매량은 컴백 직후 주가·실적 기대에 즉각 반영되는 경우가 많아, 엔터테인먼트 업종 투자자들이 가장 먼저 확인하는 실시간 지표 중 하나입니다."], watch: "초동 판매량과 함께 '앨범 버전 수'를 확인하세요. 같은 총 판매량이라도 버전을 잘게 나눠 중복구매를 유도한 결과인지, 순수한 팬덤 확장인지에 따라 지속가능성이 다릅니다.", url: "https://circlechart.kr" },
{ cat: "엔터테인먼트(K-컬처)", id: "m_concert", name: "글로벌 공연 티켓 판매량 & MD 매출", org: "각 소속사 공시 · 업계 집계", est: 1, val: 1, unit: "(월드투어 확대 국면)", sub: "2026년 기준", extra: [["수익 구조","티켓 매출+MD(굿즈)+콘텐츠 판매"],["MD 매출 비중","공연 매출의 상당 부분을 차지"],["최대 시장","북미·유럽·동남아 순회공연"],["환율 효과","해외 공연 매출은 원화 약세 시 환산액 증가"]], analysis: ["K팝 아티스트들의 월드투어 티켓 판매량이 꾸준히 늘고 있고, MD(공식 굿즈) 매출이 공연 매출에서 차지하는 비중이 갈수록 커지고 있습니다. 티켓보다 MD 마진율이 더 높은 경우도 많습니다.","해외 공연 매출은 달러·유로로 벌어들이는 만큼, 원화 약세 국면에서는 원화 환산 매출이 자동으로 늘어나는 효과가 있습니다.","공연 매출은 소속사 실적에 즉각 반영되는 반면, 스케줄이 분기별로 들쭉날쭉해 실적의 변동성을 키우는 요인이기도 합니다."], watch: "티켓 매출과 MD 매출의 비중 변화를 함께 보세요. MD 비중이 계속 늘면 팬덤의 소비 여력과 충성도가 견고하다는 뜻이고, 이는 티켓 가격 인상 여력으로도 이어집니다.", url: "https://dart.fss.or.kr" },
{ cat: "게임", id: "m_dau", name: "게임 일일 활성 이용자 수 (DAU)", org: "각사 공시 · 센서타워 등 집계", est: 1, val: 1, unit: "(신작 출시 직후 급등, 이후 자연 감소가 일반적)", sub: "2026년 기준", extra: [["핵심 관전 포인트","출시 후 DAU 하락 속도(리텐션)"],["매출 연동","DAU × 유료화 비율 × 객단가"],["장르별 편차","MMORPG는 완만, 캐주얼은 급격한 하락 곡선"],["글로벌 동시 출시","DAU 규모를 키우는 핵심 전략"]], analysis: ["신작 게임은 출시 직후 마케팅 효과로 DAU가 급등했다가 몇 주에 걸쳐 자연 감소하는 것이 일반적인 패턴입니다. 그래서 절대적인 DAU 숫자보다 '하락 속도(리텐션)'가 게임의 진짜 체력을 보여줍니다.","DAU가 매출로 이어지려면 유료화 비율과 이용자당 결제액(ARPU)이 함께 따라와야 하는데, 이 세 지표를 곱한 것이 실제 매출 추정치의 기본 공식입니다.","장르별로 패턴이 달라, MMORPG는 완만하고 오래가는 반면 캐주얼·하이퍼캐주얼 게임은 초반 집중 후 급격히 빠지는 경향이 있습니다."], watch: "출시 4주 차, 8주 차 DAU 잔존율을 확인하세요. 이 시점까지 DAU가 초기치의 30~40% 이상을 유지하면 장기 흥행 신호로 봅니다.", url: "https://sensortower.com" },
{ cat: "게임", id: "m_appstore", name: "앱스토어·구글플레이 매출 순위", org: "센서타워 · 모바일인덱스", est: 1, val: 1, unit: "(순위 변동이 실시간 흥행 지표)", sub: "2026년 기준", extra: [["매출 순위 산정","일별 결제액 기준 추정 순위"],["국내 게임사 최대 격전지","매출 톱10 진입 여부"],["글로벌 진출 지표","해외 앱스토어 순위 동시 추적"],["한계","공식 매출액이 아닌 추정치"]], analysis: ["앱스토어·구글플레이의 매출 순위는 공식 매출 발표 전에 게임의 흥행 여부를 실시간으로 가늠할 수 있는 가장 빠른 지표입니다. 국내 게임사들은 신작 출시 직후 이 순위 톱10 진입 여부를 핵심 성과지표로 삼습니다.","다만 이 순위는 센서타워 등 제3자가 결제 데이터를 추정한 것이라 실제 공식 매출액과는 오차가 있을 수 있고, 특히 중국처럼 자체 앱마켓 비중이 큰 시장에서는 정확도가 떨어집니다.","국내 게임사들은 국내 순위뿐 아니라 미국·일본·동남아 등 해외 앱스토어 순위를 함께 추적해, 특정 신작의 글로벌 흥행 여부를 판단하는 데 활용합니다."], watch: "출시 첫 주 반짝 순위보다 한 달 이상 순위를 유지하는지를 보세요. 스파이크성 순위 진입은 마케팅 효과일 수 있지만, 장기 유지는 실제 재미와 과금 구조가 뒷받침된다는 뜻입니다.", url: "https://sensortower.com" },
{ cat: "건설·부동산", id: "m_construction", name: "건설기성액 및 건설수주액", org: "국가데이터처 · 통계청", est: 1, val: -1.9, unit: "% (건설업 생산 전년비, 5월 기준)", sub: "2026년 5월", extra: [["6월 건설업 생산","전월비 +3.8%"],["부동산 PF 리스크","건설수주 위축의 핵심 배경"],["공공 발주","민간 부진을 일부 상쇄"],["원자재 비용","철근·시멘트 가격 부담 지속"]], analysis: ["건설업 생산이 5월 전년비 -1.9%로 여전히 위축된 상태지만, 6월에는 전월 대비 3.8% 늘며 저점을 다지는 모습입니다. 건설기성액(실제 공사 진행 실적)과 수주액(신규 계약)을 나눠서 봐야 진짜 흐름을 알 수 있습니다.","민간 건설수주는 부동산 PF 경색으로 계속 위축돼 있는 반면, 공공 발주(SOC 등)가 이를 일부 상쇄하는 구도가 이어지고 있습니다.","철근·시멘트 등 원자재 비용 부담이 여전해, 수주가 늘어도 건설사들의 채산성 개선은 더딘 편입니다."], watch: "건설기성액(과거 수주가 실제 공사로 반영되는 실적)과 신규 수주액을 나눠 보세요. 기성액은 유지되는데 신규 수주가 계속 줄면, 1~2년 뒤 건설업 생산이 다시 꺾일 수 있다는 선행 신호입니다.", url: "https://kostat.go.kr" },

  watch: "리그 수 증가 속도와 실제 원유 생산량 증가 속도를 비교하세요. 셰일업계가 자본 규율을 지키는 한, 리그가 늘어도 생산 증가는 과거보다 훨씬 완만할 수 있습니다.",

{ cat: "공작기계·로봇·반도체장비", id: "j_jmtba", name: "JMTBA 공작기계 수주액", org: "일본공작기계공업회 (JMTBA)", val: 45.1, unit: "% (4월 전년비)", sub: "2026년 4월 확정치", est: 1, extra: [["4월 수주액","1,889.7억 엔 (역대 월간 2위)"],["2026년 전망","1조 7,000억 엔 (2025년 대비 +6%)"],["2018년 역대 최고","1조 8,158억 엔 — 2026년 경신 기대"],["최대 수요","반도체·데이터센터·AI 관련 설비"]], analysis: ["4월 공작기계 수주액이 전년비 45.1% 급증한 1,889.7억 엔으로, 3월(1,935억 엔)에 이어 역대 월간 2위를 기록했습니다. 중국·미국向 수주가 각각 사상 최고치를 경신했습니다.","반도체·데이터센터·AI 관련 설비 수요가 최대 동력입니다. 일본 공작기계로 만든 정밀부품이 결국 전 세계 반도체 제조장비(SEAJ 카드 참고)를 구성한다는 점에서, 이 지표는 글로벌 반도체 투자 사이클의 '숨은 선행지표'로도 읽힙니다.","업계는 2026년 연간 수주액이 2018년 사상 최고치(1조 8,158억 엔)를 넘어설 수 있다고 전망하고 있습니다."], watch: "중국·미국向 수주 비중을 함께 보세요. 이 두 시장이 동시에 사상 최고치를 기록하고 있다는 것은, 각국의 제조업 자동화·반도체 투자가 동시다발적으로 진행되고 있다는 신호입니다.", url: "https://www.jmtba.or.jp/statistics/" },
{ cat: "공작기계·로봇·반도체장비", id: "j_jara", name: "JARA 산업용 로봇 수주·출하액", org: "일본로봇공업회 (JARA)", val: 1, unit: "(자동화 수요로 완만한 회복)", sub: "2026년 기준", est: 1, extra: [["최대 수요처","자동차·전자·반도체 조립라인"],["중국 비중","전체 수출의 상당 부분"],["AI 로봇","차세대 수요처로 부각"],["안야와川전기 등","주요 로봇 제조사 실적과 연동"]], analysis: ["산업용 로봇 수주·출하액이 자동화 투자 수요에 힘입어 완만히 회복하고 있습니다. 자동차·전자·반도체 조립라인이 최대 수요처입니다.","중국이 여전히 최대 수출 시장이라, 중국의 제조업 경기(고정자산투자 -5.7%로 부진)와 로봇 수주가 서로 엇갈리는 신호를 낼 수 있습니다.","AI 로봇·휴머노이드 로봇이라는 새로운 수요처가 부각되며, 전통적인 산업용 로봇을 넘어서는 성장 스토리가 업계에서 주목받고 있습니다."], watch: "중국向 수주 비중의 변화를 보세요. 중국 제조업 투자가 부진한 가운데 로봇 수주가 견조하다면, 이는 인건비 상승에 따른 자동화 전환 수요(경기와 무관한 구조적 수요)일 가능성이 큽니다.", url: "https://www.jara.jp/" },
{ cat: "공작기계·로봇·반도체장비", id: "j_seaj", name: "SEAJ 일본 반도체 장비 출하액", org: "일본반도체장비협회 (SEAJ)", val: 1, unit: "(AI 반도체 투자 수요로 견조)", sub: "2026년 기준", est: 1, extra: [["최대 고객","TSMC·삼성전자·SK하이닉스 등"],["일본의 강점","노광·세정·검사장비"],["JMTBA와의 관계","공작기계 수요의 배후 수요처"],["대중국 수출 규제","일부 첨단장비 수출 제약 지속"]], analysis: ["일본 반도체 제조장비 출하액이 전 세계 AI 반도체 투자 붐에 힘입어 견조한 흐름을 이어가고 있습니다. 이 대시보드의 'Hyperscaler CAPEX'·'SIA 반도체매출' 카드와 같은 수요 사이클의 일본 쪽 수혜입니다.","일본은 노광·세정·검사 등 특정 공정 장비에서 세계적 강점을 갖고 있어, 파운드리·메모리 투자가 늘 때마다 일본 장비업체 수주가 함께 늘어나는 구조입니다.","다만 미국의 대중국 반도체 장비 수출 규제가 일본 업체에도 일부 적용돼, 중국向 첨단장비 수출에는 제약이 남아 있습니다."], watch: "JMTBA 공작기계 수주와 함께 보세요. 반도체 장비 출하가 늘면 그 장비를 만드는 데 필요한 정밀 공작기계 수주도 함께 늘어나는 경향이 있어, 두 지표가 같은 이야기의 다른 단계를 보여줍니다.", url: "https://www.seaj.or.jp/statistics/" },
{ cat: "공작기계·로봇·반도체장비", id: "j_semimat", name: "반도체 소재 수출 (웨이퍼·감광액 등)", org: "재무성 무역통계", est: 1, val: 1, unit: "(엔저 효과로 수출액 견조)", sub: "2026년 기준", extra: [["최대 품목","실리콘웨이퍼·포토레지스트(감광액)·불화수소"],["일본의 시장 지위","글로벌 반도체 소재 상당 부분 점유"],["최대 수출국","한국·대만·중국"],["2019년 수출규제","한일 갈등 당시 공급망 리스크로 부각된 전례"]], analysis: ["실리콘웨이퍼·포토레지스트(감광액)·고순도 불화수소 등 반도체 핵심 소재의 수출액이 엔저와 글로벌 반도체 생산 확대에 힘입어 견조한 흐름입니다.","일본은 이 소재들의 세계 시장에서 압도적인 점유율을 갖고 있어, 한국·대만·중국의 반도체 생산량이 늘어날수록 일본 소재 수출도 함께 늘어나는 구조입니다.","2019년 한일 갈등 당시 일본 정부가 이 소재들의 한국向 수출을 규제했던 전례가 있어, 이 품목은 순수 상업 지표를 넘어 지정학적 공급망 리스크 지표로도 읽힙니다."], watch: "이 대시보드의 한국·중국 반도체 수출 카드와 함께 보세요. 한국·중국의 반도체 수출이 늘 때 일본의 소재 수출도 함께 느는지가, 일본이 '반도체 밸류체인의 상류'에 있다는 것을 확인해주는 신호입니다.", url: "https://www.customs.go.jp/toukei/" },
{ cat: "자동차", id: "j_jama", name: "JAMA 월간 자동차 생산·판매·수출", org: "일본자동차공업회 (JAMA)", val: 1, unit: "(엔저로 수출 채산성 개선)", sub: "2026년 기준", est: 1, extra: [["엔/달러","약 148엔대"],["최대 수출시장","미국·유럽·아시아"],["미국 자동차 관세","여전히 부담 요인"],["국내 판매","경차 비중 높음"]], analysis: ["일본 완성차의 생산·수출이 엔저(148엔대)에 힘입어 채산성 개선의 수혜를 받고 있습니다. 다만 미국의 자동차 관세 부과가 이 개선분의 상당 부분을 상쇄하고 있습니다.","국내 판매는 경차 비중이 높은 일본 시장 특성상 완만한 흐름을 보이는 반면, 수출은 환율 효과로 상대적으로 견조합니다.","이 대시보드의 한국 '완성차 판매대수' 카드와 비교하면, 두 나라 모두 자국 통화 약세를 수출 경쟁력으로 활용하는 유사한 전략을 쓰고 있음을 알 수 있습니다."], watch: "미국의 대일 자동차 관세 정책 변화를 주시하세요. 엔저 효과가 아무리 커도 관세가 더 오르면 순효과는 마이너스로 돌아설 수 있습니다.", url: "https://www.jama.or.jp/statistics/" },
{ cat: "자동차", id: "j_hev", name: "하이브리드(HEV) 판매비중 & 해외공장 가동률", org: "일본자동차공업회 (JAMA)", val: 1, unit: "(HEV 비중 확대, 해외공장 가동률 지역별 편차)", sub: "2026년 기준", est: 1, extra: [["일본 완성차 전략","EV보다 HEV 우선 확대"],["동남아 공장","가동률 상대적으로 견조"],["중국 현지공장","현지 업체와의 경쟁으로 가동률 부진"],["미국 현지공장","관세 회피 목적의 현지생산 확대"]], analysis: ["일본 완성차 업체들은 순수 전기차(EV)보다 하이브리드(HEV) 라인업 확대를 우선하는 전략을 유지하고 있습니다. 이는 한국 완성차 업계의 최근 전략 전환(HEV 비중 확대)과 같은 방향입니다.","해외공장 가동률은 지역별로 크게 엇갈립니다. 동남아 공장은 견조한 반면, 중국 현지공장은 로컬 브랜드와의 경쟁 심화로 가동률이 부진합니다.","미국의 관세 정책에 대응해 현지생산 비중을 늘리는 움직임도 이어지고 있어, '관세를 피하기 위한 생산기지 재배치'가 새로운 경영 변수로 떠올랐습니다."], watch: "중국 현지공장 가동률의 추가 하락 여부를 보세요. 중국 로컬 브랜드(EV 중심)의 약진이 계속되면 일본계 완성차의 중국 사업 재편(공장 매각·축소) 압력이 커질 수 있습니다.", url: "https://www.jama.or.jp/statistics/" },
{ cat: "관광·소비", id: "j_jnto", name: "JNTO 방일 외국인 수", org: "일본정부관광국 (JNTO)", val: -6.8, unit: "% (전년비)", sub: "2026년 6월 추정치", est: 1, extra: [["6월 방일객","314만 8,600명"],["상반기 누적","2,108만 4,800명 (-2.0%)"],["3개월 연속","전년 동월 대비 감소"],["대만·한국·미국·인도 등 15개 시장","6월 기준 역대 최고 경신"]], analysis: ["6월 방일 외국인이 314만 8,600명으로 전년 동월 대비 6.8% 감소했습니다. 4월부터 3개월 연속 전년 대비 감소인데, 중국 시장의 큰 폭 위축이 전체를 끌어내리고 있습니다.","다만 대만·한국·미국·인도 등 15개 시장에서는 6월 기준 역대 최고치를 경신해, 중국 한 나라의 문제이지 인바운드 전체의 구조적 침체는 아니라는 해석이 많습니다.","상반기 누적으로는 2,108만 명으로 전년 동기 대비 2.0% 감소했는데, '일본 관광은 계속 사상 최고를 경신한다'는 통념과 달리 2026년은 실제로 꺾인 해라는 점이 눈에 띕니다."], watch: "중국 시장의 회복 여부를 보세요. 중국을 제외한 나머지 시장은 대부분 견조하거나 사상 최고치라, 중국 하나만 정상화되면 전체 수치도 금방 플러스로 돌아설 수 있습니다.", url: "https://www.jnto.go.jp/statistics/" },
{ cat: "관광·소비", id: "j_hotel", name: "호텔 객실가동률 & RevPAR", org: "관광청 숙박여행통계조사", est: 1, val: -1, unit: "(방일객 둔화로 완만한 조정)", sub: "2026년 기준", extra: [["ADR(평균객실단가)","엔저 덕에 여전히 견조"],["OCC(객실가동률)","방일객 감소로 소폭 하락"],["RevPAR","ADR×OCC, 호텔 수익성 핵심 지표"],["도쿄·오사카·교토 등","도시별 편차 존재"]], analysis: ["호텔 객실가동률(OCC)이 방일 외국인 감소(JNTO 카드 참고)의 영향으로 소폭 조정받고 있습니다. 다만 평균객실단가(ADR)는 엔저 덕분에 여전히 견조해, 가동률 하락을 상당 부분 상쇄하고 있습니다.","ADR과 OCC를 곱한 RevPAR(객실당매출)이야말로 호텔 수익성을 가장 잘 보여주는 지표로, 호텔 REIT(TSE REIT지수 카드 참고)의 실적과도 직결됩니다.","도쿄·오사카·교토 등 주요 관광도시와 지방 간 편차가 여전히 커서, 전국 평균만 보면 개별 도시의 실제 상황을 놓치기 쉽습니다."], watch: "ADR과 OCC 중 어느 쪽이 RevPAR 변화를 주도하는지 보세요. OCC 하락을 ADR 인상으로 상쇄하는 국면이 계속되면, 호텔업계가 '양보다 질(단가)'로 전략을 전환하고 있다는 뜻입니다.", url: "https://www.mlit.go.jp/kankocho/siryou/toukei/shukuhakutokei.html" },
{ cat: "관광·소비", id: "j_dutyfree", name: "백화점 면세 매출액", org: "일본백화점협회", est: 1, val: -8, unit: "% (전년비, 추정)", sub: "2026년 기준", extra: [["최대 고객층","중국인 관광객 비중 압도적"],["JNTO 카드와 연동","중국 방일객 감소가 직접 영향"],["엔저 효과","단가는 유지, 인원이 관건"],["면세제도 개편","최근 몇 년간 수차례 변경"]], analysis: ["백화점 면세 매출액이 전년비 감소한 것으로 추정됩니다. 중국인 관광객 의존도가 압도적으로 높은 이 지표는, JNTO 방일외국인수 카드에서 확인된 중국 시장 위축의 영향을 가장 직접적으로 받습니다.","엔저로 1인당 구매 단가 자체는 유지되고 있지만, 방문객 수 자체가 줄면서 총 매출액에는 하방 압력이 가해지고 있습니다.","일본 정부의 면세제도 개편(사후면세 방식 전환 등)도 최근 몇 년간 이어지고 있어, 제도 변화가 매출 통계에 일시적 왜곡을 줄 수 있다는 점도 함께 감안해야 합니다."], watch: "중국인 관광객 비중의 회복 여부가 이 지표의 방향을 사실상 결정합니다. JNTO 카드에서 중국 시장이 반등하는지를 함께 확인하세요.", url: "https://www.depart.or.jp/" },
{ cat: "게임·엔터", id: "j_famitsu", name: "Famitsu 주간 게임 소프트·콘솔 판매량", org: "Famitsu(週刊ファミ通)", est: 1, val: 1, unit: "(신작 출시 주간 집계, 등락 큼)", sub: "2026년 기준", extra: [["집계 방식","일본 국내 소매 판매량 주간 집계"],["콘솔 판매","신형 하드웨어 출시 여부에 좌우"],["소프트 판매","대형 프랜차이즈 신작 출시가 핵심 변수"],["글로벌 동시발매","일본 내수만으로는 흥행 전체를 못 봄"]], analysis: ["Famitsu 주간 집계는 일본 국내 게임 소프트·콘솔의 소매 판매량을 가장 빠르게 보여주는 지표입니다. 대형 프랜차이즈 신작이 출시되는 주에는 판매량이 급증했다가 이후 빠르게 감소하는 패턴이 일반적입니다.","콘솔 판매량은 신형 하드웨어 출시나 가격 인하 이벤트가 있을 때만 크게 움직이고, 평상시에는 완만한 흐름을 보입니다.","다만 이 집계는 일본 국내 소매 판매만 반영해, 글로벌 동시발매가 일반화된 요즘은 전체 흥행 규모를 보려면 해외 매출까지 함께 봐야 합니다."], watch: "발매 후 2주 차, 4주 차 판매량 감소 속도를 보세요. 첫 주 판매량이 커도 이후 급격히 꺾이면 초기 팬덤 소비가 끝난 뒤 대중적 확장에는 실패했다는 뜻일 수 있습니다.", url: "https://www.famitsu.com/ranking/" },
{ cat: "게임·엔터", id: "j_iplicense", name: "IP 해외 라이선싱 매출액", org: "각사 공시·업계 집계 종합", est: 1, val: 1, unit: "(캐릭터·콘텐츠 해외 로열티 매출 견조)", sub: "2026년 기준", extra: [["최대 수익원","캐릭터 상품화(굿즈·완구·의류) 라이선스"],["해외 비중","북미·유럽·아시아 전역"],["환율 효과","엔저로 로열티 원화·달러 환산액 유리"],["최대 강점","장수 IP의 꾸준한 라이선싱 수익"]], analysis: ["일본 애니메이션·게임 IP의 해외 라이선싱 매출이 견조하게 이어지고 있습니다. 캐릭터 상품화(굿즈·완구·의류) 로열티가 핵심 수익원입니다.","엔저는 이 로열티 수익의 원화·달러 환산액을 늘려주는 효과가 있어, 콘텐츠 기업들의 해외 라이선싱 사업에 우호적인 환경입니다.","이 대시보드의 한국 '음반수출·공연 매출' 카드와 비교하면, 일본은 캐릭터 IP 라이선싱, 한국은 아티스트 팬덤 경제라는 서로 다른 방식으로 콘텐츠를 수출하고 있음을 알 수 있습니다."], watch: "장수 IP(수십 년 된 프랜차이즈)와 신규 IP의 매출 비중 변화를 보세요. 장수 IP 의존도가 계속 높다면 안정적이지만, 새로운 히트작 발굴 여부가 장기 성장의 관건입니다.", url: "https://www.meti.go.jp/policy/mono_info_service/contents/" },
{ cat: "부동산·금융", id: "j_condo", name: "수도권 신축 아파트 분양가 & 계약률", org: "부동산경제연구소", est: 1, val: 1, unit: "(분양가 상승, 계약률은 둔화 조짐)", sub: "2026년 기준", extra: [["평균 분양가","도쿄 도심 중심으로 사상 최고권"],["계약률 70% 기준","이 아래면 '고전'으로 분류하는 업계 관행"],["건축비 상승","자재비·인건비 부담 지속"],["해외 투자자","엔저로 도쿄 부동산 매수세 유입"]], analysis: ["수도권(도쿄권) 신축 아파트 평균 분양가가 건축비 상승과 도심 재개발 프로젝트 증가로 사상 최고권을 유지하고 있습니다. 다만 초기계약률은 예년 대비 다소 둔화되는 조짐을 보입니다.","분양가가 계속 오르는데 계약률이 둔화된다는 것은, 실수요자 입장에서 가격 부담이 커지고 있다는 신호로 해석됩니다. 업계에서는 초기계약률 70%를 흥행과 고전을 가르는 기준으로 삼습니다.","동시에 엔저로 해외 투자자들의 도쿄 부동산 매수세가 유입되면서, 실수요와 투자수요가 뒤섞여 가격을 밀어올리는 구조가 나타나고 있습니다."], watch: "초기계약률이 70%를 밑도는 프로젝트 비중이 늘어나는지 보세요. 이 비중이 계속 늘면 분양가 상승이 실수요 여력을 넘어서고 있다는 뜻이고, 이는 결국 분양가 조정 압력으로 이어질 수 있습니다.", url: "https://www.fudousankeizai.co.jp/" },
{ cat: "부동산·금융", id: "j_reit", name: "TSE REIT 지수", org: "도쿄증권거래소 (TSE)", val: 1, unit: "(금리 상승 국면에서 상대적 약세)", sub: "2026년 기준", est: 1, extra: [["구성","오피스·주택·호텔·물류 등 J-REIT 전체"],["금리 민감도","JGB 10년물 금리 상승 시 대체로 부진"],["호텔리츠","방일객 둔화로 상대적 약세 우려"],["물류리츠","전자상거래 확대로 견조"]], analysis: ["TSE REIT 지수는 일본은행의 정책금리 인상(1.00%, 31년 만의 최고 수준)과 JGB 10년물 금리 상승 국면에서 상대적으로 부진한 흐름을 보이고 있습니다. REIT는 배당 매력이 채권 금리와 경쟁하는 자산이라, 금리가 오르면 상대적 매력이 떨어집니다.","섹터별로는 엇갈립니다. 호텔 REIT는 방일 외국인 감소(JNTO 카드 참고) 우려로 상대적 약세인 반면, 물류 REIT는 전자상거래 확대 수혜로 견조합니다.","이 대시보드의 'JGB 10년물' 거시지표 카드와 나란히 보면, '30년 만의 금리 정상화'가 REIT 시장에 어떤 영향을 주는지 실시간으로 확인할 수 있습니다."], watch: "JGB 10년물 금리와 TSE REIT 지수의 역상관 관계를 확인하세요. 일본은행의 추가 인상이 예고될 때마다 REIT 지수가 단기적으로 출렁이는 패턴이 반복될 가능성이 큽니다.", url: "https://www.jpx.co.jp/markets/indices/reit/index.html" }
];

const MICRO_CN = [
{ cat: "부동산", id: "c_propinv", name: "부동산 개발투자 증가율", org: "국가통계국(NBS)", val: -18, unit: "% (상반기 누적 전년비)", sub: "2026년 1~6월", est: 1, extra: [["상반기 투자액","3조 8,074억 위안"],["주택투자","2조 9,300억 위안(-17.8%)"],["6월 단월","-26.0%(전월보다 낙폭 확대)"],["자금조달","국내대출·자기조달 감소폭 확대"]], analysis: ["상반기 부동산 개발투자가 전년비 18.0% 줄어든 3조 8,074억 위안을 기록했습니다. 6월 단월로는 -26.0%로 5월보다 낙폭이 오히려 커졌습니다.","이 대시보드의 '고정자산투자(FAI)' 거시지표 카드가 경제 전체의 투자를 본다면, 이 지표는 그 중에서도 가장 부진한 부동산 부문만 따로 떼어 봅니다. 전체 FAI보다 훨씬 더 깊은 골짜기를 보여줍니다.","정부의 완화 정책(계약금 인하, 대출금리 인하)에도 개발업체들의 투자 의지 자체가 회복되지 않고 있다는 것이 업계의 공통된 평가입니다."], watch: "6월 낙폭이 5월보다 커졌다는 점에 주목하세요. 정책 효과가 아직 '투자' 단계까지는 못 미치고 '재고 소진'에만 머물러 있다는 신호입니다.", url: "https://www.stats.gov.cn/sj/zxfb/" },
{ cat: "부동산", id: "c_housearea", name: "신규 주택 착공·판매 면적", org: "국가통계국(NBS)", val: -11.6, unit: "% (상반기 판매면적 전년비)", sub: "2026년 1~6월", est: 1, extra: [["상반기 판매면적","4억 140만㎡(-11.6%)"],["6월 신규착공","5,300만㎡(-26.4%)"],["6월 준공면적","3,100만㎡(-25.0%)"],["재고(상품房 대기매면적)","7억 6,315만㎡(-0.9%, 4개월 연속 감소)"]], analysis: ["상반기 신규 상품주택 판매면적이 4억 140만㎡로 전년비 11.6% 줄었습니다. 6월 신규착공은 -26.4%, 준공은 -25.0%로 판매보다 착공·준공 쪽 낙폭이 훨씬 큽니다.","재고(대기매면적)가 4개월 연속 줄고 있다는 점은 긍정적입니다. 개발업체들이 신규 착공을 줄이면서 쌓여있던 미분양 재고를 소진하는 국면으로 해석됩니다.","다만 이는 '수요 회복'이 아니라 '공급 축소'에 의한 재고 감소라, 진짜 회복 신호로 보려면 판매면적 자체의 감소폭이 먼저 줄어야 합니다."], watch: "착공면적과 판매면적의 낙폭 격차를 보세요. 착공이 판매보다 훨씬 더 빨리 줄고 있다는 것은, 개발업체들이 '앞으로도 안 팔릴 것'이라는 비관적 전망을 갖고 있다는 뜻입니다.", url: "https://www.stats.gov.cn/sj/zxfb/" },
{ cat: "부동산", id: "c_house70", name: "70개 주요도시 주택가격지수", org: "국가통계국(NBS)", val: 1, unit: "(신축 14개 도시 상승, 5월 15개보다 소폭 둔화)", sub: "2026년 6월", est: 1, extra: [["신축 상승도시","14개(5월 15개)"],["기존주택 상승도시","12개(5월과 동일)"],["최대 상승","상하이·항저우·지린 +0.4%"],["기준년도 변경","2026년부터 2025년 기준으로 전환"]], analysis: ["6월 70개 대중도시 중 신축주택 가격이 오른 곳이 14개로, 5월(15개)보다 소폭 줄었습니다. 상하이·항저우·지린이 +0.4%로 가장 많이 올랐고, 베이징은 -0.2%로 하락했습니다.","기존주택(중고주택) 가격은 12개 도시에서 올라 5월과 동일한 수준을 유지했습니다. 상하이가 +0.7%로 가장 강세였습니다.","증권가에서는 핵심 도시의 기존주택 거래가 개선되며 가격 낙폭이 좁혀지고 있다고 평가하지만, 신축 쪽은 여전히 낮은 전년 기저효과 속에서도 완전한 회복까지는 시간이 걸릴 것으로 보고 있습니다."], watch: "상승 도시 수의 증감 추세를 몇 달 이어서 보세요. 이 숫자가 계속 늘어나면 '바닥을 다지고 있다'는 신호로, 반대로 줄면 정책 효과가 옅어지고 있다는 신호로 해석할 수 있습니다.", url: "https://www.stats.gov.cn/sj/zxfb/" },
{ cat: "부동산", id: "c_propfund", name: "부동산 개발업체 자금조달액", org: "국가통계국(NBS)", est: 1, val: -1, unit: "(국내대출·자기조달 감소폭 확대)", sub: "2026년 기준", extra: [["국내대출","감소폭 확대"],["자기조달(자체자금)","기업 내부 유동성 고갈 우려"],["계약금·개인대출","감소폭은 상대적으로 축소"],["정부 대응","백리스트 프로젝트 금융 지원, 지방정부 재고 매입"]], analysis: ["개발업체 자금조달 구조가 '총량 급감·구조 극심한 분화'로 요약됩니다. 국내대출과 자기조달(내부자금)의 감소폭이 확대되며, 기업 내부 유동성이 고갈되고 있다는 우려가 커지고 있습니다.","반면 계약금 및 개인대출(선분양 수취금)의 감소폭은 상대적으로 축소돼, 판매 회수금이 자금조달의 숨통을 일부 틔워주고 있습니다.","정부는 백리스트(화이트리스트) 프로젝트에 대한 금융 지원과 지방정부의 재고 매입(收储)을 통해 자금줄을 터주려 하고 있지만, 이 대시보드의 '개발투자' 카드에서 보듯 아직 투자 회복으로는 이어지지 않고 있습니다."], watch: "계약금·개인대출(판매발 자금)의 개선 속도가 국내대출·자기조달(공급측 자금)의 악화 속도를 따라잡는지 보세요. 이게 역전되면 '팔아서 버티는' 국면에서 '다시 짓기 시작하는' 국면으로 전환될 조짐입니다.", url: "https://www.stats.gov.cn/sj/zxfb/" },
{ cat: "자동차·배터리", id: "c_nev", name: "CPCA/CAAM 신에너지차(NEV) 침투율·판매량", org: "CPCA(중국승용차시장정보연합회) · CAAM(중국자동차공업회)", val: 62.8, unit: "% (6월 소매 침투율, 사상 최고)", sub: "2026년 6월", est: 1, extra: [["CAAM 도매 침투율","58.5%"],["6월 NEV 생산·판매","159.8만·164.3만 대(+26%·+23.6%)"],["상반기 누적","743.8만·744.6만 대(+6.7%·+7.3%)"],["상반기 NEV 수출","235.5만 대(전체 자동차 수출의 46%)"]], analysis: ["6월 CPCA 소매 기준 NEV 침투율이 62.8%로 사상 최고치를 기록했습니다. 고유가로 순수 내연기관차 소매가 42% 급감한 반면, 신에너지차는 견조하게 늘며 '유류차 붕괴·전동화 주도'라는 구도가 뚜렷해졌습니다.","상반기 NEV 수출이 235.5만 대로 전체 자동차 수출의 46%를 차지했고, 6월 단월 수출은 전년비 160% 급증했습니다. 유럽 35%, 동남아 28%, 중동 18% 순으로 수출 시장이 다변화돼 있습니다.","다만 업계 재편이 동시에 진행 중입니다. 리샹·니오 등 '웨이샤오리' 구도가 깨지고 링파오가 반기 35.6만 대로 신흥세력 1위에 올랐으며, 샤오펑 등 일부 브랜드는 판매가 줄었습니다."], watch: "CPCA(소매)와 CAAM(도매) 침투율 격차를 보세요. 소매가 도매보다 높으면 딜러들이 재고를 소진하고 있다는 뜻이고, 반대로 도매가 높으면 재고가 쌓이고 있다는 신호입니다.", url: "http://www.cpca.org.cn/" },
{ cat: "자동차·배터리", id: "c_caam", name: "CAAM 자동차 생산·수출 통계", org: "중국자동차공업회(CAAM)", est: 1, val: 1, unit: "(내연기관 부진, 수출은 견조)", sub: "2026년 기준", extra: [["6월 일반 내연기관 소매","-42%(고유가 영향)"],["일반 하이브리드","-7%"],["자동차 전체 수출","견조, NEV가 견인"],["합자 브랜드 전동화","6월 NEV 판매 +45%, 내연기관 -39%"]], analysis: ["CAAM 통계에서 가장 눈에 띄는 것은 내연기관차의 급격한 붕괴입니다. 6월 순수 내연기관차 소매가 42% 급감했는데, 이는 이 대시보드의 원유·가솔린 원자재 카드에서 확인한 유가 급등과 직접 연결됩니다.","합자 브랜드(폭스바겐·도요타 등 외국계)의 전동화 전환도 가속되고 있습니다. 6월 합자 브랜드 NEV 판매가 전년비 45% 늘어난 반면, 같은 브랜드의 내연기관 판매는 39% 줄었습니다.","전체 자동차 수출은 NEV가 견인하며 견조한 흐름을 이어가고 있어, 내수 부진을 수출이 상당 부분 상쇄하는 구도입니다."], watch: "이 대시보드의 원유(WTI)·가솔린 카드와 함께 보세요. 국제유가가 계속 오르면 중국 내연기관차 소매 붕괴 속도가 더 빨라질 수 있고, 이는 전동화 전환을 되레 가속시키는 역설적 결과로 이어질 수 있습니다.", url: "http://www.caam.org.cn/" },
{ cat: "자동차·배터리", id: "c_battery", name: "차량용 배터리 탑재량(GWh) 및 점유율", org: "CABIA(중국자동차동력전지산업혁신연맹) 추정 종합", est: 1, val: 1, unit: "(NEV 판매 증가에 비례해 견조)", sub: "2026년 기준", extra: [["최대 공급사","CATL·BYD(비야디)"],["배터리 종류","LFP(리튬인산철) 비중 압도적"],["해외 진출","유럽·동남아 현지 공장 확대"],["이 대시보드 연동","'K-배터리 3사 수주잔고'(한국)·리튬가격(원자재) 카드와 비교"]], analysis: ["차량용 배터리 탑재량이 NEV 판매 증가(CPCA 카드 참고)에 비례해 견조하게 늘고 있습니다. CATL과 BYD 두 회사가 세계 시장의 압도적인 비중을 차지하고 있습니다.","LFP(리튬인산철) 배터리가 압도적 비중을 차지하는 것이 한국 배터리 3사(NCM 삼원계 중심)와의 핵심 차이입니다. LFP는 원가가 낮고 리튬 가격 하락의 수혜를 더 직접적으로 받습니다.","중국 배터리 업체들의 유럽·동남아 현지 공장 확대가 이어지며, 이 대시보드의 '한국 K-배터리 3사 수주잔고' 카드와 정면으로 경쟁하는 구도가 심화되고 있습니다."], watch: "이 대시보드의 리튬 가격(원자재 탭)과 함께 보세요. LFP 배터리는 리튬 원가 비중이 커서, 리튬 가격이 계속 낮은 수준을 유지하는 한 중국 배터리 업체들의 원가 경쟁력은 계속 유리하게 작용합니다.", url: "http://www.cabia.org.cn/" },
{ cat: "철강·소재", id: "c_steel", name: "CISA 조강생산량 & 항만재고", org: "중국철강협회(CISA)", est: 1, val: 1, unit: "(생산능력 감축 정책 속 완만한 조정)", sub: "2026년 기준", extra: [["감산 정책","정부의 '조강생산 감축' 방침 지속"],["항만재고","계절적 등락, 구조적 과잉은 여전"],["최대 수요처","건설(부진)·조선(호황)·자동차(견조)"],["수출","동남아·중동向 저가 수출 확대"]], analysis: ["중국 정부의 조강생산 감축 방침 속에 생산량이 완만히 조정되고 있습니다. 다만 건설 수요 부진(부동산 카드 참고)이 워낙 커서, 감산에도 구조적 공급 과잉은 해소되지 않고 있습니다.","수요처별로는 극명하게 엇갈립니다. 건설향 수요는 부동산 부진의 직격탄을 맞는 반면, 조선(수주 호황)·자동차(NEV 확대)向 수요는 견조합니다.","국내 수요 부진을 저가 수출로 메우려는 움직임이 이어지며, 이는 이 대시보드의 '열연·후판 유통가격'(한국) 카드가 언급한 '중국산 저가재의 유통시장 압박'과 정확히 같은 이야기의 다른 면입니다."], watch: "건설향과 조선·자동차向 수요 비중의 변화를 보세요. 건설 비중이 계속 줄고 조선·자동차 비중이 늘면, 중국 철강 산업의 수요 구조 자체가 재편되고 있다는 뜻입니다.", url: "https://www.chinaisa.org.cn/" },
{ cat: "철강·소재", id: "c_ironore", name: "철광석 항만재고 & 수입량", org: "중국 세관총서 · 업계 집계", est: 1, val: 1, unit: "(항만재고 높은 수준, 수입량은 완만)", sub: "2026년 기준", extra: [["최대 수입국","호주·브라질"],["항만재고","1억 톤대 안팎으로 높은 수준"],["가격 결정력","중국 수요가 세계 철광석 가격을 사실상 좌우"],["감산 정책 영향","철광석 수요 증가세 제한"]], analysis: ["중국 주요 항만의 철광석 재고가 여전히 높은 수준(1억 톤대 안팎)을 유지하고 있습니다. 조강생산 감축 정책(CISA 카드 참고)으로 철광석 수요 증가세가 제한되고 있기 때문입니다.","중국이 세계 철광석 수입의 압도적 비중을 차지하고 있어, 중국의 재고·수입 동향이 곧 국제 철광석 가격(호주·브라질 생산업체 주가에도 직결)을 사실상 결정합니다.","건설 수요 부진이 계속되는 한 철광석 수요도 구조적으로 눌릴 가능성이 크지만, 조선·자동차向 철강 수요가 이를 일부 상쇄하고 있습니다."], watch: "항만재고가 계속 쌓이는지, 소진되는지를 보세요. 재고가 계속 쌓이면 중국의 철강 감산 정책이 실제로는 철광석 수요까지 눌러 국제 철광석 가격에 하방 압력을 줄 수 있습니다.", url: "http://www.customs.gov.cn/" },
{ cat: "철강·소재", id: "c_cement", name: "시멘트·유리 유통가격지수", org: "업계 집계(수치망 등)", est: 1, val: -1, unit: "(건설 부진으로 약세 지속)", sub: "2026년 기준", extra: [["최대 수요처","건설(부동산·인프라)"],["부동산 부진 영향","직접적 하방 압력"],["인프라 투자","건설 부진을 일부 상쇄"],["공급 과잉","오랜 기간 누적된 구조적 문제"]], analysis: ["시멘트·유리 유통가격이 건설 수요 부진(부동산 개발투자 -18.0%)의 직격탄을 맞아 약세를 이어가고 있습니다. 이 두 품목은 부동산 경기에 가장 즉각적으로 반응하는 건자재입니다.","정부의 인프라 투자 확대가 건설 수요 부진을 일부 상쇄하고 있지만, 부동산 부문의 감소폭이 워낙 커서 전체 수요 회복으로 이어지지는 못하고 있습니다.","수년간 누적된 생산 과잉 설비도 가격 반등을 어렵게 하는 구조적 요인입니다. 감산 없이는 가격 정상화가 쉽지 않다는 것이 업계의 시각입니다."], watch: "이 대시보드의 '부동산 개발투자' 카드와 함께 보세요. 시멘트·유리는 부동산 경기에 가장 민감한 건자재라, 개발투자가 반등하지 않는 한 가격 회복도 어렵습니다.", url: "https://www.stats.gov.cn/" },
{ cat: "에너지·신재생", id: "c_renewable", name: "NEA 태양광·풍력 신규 설치용량", org: "국가에너지국(NEA)", est: 1, val: 1, unit: "(세계 최대 규모 신규 설치 지속)", sub: "2026년 기준", extra: [["세계 점유율","태양광·풍력 신규 설치의 압도적 비중"],["정책 드라이버","탄소중립·에너지안보 목표"],["보조금 축소","일부 지역 그리드패리티 전환 진행"],["최대 제약","송전망 소화 능력(弃光·弃风 문제)"]], analysis: ["중국의 태양광·풍력 신규 설치용량은 여전히 세계에서 압도적인 규모를 유지하고 있습니다. 탄소중립 목표와 에너지 안보 우려가 동시에 신규 설치를 밀어붙이는 동력입니다.","보조금이 줄어드는 지역에서는 그리드패리티(보조금 없이도 화석연료 대비 경쟁력을 갖추는 수준) 방식으로 전환이 진행되고 있어, 신재생 확대가 재정 부담 없이도 지속될 수 있는 구조로 바뀌고 있습니다.","다만 송전망이 늘어나는 발전용량을 다 소화하지 못해 발전을 일부러 줄이는 '기광·기풍(弃光·弃风)' 문제가 여전히 일부 지역에서 나타나고 있습니다."], watch: "송전망 확충 속도와 신규 설치 속도의 격차를 보세요. 설치가 송전망 확충보다 빠르면 '기광·기풍' 낭비가 커지고, 이는 태양광·풍력 업체들의 실제 발전 수익에 부담을 줍니다.", url: "http://www.nea.gov.cn/" },
{ cat: "에너지·신재생", id: "c_solarchain", name: "태양광 공급망(폴리실리콘~모듈) 가격·수출량", org: "업계 집계(PVInfoLink 등 종합)", est: 1, val: -1, unit: "(전 구간 공급과잉으로 가격 약세)", sub: "2026년 기준", extra: [["폴리실리콘","공급 과잉으로 저가권"],["웨이퍼·셀·모듈","전 구간 마진 압박"],["구조조정","일부 업체 생산 중단·통폐합"],["수출","저가 공세로 물량은 견조"]], analysis: ["폴리실리콘부터 웨이퍼·셀·모듈까지 태양광 공급망 전 구간이 공급 과잉으로 낮은 가격에 머물러 있습니다. 지난 몇 년간의 공격적 증설이 만든 구조적 문제입니다.","가격 약세가 장기화되며 일부 중소 업체들의 생산 중단·통폐합이 이어지고 있고, 정부도 '반내권(反内卷, 과당경쟁 방지)' 차원에서 산업 구조조정을 유도하고 있습니다.","다만 낮은 가격 덕분에 수출 물량 자체는 견조합니다. 전 세계 태양광 설치가 늘어날수록 중국 공급망의 물량 수혜는 계속됩니다."], watch: "정부의 산업 구조조정(반내권) 정책이 실제 생산능력 감축으로 이어지는지 보세요. 감산이 현실화돼야 가격이 반등할 수 있는데, 지금까지는 물량 경쟁이 계속되고 있습니다.", url: "https://www.pvinfolink.com/" },
{ cat: "전자·가전", id: "c_smartphone", name: "CAICT 스마트폰 출하량", org: "중국신식통신연구원(CAICT)", est: 1, val: 1, unit: "(내수 완만, 화웨이 등 국산 브랜드 강세)", sub: "2026년 기준", extra: [["국산 브랜드","화웨이·비보·오포·샤오미 강세"],["애플","중국 내 점유율 경쟁 심화"],["AI폰","신규 수요처로 부각"],["보조금 정책","일부 지방정부 스마트폰 구매 보조금 시행"]], analysis: ["중국 스마트폰 출하량이 국산 브랜드(화웨이·비보·오포·샤오미) 강세 속에 완만한 흐름을 보이고 있습니다. 화웨이의 자체 반도체 기반 스마트폰 복귀가 시장 구도를 다시 흔들고 있습니다.","AI 기능을 탑재한 'AI폰'이 신규 수요처로 부각되며 교체 수요를 자극하고 있고, 일부 지방정부의 스마트폰 구매 보조금 정책도 수요를 뒷받침하고 있습니다.","이 대시보드의 '집적회로(IC) 생산량' 카드와 짝을 이루는 지표로, 스마트폰 출하 호조는 곧 국내 반도체 수요 확대로도 이어집니다."], watch: "애플과 화웨이의 중국 내 점유율 경쟁을 보세요. 화웨이가 계속 점유율을 늘리면, 이는 미국의 대중국 반도체 제재에도 불구하고 중국이 자체 기술로 대응하고 있다는 상징적 신호로 읽힙니다.", url: "http://www.caict.ac.cn/" },
{ cat: "전자·가전", id: "c_ic", name: "집적회로(IC) 생산량", org: "국가통계국(NBS)", est: 1, val: 1, unit: "(AI·자급화 수요로 견조한 증가)", sub: "2026년 기준", extra: [["최대 동력","AI 반도체 자급화 정책"],["SMIC 등","파운드리 가동률 상승"],["미국 수출규제","첨단공정 제약은 여전"],["레거시 공정","범용 반도체 자급률 빠르게 상승"]], analysis: ["중국의 집적회로(IC) 생산량이 AI 반도체 자급화 정책과 맞물려 견조하게 늘고 있습니다. SMIC 등 국내 파운드리의 가동률이 상승하며 이를 뒷받침하고 있습니다.","미국의 첨단공정 장비 수출 규제는 여전히 유효해 최선단 공정(3나노 이하)에는 제약이 있지만, 레거시(성숙) 공정에서는 중국의 자급률이 빠르게 올라가고 있습니다.","이 대시보드의 '일본 SEAJ 반도체장비 출하액'·'미국 SIA 반도체매출' 카드와 함께 보면, 전 세계 반도체 공급망이 미중 갈등 속에서 어떻게 재편되고 있는지 보다 입체적으로 파악할 수 있습니다."], watch: "레거시 공정 생산 비중의 증가 속도를 보세요. 범용 반도체 자급률이 계속 오르면, 저가 범용칩 시장에서 중국이 글로벌 공급 과잉을 유발할 잠재력도 함께 커집니다.", url: "https://www.stats.gov.cn/" },
{ cat: "전자·가전", id: "c_appliance", name: "가전제품 생산·수출 통계", org: "국가통계국(NBS) · 세관총서", est: 1, val: 1, unit: "(에어컨·냉장고·세탁기 수출 견조)", sub: "2026년 기준", extra: [["최대 수출품목","에어컨·냉장고·세탁기"],["내수","완만, 이구환신(구제품 교체) 보조금 영향"],["수출 시장","동남아·중동·아프리카 확대"],["원가 요인","구리·철강 가격 변동에 민감"]], analysis: ["중국 가전제품(에어컨·냉장고·세탁기) 생산과 수출이 견조한 흐름을 이어가고 있습니다. 내수는 정부의 '이구환신'(낡은 제품 교체 지원) 보조금 정책의 영향을 받고 있습니다.","수출 시장이 동남아·중동·아프리카로 계속 확대되며, 선진국 시장 의존도를 낮추는 다변화가 진행되고 있습니다.","구리·철강 등 원자재 가격 변동에 원가가 민감하게 반응하는 산업이라, 이 대시보드의 구리(원자재 탭) 가격 카드와 함께 보면 가전업체들의 원가 부담을 가늠할 수 있습니다."], watch: "이구환신 보조금 정책의 지속 여부와 규모를 확인하세요. 이 정책이 축소되면 내수 가전 수요가 다시 꺾일 수 있어, 수출 의존도가 한층 더 커질 가능성이 있습니다.", url: "https://www.stats.gov.cn/" },
{ cat: "소비·물류", id: "c_express", name: "국가우정국 월간 택배 물동량", org: "국가우정국(SPB)", est: 1, val: 1, unit: "(온라인 소비 확대로 견조한 증가)", sub: "2026년 기준", extra: [["세계 최대 규모","연간 택배 물동량 세계 1위"],["최대 성수기","618(6월)·광군제(11월)"],["단가 하락","물량 증가와 반대로 건당 단가는 계속 하락"],["신선식품·라이브커머스","새로운 물동량 성장 동력"]], analysis: ["국가우정국이 집계하는 월간 택배 물동량이 온라인 소비 확대에 힘입어 견조하게 늘고 있습니다. 중국은 이미 연간 택배 물동량 기준 세계 최대 규모입니다.","라이브커머스(라방 판매)와 신선식품 배송이 새로운 물동량 성장 동력으로 부각되며, 전통적인 의류·잡화 위주 배송을 넘어서는 다변화가 진행되고 있습니다.","다만 업체 간 가격 경쟁이 치열해 물동량은 늘어도 건당 단가는 계속 하락하는 추세라, 물류업체들의 수익성 개선은 물량 증가 속도만큼 빠르지 않습니다."], watch: "618·광군제 같은 성수기 물동량 증가율과 평소 월의 증가율 격차를 보세요. 이 격차가 계속 벌어지면 온라인 소비가 대형 할인 이벤트에 갈수록 집중되고 있다는 뜻입니다.", url: "http://www.spb.gov.cn/" },
{ cat: "소비·물류", id: "c_gmv", name: "618 / 광군제(11.11) 총거래액(GMV)", org: "주요 이커머스 플랫폼 공시·업계 집계 종합", est: 1, val: 1, unit: "(성장률 둔화되지만 여전히 절대 규모 최대)", sub: "2026년 기준", extra: [["최대 플랫폼","티몰·징둥·핀둬둬·더우인"],["성장 둔화","과거 두 자릿수 성장에서 한 자릿수로 둔화"],["라이브커머스 비중","계속 확대"],["가격 경쟁","'반내권' 정책으로 출혈경쟁 완화 시도"]], analysis: ["618(6월 18일 쇼핑축제)과 광군제(11월 11일)는 중국 최대의 연중 온라인 쇼핑 이벤트로, 총거래액(GMV)이 이커머스 업계 전체의 체력을 보여주는 상징적 지표입니다.","다만 최근 몇 년간 GMV 성장률이 과거의 두 자릿수에서 한 자릿수로 둔화되는 추세입니다. 시장이 이미 성숙 단계에 접어들었다는 뜻으로 해석됩니다.","라이브커머스(더우인·콰이쇼우 등)의 비중이 계속 커지고 있고, 정부가 '반내권(과당 가격경쟁 방지)' 정책을 통해 플랫폼 간 출혈 할인 경쟁을 완화하려는 움직임도 나타나고 있습니다."], watch: "플랫폼별 GMV 발표 방식이 최근 비공개로 전환되는 경우가 늘고 있다는 점에 유의하세요. 정확한 비교가 어려워지고 있어, 업계 추정치와 실제 소비 데이터(사회소비품총액)를 함께 봐야 전체 그림을 알 수 있습니다.", url: "https://www.tmall.com/" },
{ cat: "소비·물류", id: "c_port", name: "상하이/닝보-저우산 항만 컨테이너 물동량", org: "상하이국제항무집단 · 닝보저우산항 공시", est: 1, val: 1, unit: "(세계 최대 컨테이너항 지위 유지)", sub: "2026년 기준", extra: [["상하이항","세계 최대 컨테이너 처리량"],["닝보저우산항","세계 2~3위권"],["수출 컨테이너","반도체·NEV·가전 수출 증가로 견조"],["운임 지수","CCFI 카드와 직결"]], analysis: ["상하이항과 닝보-저우산항의 컨테이너 물동량이 반도체·NEV·가전 등 중국의 주력 수출품 호조에 힘입어 견조한 흐름을 이어가고 있습니다. 두 항만 모두 세계 최상위권 처리량을 유지하고 있습니다.","이 대시보드의 CPCA(NEV 수출)·CAICT(스마트폰)·가전제품 카드에서 확인된 수출 호조가 실제 물류량으로도 확인되는 셈입니다.","항만 물동량은 CCFI(중국컨테이너운임지수) 카드와 짝을 이루는 지표로, 물동량이 늘어도 선복 공급이 더 빠르게 늘면 운임은 오히려 하락할 수 있어 두 지표를 함께 봐야 합니다."], watch: "물동량 증가율과 CCFI 운임지수의 방향이 같은지 보세요. 물동량은 느는데 운임이 내리면, 선사들의 선복 공급 과잉이 원인일 가능성이 큽니다.", url: "https://www.portshanghai.com.cn/" },
{ cat: "소비·물류", id: "c_ccfi", name: "CCFI (중국컨테이너운임지수)", org: "상하이항운교역소(SSE)", est: 1, val: 1, unit: "(항로별 운임 등락 엇갈림)", sub: "2026년 기준", extra: [["대상 항로","미주·유럽·동남아 등 주요 수출항로"],["홍해 리스크","일부 항로 우회로 운임 변동성 확대"],["선복 공급","신조선 인도 증가로 공급 과잉 우려"],["SCFI와의 관계","상하이발 수출 운임의 또 다른 대표 지수"]], analysis: ["CCFI(중국컨테이너운임지수)가 항로별로 엇갈린 움직임을 보이고 있습니다. 미주·유럽向 운임은 물동량 호조에도 신조선 인도 증가에 따른 선복 과잉 우려로 상승이 제한적입니다.","홍해(수에즈 운하) 우회 리스크가 이어지는 항로에서는 운항 거리가 늘어난 만큼 일시적으로 운임이 높게 유지되는 경우가 있습니다.","이 대시보드의 '한국 신조선가지수·수주잔고' 카드에서 언급된 조선업 호황(LNG선 중심)과, 컨테이너선 신조 발주가 늘어나는 것은 결이 다른 이야기입니다 — 컨테이너선 공급 과잉이 계속되면 운임에는 오히려 하방 압력입니다."], watch: "신조 컨테이너선의 인도 스케줄과 물동량 증가 속도를 비교하세요. 선복 공급이 물동량 증가보다 빠르면 운임은 구조적으로 눌릴 가능성이 큽니다.", url: "https://en.sse.net.cn/indices/ccfinew.jsp" },
{id:"ccaixin",fam:"기업·심리",org:"차이신 / S&P Global",src:"Caixin(RatingDog) · S&P Global 중국 제조업·서비스 PMI",name:"차이신(레이팅독) PMI",
  microCat: "PMI·산업활동",

 series:[["1월",50.8],["2월",51.0],["3월",51.4],["4월",51.5],["5월",51.8,1],["6월",51.6,1]],
 extra:[["5월","51.8"],["표본","중소·수출 기업 중심"],["NBS와의 격차","+1.2p"],["명칭 변경","차이신 → 레이팅독"]],
 what:"S&P Global이 작성하는 민간 PMI입니다. 오랫동안 '차이신 PMI'로 불렸으나 후원사가 바뀌며 '레이팅독(RatingDog) PMI'로 명칭이 변경됐습니다. NBS PMI와 달리 중소기업과 수출 기업 비중이 높습니다.",
 imp:"NBS PMI와 짝으로 봐야 의미가 생깁니다. NBS는 대형 국유·내수 기업, 민간 PMI는 중소·수출 기업을 봅니다. 둘의 격차가 곧 '수출과 내수의 격차'이고, 중국 경제의 이중구조를 재는 가장 좋은 도구입니다.",
 sched:["매월","1영업일(제조업) · 3영업일(서비스)","09:45 CST","8월 3일경 (7월분)"],
 why:["6월 민간 제조업 PMI가 51.6으로 5월 51.8에서 소폭 하락할 것으로 예상됩니다.",
 "NBS PMI(50.4)보다 1.2포인트 높습니다. 이 격차가 핵심 정보입니다.",
 "민간 조사가 더 높다는 것은 수출 중심 중소기업이 내수 중심 대기업보다 잘 나가고 있다는 뜻입니다. 6월 수출 +27%와 정확히 일치합니다.",
 "역사적으로 이 지표는 수출 강세를 반영해 NBS보다 높게 나오는 경향이 있습니다. 지금은 그 경향이 특히 두드러진 국면입니다."],
 watch:"두 PMI의 격차를 매월 계산해 보세요. 격차가 벌어지면 수출 의존 심화, 좁혀지면 내수 회복입니다. 리밸런싱 성공 여부를 재는 가장 간단한 척도입니다.",
 url:"https://www.pmi.spglobal.com/",
 yr:{u:"pt",lab:"연말 제조업 PMI",v:[51.9,51.5,49.7,51.5,53.0,50.9,49.0,50.8,50.5,50.9,51.6],n:[
 "51.9. 민간 부문이 먼저 회복했습니다.",
 "51.5. 안정적 확장.",
 "49.7. 무역전쟁으로 수축. 수출 기업이 먼저 타격받았습니다.",
 "51.5. 회복.",
 "53.0. 11년 중 최고. 글로벌 공급망 공백을 중국이 채웠습니다.",
 "50.9. 원자재 급등으로 둔화.",
 "49.0. 봉쇄로 수축.",
 "50.8. 재개방 회복.",
 "50.5. 완만한 확장.",
 "50.9. 관세에도 우회 수출로 버텼습니다.",
 "51.6. NBS(50.4)보다 1.2p 높습니다. 수출 우위 구조입니다."],
 arc:"두 PMI의 격차 역사가 중국 경제의 성격 변화를 보여줍니다. 2018년 무역전쟁 때는 민간(49.7)이 NBS(49.4)와 비슷하게 나빴습니다. 그런데 2026년에는 민간이 1.2포인트 높습니다. 수출은 좋고 내수는 나쁜 상태가 통계로 확인되는 것입니다. 중국 정부가 원하는 리밸런싱(수출→내수)은 지금 정반대로 진행되고 있습니다."}}
];

const MICRO_EA = [
{ cat: "자동차", id: "e_acea", name: "ACEA 신차 등록 대수", org: "유럽자동차공업협회(ACEA)", est: 1, val: 1, unit: "(고유가 속 완만한 회복)", sub: "2026년 기준", extra: [["최대 시장","독일·프랑스·이탈리아·스페인"],["전기차 비중","보조금 축소 지역에서 성장 둔화"],["관세 리스크","미국向 수출에 부담"],["중국 브랜드","유럽 시장 점유율 확대 지속"]], analysis: ["유럽 신차 등록 대수가 고유가 부담 속에서도 완만한 회복세를 보이고 있습니다. 이 대시보드의 원유·가솔린 원자재 카드에서 확인한 유가 상승이 유럽 소비자들의 신차 구매 결정에도 영향을 주고 있습니다.","전기차 보조금이 줄어든 지역(독일 등)에서는 전동화 속도가 주춤한 반면, 여전히 지원이 두터운 지역은 성장세를 유지해 국가별 편차가 뚜렷합니다.","BYD·체리 등 중국 브랜드의 유럽 시장 점유율 확대가 계속되며, 유럽 완성차 업체들의 저가 시장 방어가 새로운 경영 과제로 떠올랐습니다."], watch: "중국 브랜드의 월별 점유율 추이를 보세요. 이 비중이 계속 늘면 유럽 완성차 업체들의 가격 정책·라인업 전략에 구조적 변화가 뒤따를 수 있습니다.", url: "https://www.acea.auto/" },
{ cat: "자동차", id: "e_vda", name: "VDA 독일 자동차 생산·수출", org: "독일자동차공업협회(VDA)", est: 1, val: 1, unit: "(수출 채산성 관세로 압박)", sub: "2026년 기준", extra: [["최대 수출시장","미국·중국"],["미국 관세","완성차·부품 수익성 직접 압박"],["중국 시장","현지 브랜드와의 경쟁 심화"],["전동화 투자","막대한 설비투자 부담 지속"]], analysis: ["독일 자동차 생산·수출이 미국의 관세 부과와 중국 현지 브랜드와의 경쟁 심화라는 이중 압박을 받고 있습니다. 독일 3대 브랜드(폭스바겐·벤츠·BMW) 모두 미국·중국 두 핵심 시장에서 동시에 어려움을 겪고 있습니다.","전동화 전환에 투입되는 막대한 설비투자가 계속되는 가운데 판매·수익성이 뒷받침되지 않아, 업계 전반의 구조조정(공장 통폐합·인력 감축) 압력이 커지고 있습니다.","이 대시보드의 '일본 JAMA 자동차' 카드와 비교하면, 엔저를 활용하는 일본과 달리 유로화 강세 국면의 독일은 가격 경쟁력 측면에서 상대적으로 불리한 위치에 있습니다."], watch: "미국의 대EU 자동차 관세 협상 진행 상황을 주시하세요. 관세율이 조정되면 독일 자동차 산업의 수익성 전망이 크게 바뀔 수 있습니다.", url: "https://www.vda.de/en" },
{ cat: "항공·방산", id: "e_airbus", name: "에어버스 수주잔고 & 월간 인도량", org: "Airbus SE", val: 9222, unit: "대 (수주잔고, 2026년 6월 말)", sub: "2026년 상반기", est: 1, extra: [["상반기 인도량","351대(전년 306대)"],["상반기 순수주","821대(전년 402대의 2배 이상)"],["2026년 인도목표","약 870대(850~890대 범위)"],["6월 단월 인도","89대(2026년 최고 월간 실적)"]], analysis: ["에어버스 수주잔고가 6월 말 기준 9,222대로 전년비 5% 늘었습니다. 상반기 순수주 821대는 전년 동기(402대)의 두 배가 넘습니다. 현재 인도 속도로도 이 물량을 소화하는 데 10년 넘게 걸립니다.","상반기 인도량은 351대로 전년(306대) 대비 늘었고, 6월 한 달만 89대로 2026년 최고 실적을 기록했습니다. 다만 엔진 공급 부족 등 공급망 병목이 여전히 생산 확대 속도를 제약하고 있습니다.","이 대시보드의 'K-방산 해외수주잔고'(한국)·'조선 수주잔고'(한국) 카드와 비슷한 맥락으로, 수주는 넘치는데 실제 생산·인도 능력이 그 속도를 못 따라가는 산업 전반의 공통된 병목 현상을 보여줍니다."], watch: "엔진 공급업체(프랫앤휘트니 등)의 생산 회복 속도를 함께 보세요. 항공기 자체보다 엔진 조달이 인도 속도의 실질적 제약 요인입니다.", url: "https://www.airbus.com/en/newsroom/press-releases" },
{ cat: "항공·방산", id: "e_eda", name: "유럽 방위산업체 수주액", org: "유럽방위청(EDA) · 각사 공시 종합", est: 1, val: 1, unit: "(국방비 확대로 수주 급증)", sub: "2026년 기준", extra: [["에어버스 D&S","상반기 수주 93억 유로(+83%)"],["최대 동력","유럽 각국 국방비 증액"],["주요 품목","방공시스템·드론·탄약"],["공급망 제약","숙련인력·생산능력 병목"]], analysis: ["유럽 방위산업체 수주액이 각국의 국방비 증액 흐름 속에 급증하고 있습니다. 에어버스 방위·우주 부문만 봐도 상반기 수주가 93억 유로로 전년 대비 83% 늘었습니다.","우크라이나 전쟁 이후 이어진 유럽 재무장 기조가 정책적으로 굳어지면서, 방공시스템·드론·탄약 등 소모품 성격의 무기체계 수주가 특히 활발합니다.","이 대시보드의 'K-방산 해외수주잔고'(한국) 카드와 정확히 같은 흐름으로, 전 세계적으로 국방비가 늘어나는 국면에서 유럽·한국 방산업체가 동시에 수혜를 보고 있습니다."], watch: "수주액 증가가 실제 생산·인도로 이어지는 속도를 보세요. 방산업계도 항공기 산업처럼 숙련인력·생산능력 병목이 수주 증가 속도를 따라가지 못하는 경우가 흔합니다.", url: "https://eda.europa.eu/" },
{ cat: "소비·명품", id: "e_luxury", name: "유럽 명품 대기업 실적 (LVMH·케어링·에르메스)", org: "각사 실적발표 종합", est: 1, val: -1, unit: "(중국 수요 부진으로 그룹별 실적 엇갈림)", sub: "2026년 기준", extra: [["최대 리스크","중국 내수 명품 소비 둔화"],["에르메스","상대적으로 견조(초고가 희소성 전략)"],["LVMH·케어링","중국 매출 비중 큰 브랜드 부진"],["환율 효과","유로 강세는 매출 환산에 불리"]], analysis: ["유럽 명품 대기업들의 실적이 중국 내수 소비 둔화의 영향을 크게 받으며 그룹별로 엇갈리고 있습니다. 중국 소비자 비중이 특히 큰 브랜드일수록 타격이 큽니다.","에르메스는 초고가·희소성 전략 덕분에 상대적으로 방어력이 좋은 반면, LVMH·케어링 산하 일부 브랜드는 중국·아시아 매출 부진의 직격탄을 맞고 있습니다.","이 대시보드의 '중국 사회소비품총액' 카드에서 확인되는 내수 소비 완만한 회복이, 명품처럼 재량적 고가 소비재에는 아직 온기가 충분히 전해지지 않고 있음을 보여줍니다."], watch: "중국 매출 비중과 실적 발표 시 가이던스 톤을 함께 보세요. 중국 소비 회복 신호가 나오는 브랜드부터 유럽 명품 섹터 전체의 반등이 시작될 가능성이 큽니다.", url: "https://www.lvmh.com/investors" },
{ cat: "환경·에너지", id: "e_ets", name: "EU ETS 탄소배출권 가격 (EUA)", org: "EU 배출권거래제(ETS)", val: 91.08, unit: "유로/톤 (2026년 평균 전망)", sub: "2026년 기준", est: 1, extra: [["2025년 평균","약 75.15유로"],["CBAM 공식 첫 분기가격","75.36유로(4월)"],["연간 배출한도 축소율","4.3%(2024년부터), 2028년 4.4%로 확대"],["2030년 전망","기관별 145~200유로까지 상이"]], analysis: ["EU 배출권(EUA) 가격이 2026년 평균 톤당 91.08유로로 전망되며, 2025년(75.15유로) 대비 상승이 예상됩니다. 탄소국경조정메커니즘(CBAM)이 2026년부터 전면 시행되며 공급 축소와 수요 확대가 동시에 가격을 밀어올리고 있습니다.","CBAM은 철강·알루미늄·시멘트·비료·수소·전력 6개 부문에 적용되는 세계 최초의 탄소국경세로, 4월 첫 공식 분기가격이 톤당 75.36유로로 발표됐습니다.","이 대시보드의 'EUROFER 유럽철강시장' 카드와 직결됩니다. 탄소가격이 오를수록 유럽 철강업체의 원가 부담이 커지고, 이는 결국 저탄소 생산으로의 전환 압력이자 동시에 수입산 대비 가격 경쟁력 문제로 이어집니다."], watch: "CBAM 시행이 실제 수입품 가격에 반영되는 속도를 보세요. 이 메커니즘이 제대로 작동하면 역내 철강·알루미늄 업체의 '탄소 누출'(값싼 고탄소 수입품에 밀리는 현상) 우려가 줄어들 수 있습니다.", url: "https://climate.ec.europa.eu/eu-action/eu-emissions-trading-system-eu-ets_en" },
{ cat: "기계·제조업", id: "e_vdma", name: "VDMA 기계·플랜트 수주액", org: "독일기계공업협회(VDMA)", est: 1, val: 1, unit: "(해외수주는 견조, 국내수주 부진)", sub: "2026년 기준", extra: [["최대 수주처","반도체·자동화 설비"],["국내 수주","독일 제조업 경기 부진 영향"],["해외 수주","미국·아시아向 상대적으로 견조"],["에너지비용","독일 제조업 경쟁력의 구조적 약점"]], analysis: ["독일 기계·플랜트 수주액이 국내외에서 엇갈린 흐름을 보이고 있습니다. 해외 수주(특히 미국·아시아)는 반도체·자동화 설비 수요에 힘입어 상대적으로 견조한 반면, 국내 수주는 독일 제조업 경기 부진의 영향을 받고 있습니다.","높은 에너지 비용이 독일 제조업 전반의 구조적 경쟁력 약점으로 계속 지목되고 있어, 이 대시보드의 'PPI(생산자물가)' 카드에서 확인되는 유로존 물가 압력과도 맞닿아 있습니다.","이 대시보드의 '일본 JMTBA 공작기계'·'한국 반도체 수출' 카드와 비교하면, 글로벌 반도체·AI 투자 붐이 독일 기계 산업에도 부분적으로 온기를 전하고 있음을 알 수 있습니다."], watch: "국내와 해외 수주의 격차 추이를 보세요. 해외 수주만 늘고 국내가 계속 부진하면, 독일 제조업 경기 자체의 회복이라기보다 특정 글로벌 수요(반도체 등)에 기댄 반사이익일 가능성이 큽니다.", url: "https://www.vdma.org/en/" },
{ cat: "환경·에너지", id: "e_wind", name: "WindEurope 풍력 신규 설치 용량", org: "WindEurope", est: 1, val: 1, unit: "(육상풍력 중심으로 완만한 증가)", sub: "2026년 기준", extra: [["최대 시장","독일·스페인·영국"],["해상풍력","인허가 지연·공급망 병목 지속"],["정책 드라이버","EU 그린딜·에너지안보 목표"],["공급망 리스크","터빈 제조사 수익성 압박"]], analysis: ["유럽 풍력 신규 설치용량이 육상풍력을 중심으로 완만히 늘고 있습니다. 독일·스페인·영국이 최대 시장이며, EU의 그린딜 목표와 러시아산 에너지 의존 탈피 정책이 계속 동력이 되고 있습니다.","해상풍력은 인허가 지연과 공급망 병목으로 계획 대비 설치 속도가 더딘 편입니다. 터빈 제조사들의 수익성 압박도 신규 프로젝트 투자 결정을 조심스럽게 만드는 요인입니다.","이 대시보드의 '중국 NEA 태양광·풍력 신규설치' 카드와 비교하면, 중국이 압도적인 물량으로 밀어붙이는 반면 유럽은 인허가·공급망 문제로 상대적으로 더딘 속도를 보인다는 차이가 있습니다."], watch: "해상풍력 프로젝트의 인허가 진행 상황을 보세요. 이 병목이 풀리는 시점이 유럽 풍력산업 가속화의 핵심 변곡점이 될 수 있습니다.", url: "https://windeurope.org/" },
{ cat: "바이오·제약", id: "e_ema", name: "EMA 신약 허가·권고 건수", org: "유럽의약품청(EMA)", est: 1, val: 1, unit: "(허가·권고 건수 완만한 증가)", sub: "2026년 기준", extra: [["CHMP 권고","EMA 산하 위원회의 시판허가 권고"],["희귀질환약","가속심사 경로 활용 확대"],["미국 FDA와의 관계","같은 신약이 양쪽에 동시 신청되는 경우 많음"],["허가 후","각 회원국별 약가·급여 협상은 별도"]], analysis: ["EMA(유럽의약품청)의 신약 허가·CHMP(약물사용자문위원회) 권고 건수가 완만히 늘고 있습니다. 이 대시보드의 '미국 FDA 승인·PDUFA' 카드와 짝을 이루는 유럽판 지표입니다.","희귀질환 치료제의 가속심사 경로 활용이 늘면서, 임상 3상 완료 전 조건부 허가를 받는 사례도 함께 증가하고 있습니다.","EMA 허가는 시작일 뿐이고, 실제 매출로 이어지려면 각 회원국별로 별도의 약가·급여 협상을 거쳐야 해서, 미국(FDA 승인 후 곧바로 시장 접근)보다 상업화까지 시차가 더 긴 구조적 차이가 있습니다."], watch: "CHMP 권고 이후 각 주요국(독일·프랑스 등)의 약가 협상 타결 속도를 함께 보세요. 허가는 받았어도 급여 등재가 늦어지면 실제 매출 반영은 그만큼 지연됩니다.", url: "https://www.ema.europa.eu/en/medicines" },
{ cat: "바이오·제약", id: "e_pharmatrade", name: "유럽 제약사 수출입 통계", org: "Eurostat 무역통계", est: 1, val: 1, unit: "(제약이 유로존 최대 수출 품목군 중 하나)", sub: "2026년 기준", extra: [["최대 수출국","독일·아일랜드·벨기에"],["아일랜드","다국적 제약사 유럽 생산기지 역할"],["미국 관세 리스크","제약 관세 부과 논의 지속"],["무역흑자 기여","유로존 무역수지 개선의 핵심 축"]], analysis: ["제약(의약품)은 유로존에서 가장 큰 수출 품목군 중 하나로, 이 대시보드의 '무역수지' 거시지표 개선에 상당 부분 기여하고 있습니다. 독일·아일랜드·벨기에가 최대 수출국입니다.","아일랜드는 낮은 법인세를 활용해 다국적 제약사들의 유럽 생산기지 역할을 하고 있어, 아일랜드 한 나라의 제약 수출액이 유로존 전체 무역수지에 큰 영향을 줄 정도로 비중이 큽니다.","미국이 제약 수입에 관세를 부과할 가능성이 계속 논의되고 있어, 만약 현실화되면 유로존의 대미 무역흑자 중 상당 부분을 차지하는 이 품목군에 직접 타격이 될 수 있습니다."], watch: "미국의 제약 관세 정책 논의를 주시하세요. 이 대시보드의 유로존 '무역수지' 카드가 흑자를 유지하는 데 제약 수출이 핵심적인 역할을 하고 있어, 관세가 현실화되면 그 흑자 규모에 직접 영향을 줄 수 있습니다.", url: "https://ec.europa.eu/eurostat/web/international-trade-in-goods" },
{ cat: "철강·소재", id: "e_eurofer", name: "EUROFER 유럽 철강시장 보고서", org: "유럽철강연합회(EUROFER)", val: 0.4, unit: "% (2026년 명목소비 전년비 전망)", sub: "2026년 1분기 전망", est: 1, extra: [["2026년 명목소비","1억 3,500만 톤 전망"],["가동률(1분기)","65.4%(2025년 평균 65%와 비슷)"],["2027년 전망","+2.2%로 개선 기대"],["최대 수요처","건설·기계·자동차"]], analysis: ["EUROFER는 2026년 EU 철강 명목소비가 전년비 0.4% 늘어난 1억 3,500만 톤에 그칠 것으로 전망합니다. 2025년 3년 연속 감소 이후 겨우 플러스로 돌아섰지만, '진짜 회복'과는 거리가 있다고 스스로 평가합니다.","1분기 가동률이 65.4%로 2025년 평균(65%)과 거의 같은 수준에 머물러 있어, 수요가 소폭 늘어도 공급 능력은 여전히 크게 남아돈다는 근본적인 문제를 보여줍니다.","2027년에는 건설·기계·자동차 수요 개선에 힘입어 +2.2% 성장이 기대되지만, EUROFER는 '높은 에너지 비용과 글로벌 무역 불확실성이 계속 발목을 잡고 있다'고 지적합니다."], watch: "이 대시보드의 'EU ETS 탄소배출권가격' 카드와 함께 보세요. EUROFER는 탄소비용이 오르는 만큼 저렴한 전력·수소 공급이 뒷받침돼야 한다고 요구하고 있어, 두 지표가 유럽 철강산업의 딜레마를 함께 보여줍니다.", url: "https://www.eurofer.eu/" },
{id:"ezewc",

 series:[["1월",-78],["2월",-76],["3월",-80],["4월",-88],["5월",-90],["6월",-85]],
 extra:[["기대지수","약 -5"],["기대-현황 격차","약 80p"],["2017년 최고","+89.3"],["2024년","-93.1"]],
 what:"ZEW가 금융시장 전문가에게 '독일의 현재 경기 상황이 좋은가'를 물은 결과입니다. 함께 발표되는 '기대지수'(향후 6개월 전망)와 짝을 이룹니다. 0이 균형점입니다.",
 imp:"기대지수만 보면 독일 경제를 크게 오독합니다. 기대는 0 근처를 오가지만 현재상황은 8년째 깊은 마이너스입니다. 즉 '지금은 최악인데 곧 나아질 것'이라는 기대가 매년 반복되고 매년 빗나가고 있습니다. 이 두 지수의 격차가 독일 경제의 실상을 가장 정직하게 보여줍니다.",
 sched:["매월","둘째 화요일 (기대지수와 동시)","11:00 CET","8월 11일경"],
 why:["현재상황지수가 -85 안팎의 깊은 마이너스에 머물러 있습니다. 전문가 대다수가 독일의 현재 경기를 '나쁘다'고 평가하고 있습니다.","같은 조사의 기대지수는 -5 정도입니다. 80포인트에 달하는 이 격차가 핵심 정보입니다.","해석하면 이렇습니다. '지금은 매우 나쁘지만 6개월 뒤에는 중립 정도는 될 것이다.' 그런데 이 기대가 2019년 이후 거의 매년 나왔고 매년 빗나갔습니다.","4~5월에 저점을 찍은 것은 이란 사태 때문입니다. 에너지 수입국인 독일에 유가 급등은 직접적 타격입니다."],
 watch:"기대지수 단독으로 보지 마세요. 현재상황과의 격차가 벌어질수록 '희망 회로'입니다. 격차가 좁혀지며 현재상황이 올라와야 진짜 회복입니다.",
 url:"https://www.zew.de/en/press/economic-sentiment",
 yr:{u:"pt",lab:"연말 현재상황지수",v:[17,89.3,45.3,-19.9,-66.5,-7.4,-61.4,-77.1,-93.1,-80,-85],n:["17.0. 플러스권. 독일 경기가 실제로 괜찮던 마지막 시기입니다.","89.3. 11년 중 최고. 독일 호황의 정점이었습니다.","45.3. 무역전쟁으로 크게 하락했지만 여전히 플러스였습니다.","-19.9. 마이너스 전환. 이후 회복하지 못합니다.","-66.5. 팬데믹 충격.","-7.4. 재개방으로 크게 개선됐습니다. 마지막 회복 시도였습니다.","-61.4. 가스 위기로 급락했습니다.","-77.1. 악화 지속.","-93.1. 11년 중 최저. 2년 연속 역성장이 반영됐습니다.","약 -80. 소폭 개선.","약 -85. 에너지 재급등으로 다시 악화 중입니다."],arc:"2017년 +89.3에서 2024년 -93.1로. 180포인트가 넘는 이 낙차가 독일 경제의 7년입니다. 더 중요한 것은 2019년 마이너스로 돌아선 뒤 단 한 번도 플러스를 회복하지 못했다는 사실입니다. 그동안 기대지수는 여러 차례 플러스로 튀었습니다. 즉 전문가들도 매년 '내년엔 나아질 것'이라 했고 매년 틀렸습니다. 구조적 문제를 순환적 문제로 오독한 7년의 기록입니다."}},
{id:"epmim",fam:"기업·심리",org:"S&P Global / HCOB",src:"S&P Global · HCOB 유로존 제조업 PMI",name:"제조업 PMI",
  microCat: "PMI·경기서베이",
 sub:"2026년 6월 51.4 · 7월 잠정 52.0",val:52.0,prev:51.4,unit:"pt",good:"up",chart:"line",ref:50,
 series:[["2월",51.0],["3월",51.2],["4월",51.5],["5월",51.6,1],["6월",51.4,1],["7월",52.0,1]],
 extra:[["7월 생산지수","53.0 (3개월 최대)"],["확장 지속","5개월 연속"],["고용","계속 감소 중"],["투입비용","상승률 둔화"]],
 what:"제조업 구매담당자에게 신규주문·생산·고용·공급자납기·재고 5개 항목을 물어 가중평균합니다. 별도로 발표되는 '제조업 생산지수'는 종합 PMI 계산에 들어가는 값으로 헤드라인과 다릅니다.",
 imp:"2026년 유로존에서 가장 놀라운 지표입니다. 2022년부터 4년 가까이 50을 밑돌며 '유럽 제조업의 죽음'이라 불렸던 부문이 5개월 연속 확장 중입니다. 다만 회복의 성격을 봐야 합니다. 진짜 수요인지, 가격 인상을 앞둔 선구매인지에 따라 지속성이 완전히 달라집니다.",
 sched:["매월","잠정 매월 하순 · 확정 다음 달 1영업일","10:00 CET","8월 3일경 (7월 확정)"],
 why:["7월 제조업 PMI 잠정치가 52.0으로 6월 51.4에서 올랐습니다. 3개월 만의 최대 확장이고 생산지수는 53.0까지 갔습니다.",
 "회복의 원인이 중요합니다. 고객사들이 가격 인상과 공급 차질을 예상해 선구매에 나서면서 재고 축적 수요가 생겼습니다.",
 "이는 양날의 검입니다. 지금은 주문이 늘지만 재고가 쌓이면 이후 주문이 급감합니다. 미래 수요를 앞당겨 쓰는 것이기 때문입니다.",
 "고용은 계속 감소 중이고 기업 심리도 약합니다. 기업들이 이 회복을 지속 가능하다고 보지 않는다는 뜻입니다. 투입비용은 여전히 빠르게 오르지만 상승률은 둔화됐습니다."],

/* fmt()는 데이터 구간에 이미 정의돼 있어 재사용한다 (중복 선언 방지) */

function TrendChart({ points, kind, color, refLine, highlightIndex }) {
  const data = points.map((p, i) => ({ x: p.m || p.label, v: p.v ?? p.value, ver: p.ver ?? p.verified, i }));
  const Comp = kind === "bar" ? BarChart : LineChart;
  return (
    <ResponsiveContainer width="100%" height={150}>
      <Comp data={data} margin={{ top: 6, right: 8, left: -18, bottom: 0 }}>
        <CartesianGrid stroke={C.grid} strokeDasharray="2 3" vertical={false} />
        <XAxis dataKey="x" tick={{ fontSize: 9, fill: C.ink60, fontFamily: "IBM Plex Mono" }} axisLine={{ stroke: C.grid }} tickLine={false} />
        <YAxis tick={{ fontSize: 9, fill: C.ink60, fontFamily: "IBM Plex Mono" }} axisLine={false} tickLine={false} width={44} domain={["auto", "auto"]} />
        <Tooltip contentStyle={{ background: C.ink, border: 0, borderRadius: 2, fontSize: 11, fontFamily: "IBM Plex Mono" }}
          labelStyle={{ color: C.paper, opacity: .7 }} itemStyle={{ color: C.paper }} />
        {refLine != null && <ReferenceLine y={refLine} stroke={C.ink} strokeDasharray="4 3" />}
        {highlightIndex != null && <ReferenceLine x={data[highlightIndex]?.x} stroke={color} strokeOpacity={0.35} strokeDasharray="3 2" />}
        {kind === "bar"
          ? <Bar dataKey="v" fill={color} radius={[2, 2, 0, 0]} />
          : <Line type="monotone" dataKey="v" stroke={color} strokeWidth={2}
              dot={(p) => <circle key={p.payload.i} cx={p.cx} cy={p.cy}
                r={highlightIndex === p.payload.i ? 4.5 : 2.8}
                fill={p.payload.ver || highlightIndex === p.payload.i ? color : C.paper2}
                stroke={color} strokeWidth={1.4} />} />}
      </Comp>
    </ResponsiveContainer>
  );
}

function Accordion({ title, defaultOpen, color, children }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{ borderTop: `1px solid ${C.grid}`, marginTop: 12, paddingTop: 11 }}>
      <button onClick={() => setOpen((o) => !o)}
        style={{ display: "flex", justifyContent: "space-between", width: "100%", background: "none", border: 0, cursor: "pointer", padding: 0 }}>
        <span className="mono" style={{ fontSize: 9.5, letterSpacing: ".14em", color: C.ink60 }}>{title}</span>
        <span style={{ fontSize: 15, color: C.ink60, transform: open ? "rotate(45deg)" : "none", transition: "transform .15s" }}>＋</span>
      </button>
      {open && <div style={{ marginTop: 11 }}>{children}</div>}
    </div>
  );
}

function CorrMatrix({ cids, corrC, SH2, corSel, setCorSel }) {
  const CELL = 27;
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ borderCollapse: "collapse" }}>
        <thead>
          <tr>
            <th style={{ width: 44 }}></th>
            {cids.map((c) => (
              <th key={c} style={{ width: CELL, height: 42, verticalAlign: "bottom", padding: "0 0 4px" }}>
                <div className="mono" style={{ fontSize: 8, color: C.ink60, writingMode: "vertical-rl", transform: "rotate(180deg)", height: 36 }}>{SH2(c)}</div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {cids.map((r) => (
            <tr key={r}>
              <td className="mono" style={{ fontSize: 9.5, color: C.ink60, textAlign: "right", paddingRight: 6, whiteSpace: "nowrap" }}>{SH2(r)}</td>
              {cids.map((c) => {
                if (r === c) return <td key={c} style={{ width: CELL, height: CELL, background: C.ink }} />;
                const k = corrC(r, c);
                if (!k) return <td key={c} style={{ width: CELL, height: CELL, background: C.paper2, border: `1px solid ${C.grid}` }} />;
                const a = Math.min(Math.abs(k[0]), 1) * 0.9;
                const bg = k[0] > 0 ? `rgba(31,79,216,${a})` : `rgba(180,71,42,${a})`;
                const sel = corSel && corSel[0] === r && corSel[1] === c;
                return (
                  <td key={c} onClick={() => setCorSel([r, c])}
                    style={{ width: CELL, height: CELL, background: bg, cursor: "pointer", textAlign: "center",
                      outline: sel ? `2px solid ${C.ink}` : "none", outlineOffset: -2 }}>
                    <span className="mono" style={{ fontSize: 7.5, color: a > 0.5 ? C.paper2 : C.ink }}>
                      {k[0] > 0 ? "+" : "−"}{Math.abs(k[0]).toFixed(2).slice(1)}
                    </span>
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{ display: "flex", gap: 14, marginTop: 10, flexWrap: "wrap", fontSize: 9.5, color: C.ink60 }}>
        <span><i style={{ display: "inline-block", width: 9, height: 9, background: "#1F4FD8", borderRadius: 1, marginRight: 4 }} />같은 방향</span>
        <span><i style={{ display: "inline-block", width: 9, height: 9, background: "#B4472A", borderRadius: 1, marginRight: 4 }} />반대 방향</span>
        <span>진할수록 관계가 강함</span>
      </div>
    </div>
  );
}

  const CHAIN_C = CHAINS[country];
  const SH2 = (id) => SHORT[id] || SHORT_X[id] || "";
  const corrC = (a, b) => CORR_C[a + "|" + b] || CORR_C[b + "|" + a] || null;

  return (
    <div style={{ maxWidth: 720, margin: "0 auto", padding: 20 }}>

        경로가 나옵니다. 값은 표본 상관계수가 아니라 구조적 관계의 방향과 세기입니다.

      <div style={{ background: C.paper2, border: `1px solid ${C.grid}`, borderRadius: 2, padding: 16, marginTop: 16 }}>
        {corSel && corrC(corSel[0], corSel[1]) ? (
          <>
            <div className="mono" style={{ fontSize: 9.5, letterSpacing: ".1em", color: C.ink60, marginBottom: 8 }}>전달 경로</div>
            <div className="disp" style={{ fontSize: 18, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{SH2(corSel[0])} ↔ {SH2(corSel[1])}</div>
            <div className="mono" style={{ fontSize: 11.5, marginBottom: 10, fontWeight: 600, color: corrC(corSel[0], corSel[1])[0] > 0 ? "#1F4FD8" : "#B4472A" }}>
              {corrC(corSel[0], corSel[1])[0] > 0 ? "같은 방향" : "반대 방향"} · 강도 {Math.abs(corrC(corSel[0], corSel[1])[0]).toFixed(2)}

/* ══════════════════════════ 로그인 ══════════════════════════
   Google·Apple 로그인은 각자 발급받은 클라이언트 ID를 아래에 채워야 실제로
   동작합니다. 이 값들을 채우지 않아도 앱은 정상 작동하며, 그 경우 Google·
   Apple 버튼을 누르면 안내 문구만 뜨고 게스트 로그인만 즉시 가능합니다.

   - Google: https://console.cloud.google.com 에서 OAuth 클라이언트 ID 발급
     (승인된 자바스크립트 원본에 이 페이지를 올릴 실제 도메인을 등록해야 함 —
     file:// 로 연 로컬 파일에서는 Google 정책상 동작하지 않습니다)
   - Apple: https://developer.apple.com (유료 개발자 계정 필요)에서
     Service ID 발급 + 도메인·리다이렉트 URI 등록 필요
   ============================================================ */
const AUTH_CONFIG = {
  googleClientId: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
  appleClientId: "YOUR_APPLE_SERVICE_ID",
  appleRedirectURI: "https://your-domain.example.com/",
};

function LoginScreen({ onLogin }) {
  const googleBtnRef = useRef(null);
  const [googleReady, setGoogleReady] = useState(false);
  const [appleReady, setAppleReady] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let cancelled = false;
    let tries = 0;

    const tryInitGoogle = () => {
      if (cancelled || googleReady) return;
      if (typeof window !== "undefined" && window.google && window.google.accounts &&
          AUTH_CONFIG.googleClientId && !AUTH_CONFIG.googleClientId.startsWith("YOUR_")) {
        try {
          window.google.accounts.id.initialize({
            client_id: AUTH_CONFIG.googleClientId,
            callback: (response) => {
              try {
                const payload = JSON.parse(atob(response.credential.split(".")[1]));
                onLogin({ provider: "google", name: payload.name || "Google 사용자", email: payload.email, picture: payload.picture });
              } catch (e) {
                onLogin({ provider: "google", name: "Google 사용자" });
              }
            },
          });
          if (googleBtnRef.current) {
            const btnWidth = googleBtnRef.current ? Math.min(280, Math.max(240, googleBtnRef.current.offsetWidth || 280)) : 280;
            window.google.accounts.id.renderButton(googleBtnRef.current, { theme: "outline", size: "large", width: btnWidth, text: "continue_with" });
          }
          setGoogleReady(true);
        } catch (e) {
          // 다음 재시도에서 다시 시도
        }
      }
    };

    const tryInitApple = () => {
      if (cancelled || appleReady) return;
      if (typeof window !== "undefined" && window.AppleID &&
          AUTH_CONFIG.appleClientId && !AUTH_CONFIG.appleClientId.startsWith("YOUR_")) {
        try {
          window.AppleID.auth.init({
            clientId: AUTH_CONFIG.appleClientId,
            scope: "name email",
            redirectURI: AUTH_CONFIG.appleRedirectURI,
            usePopup: true,
          });
          setAppleReady(true);
        } catch (e) {
          // 다음 재시도에서 다시 시도
        }
      }
    };

    // SDK 스크립트가 async로 로드되는 시점이 앱 스크립트보다 늦을 수 있어,
    // 최대 5초 동안 300ms 간격으로 재시도한다.
    tryInitGoogle();
    tryInitApple();
    const timer = setInterval(() => {
      tries += 1;
      tryInitGoogle();
      tryInitApple();
      if (tries >= 16) clearInterval(timer);
    }, 300);

    return () => { cancelled = true; clearInterval(timer); };
  }, []);

  const handleAppleLogin = async () => {
    if (!appleReady) {
      alert("Apple 로그인을 쓰려면 AUTH_CONFIG의 appleClientId·appleRedirectURI를 채우고, 실제 https 도메인에서 열어야 합니다.");
      return;
    }
    setBusy(true);
    try {
      const res = await window.AppleID.auth.signIn();
      const name = res && res.user && res.user.name ? `${res.user.name.firstName || ""} ${res.user.name.lastName || ""}`.trim() : "Apple 사용자";
      onLogin({ provider: "apple", name: name || "Apple 사용자" });
    } catch (e) {
      alert("Apple 로그인을 진행하지 못했습니다.");
    } finally {
      setBusy(false);
    }
  };

  const handleGuest = () => onLogin({ provider: "guest", name: "게스트" });

  return (
    <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ maxWidth: 380, width: "100%" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 9, marginBottom: 8, justifyContent: "center" }}>
          <span className="serif" style={{ fontSize: 26, fontWeight: 600, color: C.ink, letterSpacing: ".04em" }}>Ecostat</span>
        </div>
        <p style={{ fontSize: 12.5, color: C.ink60, textAlign: "center", lineHeight: 1.7, marginBottom: 28 }}>
          로그인하고 5개국 거시지표·원자재·미시지표를 확인하세요.
        </p>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, alignItems: "center" }}>
          <div ref={googleBtnRef} style={{ minHeight: 44, width: "100%", maxWidth: 280, display: "flex", justifyContent: "center", overflow: "hidden" }} />
          {!googleReady && (
            <button onClick={() => alert("Google 로그인을 쓰려면 AUTH_CONFIG의 googleClientId를 채우고, 실제 https 도메인에서 열어야 합니다.")}
              style={{ width: "100%", padding: "11px 0", border: `1px solid ${C.grid}`, borderRadius: 3, background: C.paper2, color: C.ink, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
              Google로 계속하기
            </button>
          )}

          <button onClick={handleAppleLogin} disabled={busy}
            style={{ width: "100%", padding: "11px 0", border: 0, borderRadius: 3, background: C.ink, color: C.paper, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
             Apple로 계속하기
          </button>

          <button onClick={handleGuest}
            style={{ width: "100%", padding: "11px 0", border: `1px solid ${C.grid}`, borderRadius: 3, background: "transparent", color: C.ink60, fontSize: 12.5, cursor: "pointer", marginTop: 6 }}>
            게스트로 계속하기
          </button>
        </div>

        <p style={{ fontSize: 9.5, color: C.ink60, lineHeight: 1.6, marginTop: 22, textAlign: "center" }}>
          Google·Apple 로그인은 각자 발급받은 클라이언트 ID를 스크립트 상단 AUTH_CONFIG에 채우고, 실제 https 도메인에서 열어야 동작합니다. 지금 당장 확인만 하시려면 게스트로 계속하기를 눌러주세요.
        </p>
      </div>
    </div>
  );
}

                구독하기
              </button>
            </div>
          ))}
        </div>
        <p style={{ fontSize: 10, color: C.ink60, lineHeight: 1.6, marginTop: 20, borderTop: `1px solid ${C.grid}`, paddingTop: 14 }}>
          이 화면은 시뮬레이터입니다. 실제 RN 앱에서는 Google Play/App Store 결제가 진행되고,
          결제가 확인되는 즉시 이 잠금이 풀립니다. 설정 탭에서 언제든 상태를 되돌릴 수 있습니다.
        </p>
      </div>
    </div>
  );
}

const TABS = [
  { id: "거시지표", Icon: TabIconMacro },
  { id: "미시지표", Icon: TabIconMicro },
  { id: "원자재", Icon: TabIconCommodity },
  { id: "발표일", Icon: TabIconCalendar },
  { id: "상관관계", Icon: TabIconCorr },
  { id: "설정", Icon: TabIconSettings },
];

function MacroConsoleFullPreview() {
  const [user, setUser] = useState(() => {
    try {
      const saved = typeof window !== "undefined" && window.localStorage ? window.localStorage.getItem("ecostat_user") : null;
      return saved ? JSON.parse(saved) : null;
    } catch (e) {
      return null;
    }
  });
  const handleLogin = (u) => {
    setUser(u);
    try { window.localStorage.setItem("ecostat_user", JSON.stringify(u)); } catch (e) {}
  };
  const handleLogout = () => {
    setUser(null);
    try { window.localStorage.removeItem("ecostat_user"); } catch (e) {}
  };

  const [view, setView] = useState("거시지표");
  const [country, setCountry] = useState("US");
  const [year, setYear] = useState(2026);
  const [famFilter, setFamFilter] = useState("전체");
  const [catFilter, setCatFilter] = useState("전체");
  const [simStatus, setSimStatus] = useState("trial"); // trial | expired | subscribed
  const [simDaysLeft, setSimDaysLeft] = useState(19);

  const onCountryChange = (id) => { setCountry(id); setFamFilter("전체"); };

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  const blocked = simStatus === "expired";

  return (
    <div style={{ minHeight: "100vh", background: C.paper, fontFamily: "'IBM Plex Sans KR', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
        .mono { font-family: 'IBM Plex Mono', monospace; }
        .disp { font-family: 'IBM Plex Sans KR', sans-serif; }
        .serif { font-family: 'Newsreader', 'Noto Serif KR', serif; }
        * { box-sizing: border-box; }
        select { font-family: 'IBM Plex Mono', monospace; }
        body { margin: 0; overflow-x: hidden; }
        img, svg, table { max-width: 100%; }
        button { -webkit-tap-highlight-color: transparent; }
        @media (max-width: 380px) {
          .eco-kicker { display: none; }
        }
      `}</style>

      {blocked ? (
        <PaywallScreen onSubscribe={() => setSimStatus("subscribed")} />
      ) : (
        <>
          <header style={{ background: C.ink, padding: "14px 18px 12px", borderBottom: `1px solid ${C.brass}` }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", rowGap: 6, maxWidth: 720, margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 9, flexWrap: "wrap" }}>
                <span className="serif" style={{ fontSize: 20, fontWeight: 600, color: C.paper, letterSpacing: ".04em" }}>Ecostat</span>
                <span className="mono eco-kicker" style={{ fontSize: 8.5, letterSpacing: ".22em", color: C.brass, whiteSpace: "nowrap" }}>ECONOMIC STATISTICS</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                {simStatus === "subscribed" && (
                  <span className="mono" style={{ fontSize: 8, letterSpacing: ".14em", color: C.brass, border: `1px solid ${C.brass}`, borderRadius: 10, padding: "2px 8px", whiteSpace: "nowrap" }}>MEMBER</span>
                )}
                <span className="mono" style={{ fontSize: 9.5, color: "rgba(237,238,233,.75)", whiteSpace: "nowrap", maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis" }}>{user.name}</span>
                <button onClick={handleLogout} style={{ background: "none", border: 0, cursor: "pointer", flexShrink: 0 }}>
                  <span className="mono" style={{ fontSize: 9, color: C.brass, textDecoration: "underline", whiteSpace: "nowrap" }}>로그아웃</span>
                </button>
              </div>
            </div>
            <div style={{ height: 1, background: `linear-gradient(90deg, ${C.brass}, transparent 70%)`, marginTop: 10, maxWidth: 720, marginLeft: "auto", marginRight: "auto" }} />
          </header>
          <div style={{ paddingBottom: "calc(64px + env(safe-area-inset-bottom))" }}>
            {view === "거시지표" && (
              <IndicatorsTab country={country} setCountry={onCountryChange} year={year} setYear={setYear} famFilter={famFilter} setFamFilter={setFamFilter} />
            )}
            {view === "미시지표" && (
              <MicroTab country={country} setCountry={onCountryChange} />
            )}
            {view === "원자재" && (
              <CommoditiesTab year={year} setYear={setYear} catFilter={catFilter} setCatFilter={setCatFilter} />
            )}
            {view === "발표일" && <CalendarTab country={country} setView={setView} />}
            {view === "상관관계" && <CorrelationTab country={country} />}
            {view === "설정" && (
              <SettingsTab simStatus={simStatus} setSimStatus={setSimStatus} simDaysLeft={simDaysLeft} setSimDaysLeft={setSimDaysLeft} />
            )}
          </div>

          {/* 하단 탭바 */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(250,248,240,.94)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)",
            boxShadow: "0 -1px 0 rgba(18,22,28,.06), 0 -8px 20px rgba(18,22,28,.05)",
            display: "flex", padding: "9px 4px calc(9px + env(safe-area-inset-bottom))", maxWidth: 720, margin: "0 auto" }}>
            {TABS.map((t) => {
              const on = view === t.id;
              const Icon = t.Icon;
              return (
                <button key={t.id} onClick={() => setView(t.id)}
                  style={{ background: "none", border: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer",
                    padding: "3px 2px", position: "relative", flex: "1 1 0", minWidth: 0 }}>
                  <span style={{
                    display: "flex", alignItems: "center", justifyContent: "center", width: 34, height: 26, borderRadius: 8,
                    background: on ? "rgba(156,122,60,.14)" : "transparent", color: on ? C.brass : C.ink60,
                    transition: "background .15s ease",
                  }}>
                    <Icon size={18} />
                  </span>
                  <span className="mono" style={{ fontSize: 9, letterSpacing: ".01em", color: on ? C.brass : C.ink60, fontWeight: on ? 600 : 400, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: "100%" }}>{t.id}</span>
                </button>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

</script>
